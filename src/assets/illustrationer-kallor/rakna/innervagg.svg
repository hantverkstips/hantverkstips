<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Regelvägg framifrån på linjerat papper, med hammarband överst, syll nederst och fem lodräta reglar av 45 gånger 70 emellan. Över de två högra reglarna sitter en gipsskiva på 13 millimeter, skruvad med jämna mellanrum. En måttbygel mellan två regelmitter är märkt c 450, och en skruv är inringad i rött med anteckningen att skruven sätts var 20 centimeter.">
  <!-- Anteckningsboken, verktygsskiss för /rakna/innervagg/. Blyerts 2 px för stomme, skiva och skruvar,
       blyerts-2 för måttbygel, skruvkors, pekpinne och etiketter, snickarpenna för ringen runt en skruv
       (den enda pennsaken), tumstock bakom nyckeltalet c 450.
       Skala: regelmitt var 80 px = 450 mm, alltså 1 px ≈ 5,6 mm, och skruvarna sitter 36 px isär ≈ 200 mm.
       Hammarband y=58–76, syll y=292–310, skivan x=404–544.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts: hammarband, syll och fem reglar -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150,58 Q347,56 544,58 Q543,67 544,76 Q347,78 150,76 Q151,67 150,58"/>
    <path d="M150,292 Q347,290 544,292 Q543,301 544,310 Q347,312 150,310 Q151,301 150,292"/>
    <path d="M170,76 Q169,184 170,292 M182,76 Q183,184 182,292"/>
    <path d="M250,76 Q249,184 250,292 M262,76 Q263,184 262,292"/>
    <path d="M330,76 Q329,184 330,292 M342,76 Q343,184 342,292"/>
    <path d="M410,76 Q409,184 410,292 M422,76 Q423,184 422,292"/>
    <path d="M490,76 Q489,184 490,292 M502,76 Q503,184 502,292"/>
  </g>

  <!-- Blyerts-2: måttbygel mellan regelmitt 256 och 336, och pekpinne till den vänstra regeln -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M256,262 Q296,261 336,262 M256,257 v10 M336,257 v10"/>
  </g>
  <path d="M130,112 Q150,110 168,116" fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round"/>

  <!-- Gipsskivan över de två högra reglarna. Papper som fyllning, så att stommen ligger bakom -->
  <path d="M404,76 Q474,74 544,76 Q542,184 544,292 Q474,294 404,292 Q406,184 404,76" fill="#f5efe3" stroke="#2a2521" stroke-width="2" stroke-linejoin="round"/>

  <!-- Blyerts: skruvarna i skivan, längs de två regelmitterna, 36 px isär -->
  <g fill="none" stroke="#2a2521" stroke-width="2">
    <circle cx="416" cy="110" r="6"/>
    <circle cx="416" cy="146" r="6"/>
    <circle cx="416" cy="182" r="6"/>
    <circle cx="416" cy="218" r="6"/>
    <circle cx="416" cy="254" r="6"/>
    <circle cx="496" cy="110" r="6"/>
    <circle cx="496" cy="182" r="6"/>
    <circle cx="496" cy="218" r="6"/>
    <circle cx="496" cy="254" r="6"/>
  </g>
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M412,106 l8,8 M420,106 l-8,8 M412,142 l8,8 M420,142 l-8,8 M412,178 l8,8 M420,178 l-8,8 M412,214 l8,8 M420,214 l-8,8 M412,250 l8,8 M420,250 l-8,8"/>
    <path d="M492,106 l8,8 M500,106 l-8,8 M492,178 l8,8 M500,178 l-8,8 M492,214 l8,8 M500,214 l-8,8 M492,250 l8,8 M500,250 l-8,8"/>
  </g>

  <!-- Tumstock bakom nyckeltalet -->
  <rect x="250" y="228" width="68" height="26" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 284 241)"/>

  <!-- Snickarpenna: ringen runt en skruv, öppen som när man ringar in för hand -->
  <path d="M435,140 C431,123 397,121 394,145 C391,168 410,178 425,170 C434,165 438,153 435,145" fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="152" y="47" fill="#625a50">hammarband</text>
    <text x="350" y="47" fill="#ad3519">skruv var 20 cm</text>
    <text x="48" y="119" fill="#625a50">45 × 70</text>
    <text x="254" y="249">c 450</text>
    <text x="424" y="282" fill="#625a50">gips 13 mm</text>
    <text x="152" y="335" fill="#625a50">syll</text>
  </g>
</svg>
