    <path d="M70,336 Q195,334 320,336 Q445,338 570,336"/>
    <path d="M560,329 L570,336 L560,343"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="64" y="62" fill="#625a50">överskåp</text>
    <text x="55" y="255" fill="#625a50">bänkskiva</text>
    <text x="117.5" y="312" text-anchor="middle">tvättat</text>
    <text x="252.5" y="312" text-anchor="middle">mattat</text>
    <text x="387.5" y="312" text-anchor="middle">grundat</text>
    <text x="522.5" y="312" text-anchor="middle">målat</text>
