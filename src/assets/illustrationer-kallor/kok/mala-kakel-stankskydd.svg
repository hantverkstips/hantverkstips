<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Måla kakel på stänkskyddet mellan bänk och överskåp i köket, i fyra steg från tvättat till målat.">
  <!-- Anteckningsboken. Blyerts 2 px för överskåpen, bänkskivan och plattorna i de två första fälten, blyerts-2 för
