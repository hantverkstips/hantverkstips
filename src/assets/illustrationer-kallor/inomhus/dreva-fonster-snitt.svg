<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Spalten mellan fönsterkarm och vägg sedd uppifrån, med utsidan upptill och insidan nedtill. Ytterst i spalten är det tomt bakom fodret, i mitten sitter drevet löst packat, innerst en bottningslist med fogmassa ovanpå. Vindskyddet ligger under ytterpanelen och väggens ångbroms går fram till bottningslisten. En pil från rummet visar att rumsluften stoppas vid fogmassan. Spalten är 10 till 15 mm.">
  <!-- Anteckningsboken. Blyerts 2 px för vägg, karm, foder, bottningslist och fogmassa, blyerts-2 för
       skraffering, drev, vindskydd, ledare och måttbygel, snickarpenna för pilen från rummet (enda pennsaken),
       tumstock bakom nyckeltalet 10 till 15 mm. Skala i spalten: 3 px per mm (45 px = 15 mm).
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2: regeln skrafferad, x 165 till 300, y 54 till 300 -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M170,62 l10,10 M192,62 l10,10 M214,62 l10,10 M236,62 l10,10 M258,62 l10,10 M280,62 l10,10"/>
    <path d="M181,84 l10,10 M203,84 l10,10 M225,84 l10,10 M247,84 l10,10 M269,84 l10,10"/>
    <path d="M170,106 l10,10 M192,106 l10,10 M214,106 l10,10 M236,106 l10,10 M258,106 l10,10 M280,106 l10,10"/>
    <path d="M181,128 l10,10 M203,128 l10,10 M225,128 l10,10 M247,128 l10,10 M269,128 l10,10"/>
    <path d="M170,150 l10,10 M192,150 l10,10 M214,150 l10,10 M236,150 l10,10 M258,150 l10,10 M280,150 l10,10"/>
    <path d="M181,172 l10,10 M203,172 l10,10 M225,172 l10,10 M247,172 l10,10 M269,172 l10,10"/>
    <path d="M170,194 l10,10 M192,194 l10,10 M214,194 l10,10 M236,194 l10,10 M258,194 l10,10 M280,194 l10,10"/>
    <path d="M181,216 l10,10 M203,216 l10,10 M225,216 l10,10 M247,216 l10,10 M269,216 l10,10"/>
    <path d="M170,238 l10,10 M192,238 l10,10 M214,238 l10,10 M236,238 l10,10 M258,238 l10,10 M280,238 l10,10"/>
    <path d="M181,260 l10,10 M203,260 l10,10 M225,260 l10,10 M247,260 l10,10 M269,260 l10,10"/>
    <path d="M170,282 l10,10 M192,282 l10,10 M214,282 l10,10 M236,282 l10,10 M258,282 l10,10 M280,282 l10,10"/>
  </g>

  <!-- Blyerts: ytterpanel, regel, gipsskiva, foder ute, karm, bottningslist, fogmassa -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150,40 Q225,39 300,40 Q301,47 300,54 Q225,55 150,54 Q149,47 150,40 Z"/>
    <path d="M165,54 Q166,177 165,300 M300,54 Q299,177 300,300"/>
    <path d="M150,300 Q225,301 300,300 Q301,307 300,314 Q225,315 150,314 Q149,307 150,300 Z"/>
    <path d="M240,26 Q310,25 380,26 Q381,33 380,40 Q310,41 240,40 Q239,33 240,26 Z"/>
    <path d="M345,54 Q392,53 440,54 Q441,177 440,300 Q392,301 345,300 Q344,177 345,54 Z"/>
    <circle cx="322" cy="272" r="13"/>
    <path d="M301,290 Q322,289 344,290 Q345,302 344,314 Q322,315 301,314 Q300,302 301,290 Z"/>
    <path d="M150,296 H300 L317,283" stroke-dasharray="8 5"/>
  </g>

  <!-- Blyerts-2: drevet som löst klotter, vindskyddet, måttbygel och ledare -->
  <path d="M305,108 Q322,100 340,110 Q322,118 305,122 Q322,126 340,134 Q322,142 305,146 Q322,150 340,158 Q322,166 305,170 Q322,174 340,182 Q322,190 305,194 Q322,198 340,206 Q322,214 305,218 Q322,222 340,230 Q322,238 305,242 Q322,246 340,252" fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M150,58 H300" fill="none" stroke="#625a50" stroke-width="1.5" stroke-dasharray="6 4" stroke-linecap="round"/>
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M300,17 H345 M300,12 v10 M345,12 v10"/>
  </g>
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M144,44 L238,33"/>
    <path d="M144,70 L150,59"/>
    <path d="M144,292 L150,296"/>
    <path d="M448,80 L348,80"/>
    <path d="M448,174 L346,176"/>
    <path d="M448,258 L336,268"/>
    <path d="M448,296 L346,302"/>
  </g>

  <!-- Tumstock bakom nyckeltalet -->
  <rect x="348" y="4" width="134" height="24" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 415 16)"/>

  <!-- Snickarpenna: pilen från rummet som stoppas vid fogmassan -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M322,356 Q323,340 322,324"/>
    <path d="M314,332 L322,322 L330,332"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="352" y="24">10 till 15 mm</text>
    <text x="548" y="44" fill="#625a50">ute</text>
    <text x="548" y="356" fill="#625a50">inne</text>
    <text x="44" y="50" fill="#625a50">foder</text>
    <text x="44" y="76" fill="#625a50">vindskydd</text>
    <text x="44" y="184" fill="#625a50">vägg</text>
    <text x="44" y="298">ångbroms</text>
    <text x="0" y="0" fill="#625a50" transform="translate(404 240) rotate(-90)">fönsterkarm</text>
    <text x="452" y="84" fill="#625a50">tom kanal</text>
    <text x="452" y="178">löst drev</text>
    <text x="452" y="262">bottningslist</text>
    <text x="452" y="300">fogmassa</text>
    <text x="336" y="338" fill="#ad3519">rumsluften</text>
    <text x="336" y="358" fill="#ad3519">stoppas här</text>
  </g>
</svg>
