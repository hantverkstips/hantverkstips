<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Regelvägg framifrån med hammarband i taket, syll i golvet och fem lodräta reglar mellan dem. En kortling sitter mellan två reglar. Måttbygeln för regelavståndet är märkt cc 400 vid ett lag gips och cc 600 vid två lag, och en anteckning säger att reglarna kapas högst 15 mm kortare än rumshöjden, med den översta regelns ände inringad.">
  <!-- Anteckningsboken. Blyerts 2 px för stomme, tak och golv, blyerts-2 för måttbygel och etiketter,
       snickarpenna för ringen runt regelns kapade ände (enda pennsaken), tumstock bakom nyckeltalet cc 400.
       Inte skalenlig: regelavståndet är jämnt och väggen kortare än verkligheten.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts: tak, golv, hammarband, syll, reglar, kortling -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130,30 Q355,28 580,30"/>
    <path d="M130,328 Q355,330 580,328"/>
    <path d="M150,38 Q335,36 520,38 Q519,47 520,56 Q335,58 150,56 Q151,47 150,38"/>
    <path d="M150,300 Q335,298 520,300 Q519,309 520,318 Q335,320 150,318 Q151,309 150,300"/>
    <path d="M165,56 Q164,180 165,300 M175,56 Q176,180 175,300"/>
    <path d="M245,56 Q244,180 245,300 M255,56 Q256,180 255,300"/>
    <path d="M325,56 Q324,180 325,300 M335,56 Q336,180 335,300"/>
    <path d="M405,56 Q404,180 405,300 M415,56 Q416,180 415,300"/>
    <path d="M485,56 Q484,180 485,300 M495,56 Q496,180 495,300"/>
    <path d="M336,162 Q368,161.5 402,162 Q401.5,173 402,184 Q368,184.5 336,184 Q336.5,173 336,162"/>
  </g>

  <!-- Måttbygel i blyerts-2: regelavståndet mellan regelmitt och regelmitt -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M250,276 H330 M250,271 v10 M330,271 v10"/>
  </g>

  <!-- Papperslappar bakom etiketterna som korsar reglar -->
  <rect x="336" y="138" width="98" height="22" fill="#f5efe3"/>
  <rect x="244" y="214" width="190" height="54" fill="#f5efe3"/>

  <!-- Tumstock bakom nyckeltalet cc 400 -->
  <rect x="246" y="216" width="76" height="24" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 284 228)"/>

  <!-- Snickarpenna: ringen runt regelns kapade ände mot hammarbandet -->
  <path d="M192,44 C186,30 150,32 146,50 C142,68 156,80 172,76 C184,73 190,64 189,54" fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="210" y="24">hammarband</text>
    <text x="378" y="24" fill="#625a50">reglar 45 × 70</text>
    <text x="248" y="234" font-size="22">cc 400 (ett lag)</text>
    <text x="248" y="260" font-size="22" fill="#625a50">cc 600 (två lag)</text>
    <text x="340" y="156" font-size="22" fill="#625a50">kortling</text>
    <text x="46" y="316">syll</text>
    <text x="46" y="96" font-size="22" fill="#ad3519">reglar</text>
    <text x="46" y="118" font-size="22" fill="#ad3519">högst 15</text>
    <text x="46" y="140" font-size="22" fill="#ad3519">kortare</text>
  </g>
</svg>
