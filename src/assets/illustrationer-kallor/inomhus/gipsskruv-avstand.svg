<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-label="Gipsskiva 1 200 gånger 2 400 mm framifrån med reglar c 600 streckade bakom. Skruvpunkter c 200 längs kanterna och c 300 i fältet, minst 10 mm från kanten. En skruv för nära kanten är inringad med anteckningen den här spräcker kanten.">
  <!-- Anteckningsboken. Blyerts 2 px för skivan och skruvpunkterna, blyerts-2 för reglar och måttbyglar,
       snickarpenna för ringen runt skruven för nära kanten (enda pennsaken). Inte skalenlig, kantavståndet är
       överdrivet så att det syns. Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="380" fill="url(#linjerat)"/>
  <path d="M40,0 V380" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2: reglar c 600 bakom skivan -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 6">
    <path d="M190,8 V356 M300,8 V356 M410,8 V356"/>
  </g>

  <!-- Blyerts: skivan -->
  <path d="M188,20 Q300,18 412,20 Q411,185 410,352 Q300,351 188,350 Q191,185 190,18" fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Skruvpunkter: kant c 200, fält c 300 -->
  <g fill="#2a2521">
    <circle cx="204" cy="34" r="3.5"/><circle cx="204" cy="61.5" r="3.5"/><circle cx="204" cy="89" r="3.5"/><circle cx="204" cy="116.5" r="3.5"/><circle cx="204" cy="144" r="3.5"/><circle cx="204" cy="171.5" r="3.5"/><circle cx="204" cy="199" r="3.5"/><circle cx="204" cy="226.5" r="3.5"/><circle cx="204" cy="254" r="3.5"/><circle cx="204" cy="281.5" r="3.5"/><circle cx="204" cy="309" r="3.5"/><circle cx="204" cy="336.5" r="3.5"/>
    <circle cx="396" cy="34" r="3.5"/><circle cx="396" cy="61.5" r="3.5"/><circle cx="396" cy="89" r="3.5"/><circle cx="396" cy="116.5" r="3.5"/><circle cx="396" cy="144" r="3.5"/><circle cx="396" cy="171.5" r="3.5"/><circle cx="396" cy="199" r="3.5"/><circle cx="396" cy="226.5" r="3.5"/><circle cx="396" cy="254" r="3.5"/><circle cx="396" cy="281.5" r="3.5"/><circle cx="396" cy="309" r="3.5"/><circle cx="396" cy="336.5" r="3.5"/>
    <circle cx="231.5" cy="34" r="3.5"/><circle cx="259" cy="34" r="3.5"/><circle cx="286.5" cy="34" r="3.5"/><circle cx="314" cy="34" r="3.5"/><circle cx="341.5" cy="34" r="3.5"/><circle cx="369" cy="34" r="3.5"/>
    <circle cx="231.5" cy="336.5" r="3.5"/><circle cx="259" cy="336.5" r="3.5"/><circle cx="286.5" cy="336.5" r="3.5"/><circle cx="314" cy="336.5" r="3.5"/><circle cx="341.5" cy="336.5" r="3.5"/><circle cx="369" cy="336.5" r="3.5"/>
    <circle cx="300" cy="89" r="3.5"/><circle cx="300" cy="130" r="3.5"/><circle cx="300" cy="171" r="3.5"/><circle cx="300" cy="212" r="3.5"/><circle cx="300" cy="253" r="3.5"/><circle cx="300" cy="294" r="3.5"/>
    <!-- skruven för nära kanten -->
    <circle cx="195" cy="152" r="3.5"/>
  </g>

  <!-- Måttbyglar i blyerts-2 -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M176,34 V61.5 M171,34 h10 M171,61.5 h10"/>
    <path d="M314,130 V171 M309,130 h10 M309,171 h10"/>
    <path d="M396,208 H410 M396,203 v10 M410,203 v10"/>
  </g>

  <!-- Snickarpenna: ringen runt skruven för nära kanten -->
  <path d="M206,142 C200,134 184,138 182,150 C180,162 192,168 202,164 C208,162 210,156 209,150" fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="116" y="54" fill="#625a50">c 200</text>
    <text x="322" y="156" fill="#625a50">c 300</text>
    <text x="418" y="214" fill="#625a50">min 10</text>
    <text x="424" y="40" fill="#625a50">reglar c 600</text>
    <text x="190" y="373" fill="#625a50">1 200 × 2 400</text>
    <text x="44" y="126" font-size="22" fill="#ad3519">den här</text>
    <text x="44" y="151" font-size="22" fill="#ad3519">spräcker kanten</text>
  </g>
</svg>
