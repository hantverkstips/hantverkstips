<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Snitt genom en betongplatta som vilar på mark. En streckad linje strax under betongytan visar den zon som torkat ikapp rumsluften. Ett smalt mäthål är borrat rakt ner från ytan och slutar en bit in i plattan. En måttbygel bredvid hålet spänner från ytan till hålets botten och är märkt 0,4 av plattans tjocklek, där talet 0,4 har gul markering. Marken under plattan är skrafferad och löper ut ur bildens underkant. En röd pil pekar på hålet med anteckningen att hålet är förbrukat efteråt.">
  <!-- Anteckningsboken. Blyertsskiss på linjerat papper. Snitt genom en
       källarplatta med ett RBK-mäthål. Plattan är 180 enheter tjock (y 110
       till 290) och hålet slutar på y 182, alltså exakt 0,4 av
       tjockleken, och måttbygeln spänner över precis samma sträcka.
       Ordningen är: skraffering, den streckade ytzonen, papperslappar bakom
       handskriften, gul markering, och först därefter blyertskonturerna, så
       att texten står på papper och inte på skraffering.
       Handskrift i Caveat 500, 24 px, konverteras med npm run illustrationer.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50,
       penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2, tunn: skraffering i betongen -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M100,122 l9,9 M122,122 l9,9 M144,122 l9,9 M166,122 l9,9 M188,122 l9,9 M210,122 l9,9 M232,122 l9,9 M254,122 l9,9 M276,122 l9,9 M298,122 l9,9 M320,122 l9,9 M342,122 l9,9 M364,122 l9,9 M386,122 l9,9 M408,122 l9,9 M430,122 l9,9 M452,122 l9,9 M474,122 l9,9 M496,122 l9,9 M100,144 l9,9 M122,144 l9,9 M144,144 l9,9 M166,144 l9,9 M188,144 l9,9 M210,144 l9,9 M232,144 l9,9 M254,144 l9,9 M276,144 l9,9 M298,144 l9,9 M320,144 l9,9 M342,144 l9,9 M364,144 l9,9 M386,144 l9,9 M408,144 l9,9 M430,144 l9,9 M452,144 l9,9 M474,144 l9,9 M496,144 l9,9 M100,166 l9,9 M122,166 l9,9 M144,166 l9,9 M166,166 l9,9 M188,166 l9,9 M210,166 l9,9 M232,166 l9,9 M254,166 l9,9 M276,166 l9,9 M298,166 l9,9 M320,166 l9,9 M342,166 l9,9 M364,166 l9,9 M386,166 l9,9 M408,166 l9,9 M430,166 l9,9 M452,166 l9,9 M474,166 l9,9 M496,166 l9,9 M100,188 l9,9 M122,188 l9,9 M144,188 l9,9 M166,188 l9,9 M188,188 l9,9 M210,188 l9,9 M232,188 l9,9 M254,188 l9,9 M276,188 l9,9 M298,188 l9,9 M320,188 l9,9 M342,188 l9,9 M364,188 l9,9 M386,188 l9,9 M408,188 l9,9 M430,188 l9,9 M452,188 l9,9 M474,188 l9,9 M496,188 l9,9 M100,210 l9,9 M122,210 l9,9 M144,210 l9,9 M166,210 l9,9 M188,210 l9,9 M210,210 l9,9 M232,210 l9,9 M254,210 l9,9 M276,210 l9,9 M298,210 l9,9 M320,210 l9,9 M342,210 l9,9 M364,210 l9,9 M386,210 l9,9 M408,210 l9,9 M430,210 l9,9 M452,210 l9,9 M474,210 l9,9 M496,210 l9,9 M100,232 l9,9 M122,232 l9,9 M144,232 l9,9 M166,232 l9,9 M188,232 l9,9 M210,232 l9,9 M232,232 l9,9 M254,232 l9,9 M276,232 l9,9 M298,232 l9,9 M320,232 l9,9 M342,232 l9,9 M364,232 l9,9 M386,232 l9,9 M408,232 l9,9 M430,232 l9,9 M452,232 l9,9 M474,232 l9,9 M496,232 l9,9 M100,254 l9,9 M122,254 l9,9 M144,254 l9,9 M166,254 l9,9 M188,254 l9,9 M210,254 l9,9 M232,254 l9,9 M254,254 l9,9 M276,254 l9,9 M298,254 l9,9 M320,254 l9,9 M342,254 l9,9 M364,254 l9,9 M386,254 l9,9 M408,254 l9,9 M430,254 l9,9 M452,254 l9,9 M474,254 l9,9 M496,254 l9,9 M100,276 l9,9 M122,276 l9,9 M144,276 l9,9 M166,276 l9,9 M188,276 l9,9 M210,276 l9,9 M232,276 l9,9 M254,276 l9,9 M276,276 l9,9 M298,276 l9,9 M320,276 l9,9 M342,276 l9,9 M364,276 l9,9 M386,276 l9,9 M408,276 l9,9 M430,276 l9,9 M452,276 l9,9 M474,276 l9,9 M496,276 l9,9"/>
  </g>

  <!-- Blyerts-2, tunn: marken, glesare, utan underkant -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M100,300 l9,9 M126,300 l9,9 M152,300 l9,9 M178,300 l9,9 M204,300 l9,9 M230,300 l9,9 M256,300 l9,9 M282,300 l9,9 M308,300 l9,9 M334,300 l9,9 M360,300 l9,9 M386,300 l9,9 M412,300 l9,9 M438,300 l9,9 M464,300 l9,9 M490,300 l9,9 M100,326 l9,9 M126,326 l9,9 M152,326 l9,9 M178,326 l9,9 M204,326 l9,9 M230,326 l9,9 M256,326 l9,9 M282,326 l9,9 M308,326 l9,9 M334,326 l9,9 M360,326 l9,9 M386,326 l9,9 M412,326 l9,9 M438,326 l9,9 M464,326 l9,9 M490,326 l9,9 M100,352 l9,9 M126,352 l9,9 M152,352 l9,9 M178,352 l9,9 M204,352 l9,9 M230,352 l9,9 M256,352 l9,9 M282,352 l9,9 M308,352 l9,9 M334,352 l9,9 M360,352 l9,9 M386,352 l9,9 M412,352 l9,9 M438,352 l9,9 M464,352 l9,9 M490,352 l9,9"/>
  </g>

  <!-- Blyerts-2, streckad: zonen närmast ytan som torkat ikapp rummet -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-dasharray="5 5" stroke-linecap="round">
    <path d="M94,136 Q300,134 506,136"/>
    <path d="M150,100 Q149,118 150,133"/>
  </g>

  <!-- Papperslapp i hålet, så att skrafferingen inte syns igenom -->
  <rect x="380" y="108" width="20" height="78" fill="#f5efe3"/>

  <!-- Papperslappar bakom handskriften, som ligger över skrafferingen -->
  <rect x="112" y="126" width="232" height="50" fill="#f5efe3"/>
  <rect x="98" y="250" width="156" height="28" fill="#f5efe3"/>
  <rect x="98" y="310" width="82" height="28" fill="#f5efe3"/>

  <!-- Nyckeltalet: gul markering bakom 0,4 -->
  <rect x="300" y="128" width="40" height="23" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.6 320 139)"/>

  <!-- Blyerts: plattan och marken i snitt. Marken saknar underkant med flit -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M88,110 Q300,108 512,110"/>
    <path d="M88,290 Q300,292 512,290"/>
    <path d="M90,108 Q88,200 90,292"/>
    <path d="M510,108 Q512,200 510,292"/>
    <path d="M90,290 Q88,318 90,344"/>
    <path d="M510,290 Q512,318 510,344"/>
  </g>

  <!-- Blyerts: mäthålets väggar och botten -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M382,110 Q381,150 382,178 Q383,182 390,182 Q397,182 398,178 Q399,150 398,110"/>
  </g>

  <!-- Blyerts-2: måttbygel från ytan ner till hålets botten, samma sträcka som hålet -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M356,110 Q354,146 356,182"/>
    <path d="M348,110 H364"/>
    <path d="M348,182 H364"/>
  </g>

  <!-- Snickarpennan: en pil till mäthålet -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M462,78 Q432,84 404,102"/>
    <path d="M414,96 L401,105 L404,90"/>
  </g>

  <text x="94" y="96" font-family="Caveat" font-weight="500" font-size="24" fill="#2a2521">ytan torkar ikapp rummet</text>
  <text x="336" y="148" font-family="Caveat" font-weight="500" font-size="24" fill="#2a2521" text-anchor="end">0,4</text>
  <text x="336" y="172" font-family="Caveat" font-weight="500" font-size="24" fill="#2a2521" text-anchor="end">av plattans tjocklek</text>
  <text x="104" y="272" font-family="Caveat" font-weight="500" font-size="24" fill="#625a50">betongplattan</text>
  <text x="104" y="332" font-family="Caveat" font-weight="500" font-size="24" fill="#625a50">marken</text>
  <text x="566" y="68" font-family="Caveat" font-weight="500" font-size="24" fill="#ad3519" text-anchor="end">hålet är förbrukat efteråt</text>
</svg>
