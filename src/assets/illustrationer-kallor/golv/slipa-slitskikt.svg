<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Snitt genom en lamellparkettbräda. Överst slitskiktet av massivt trä, måttsatt till 3,5 mm med gul markering. Under det ett tjockare mittskikt av stående stavar och underst ett tunt underfaner. En måttbygel till höger visar brädans hela tjocklek, 15 mm. En röd pil pekar på brädans kapade vänstra ände med anteckningen att det är där måttet tas.">
  <!-- Anteckningsboken. Blyertsskiss på linjerat papper. Brädan i blyerts,
       måttbyglar och skikttexter i blyerts-2, mätpunkten i snickarpenna.
       Skala 8 enheter per millimeter, så lagrens höjd i bilden stämmer med
       de tal som står i texten: 3,5 mm slitskikt, 9 mm mittskikt, 2,5 mm
       underfaner, 15 mm totalt. Nyckeltalet 3,5 mm har gul markering.
       Handskrift i Caveat 500, konverteras till banor med npm run illustrationer.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50,
       penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2, tunn: fiberstreck i slitskiktet -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M174,120 Q306,118 438,121 M174,130 Q306,132 438,129"/>
  </g>

  <!-- Blyerts: stående stavar i mittskiktet -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round">
    <path d="M182,141 Q183.5,174 182,207 M208,141 Q209.5,174 208,207 M234,141 Q235.5,174 234,207 M260,141 Q261.5,174 260,207 M286,141 Q287.5,174 286,207 M312,141 Q313.5,174 312,207 M338,141 Q339.5,174 338,207 M364,141 Q365.5,174 364,207 M390,141 Q391.5,174 390,207 M416,141 Q417.5,174 416,207 M442,141 Q443.5,174 442,207"/>
  </g>

  <!-- Blyerts: brädans kontur och de två skiktgränserna -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M156,110 Q300,108 456,110"/>
    <path d="M156,138 Q300,140 456,138"/>
    <path d="M156,210 Q300,208 456,210"/>
    <path d="M156,230 Q300,232 456,230"/>
    <path d="M156,109 Q154,170 156,231"/>
    <path d="M456,109 Q458,170 456,231"/>
  </g>

  <!-- Blyerts-2, tunn: måttbygel över slitskiktet till vänster -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M134,110 Q132,124 134,138"/>
    <path d="M128,110 H154"/>
    <path d="M128,138 H154"/>
  </g>

  <!-- Blyerts-2, tunn: måttbygel över hela brädan till höger -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M472,110 Q474,170 472,230"/>
    <path d="M458,110 H478"/>
    <path d="M458,230 H478"/>
  </g>

  <!-- Blyerts-2, tunn: pekare från underfanerets etikett upp till lagret -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M330,258 Q328,246 330,234"/>
  </g>

  <!-- Snickarpenna: pilen till den kapade änden, där måttet tas -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232,294 Q196,278 170,244"/>
    <path d="M182,244 L168,240 L172,254"/>
  </g>

  <!-- Papperslapp bakom etiketten inne i mittskiktet -->
  <rect x="244" y="164" width="172" height="26" fill="#f5efe3"/>

  <!-- Överstrykning med tumstocksgul bakom nyckeltalet -->
  <rect x="46" y="114" width="78" height="26" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 85 127)"/>

  <!-- Handskrivna anteckningar (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="168" y="100" fill="#625a50">slitskikt</text>
    <text x="50" y="133">3,5 mm</text>
    <text x="486" y="178" fill="#625a50">15 mm</text>
    <text x="248" y="182" fill="#625a50">stående stavar</text>
    <text x="300" y="274" fill="#625a50">underfaner</text>
    <text x="56" y="316" fill="#ad3519">mät vid en kapad ände</text>
  </g>
</svg>
