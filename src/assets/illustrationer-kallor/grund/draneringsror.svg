<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Dräneringsrör i makadambädd med fiberduk, tre rörtyper och brunnarna i husets hörn.">
  <!-- Anteckningsboken, samma hand som dranera-lagren.svg. Huvudbild till /kunskap/grund/draneringsror/.
       Vänster: snitt genom röret, dubbel vägg, i makadam med fiberduken streckad runt stenbädden,
       jorden skrafferad utanför, grundsulan och murens stump i kanten. Rörets underkant under sulans.
       Måttbygel över ytterdiametern, 110 med gul markering, skissens enda mått.
       Höger: tre rörbitar från sidan med en bit bortskuren: dubbelväggigt (slät insida),
       slang med strumpa, enkelväggigt (korrugerad insida). Pennan pekar på den släta insidan.
       Rutan: husets hörn uppifrån, slingan streckad, spolbrunn i högpunkten, dräneringsbrunn i lågpunkten,
       fallpil i blyerts-2. Handskrift i Caveat 500, 24 px, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
