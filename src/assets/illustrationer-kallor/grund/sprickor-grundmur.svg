<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="En grundmur sedd framifrån, med fasadens nedersta del ovanför och marken nedanför. Till vänster en hårfin spricka som går rakt uppifrån och ner i putsen. Till höger en spricka som går snett uppåt från källarfönstrets övre hörn och blir bredare ju längre upp den kommer, inringad med snickarpenna.">
  <!-- Anteckningsboken. Blyertsskiss på linjerat papper. Grundmuren och fasaden i blyerts 2 px,
       betong och mark skrafferad i blyerts-2. Den lodräta hårsprickan är tunn och jämnbred,
       den diagonala sättningssprickan är kraftig och vidgar sig uppåt. Snickarpennan ringar in
       en enda sak. Handskrift i Caveat 500, konverteras till banor av npm run illustrationer.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts: fasadens nedersta remsa, grundmurens språng och källarfönstret -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M89,140 Q300,137 511,140"/>
    <path d="M90,139 Q88,156 90,173 M510,139 Q512,156 510,173"/>
    <path d="M86,174 Q300,171 514,174"/>
    <path d="M86,175 Q84,234 86,292 M514,175 Q516,234 514,292"/>
    <path d="M350,212 Q387,210 424,212 M350,254 Q387,256 424,254"/>
    <path d="M351,211 Q349,233 351,255 M423,211 Q425,233 423,255"/>
  </g>

  <!-- Blyerts-2, tunn: betongskraffering i grundmuren -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M100,186 l9,9 M122,186 l9,9 M144,186 l9,9 M200,186 l9,9 M222,186 l9,9 M440,186 l9,9 M462,186 l9,9 M484,186 l9,9"/>
    <path d="M100,220 l9,9 M122,220 l9,9 M144,220 l9,9 M200,220 l9,9 M222,220 l9,9 M440,220 l9,9 M462,220 l9,9 M484,220 l9,9"/>
    <path d="M100,252 l9,9 M122,252 l9,9 M144,252 l9,9 M200,252 l9,9 M222,252 l9,9 M244,252 l9,9 M266,252 l9,9 M288,252 l9,9 M310,252 l9,9 M440,252 l9,9 M462,252 l9,9 M484,252 l9,9"/>
    <path d="M100,274 l9,9 M122,274 l9,9 M144,274 l9,9 M200,274 l9,9 M222,274 l9,9 M244,274 l9,9 M266,274 l9,9 M288,274 l9,9 M310,274 l9,9 M360,274 l9,9 M382,274 l9,9 M404,274 l9,9 M440,274 l9,9 M462,274 l9,9 M484,274 l9,9"/>
  </g>

  <!-- Blyerts-2, 1 px och jämnbred hela vägen: den hårfina sprickan -->
  <g fill="none" stroke="#625a50" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M177,178 L170,202 L179,226 L171,250 L178,272 L173,288"/>
  </g>

  <!-- Blyerts: sättningssprickan. Samma taggiga linje ritad i tre avsnitt med
       växande bredd, tunn vid fönsterhörnet och tydligt bred i övre änden, så att
       vidgningen syns mot den jämnbreda hårsprickan till vänster -->
  <g fill="none" stroke="#2a2521" stroke-linecap="round" stroke-linejoin="round">
    <path d="M352,214 L340,208 L330,205" stroke-width="1.2"/>
    <path d="M330,205 L318,199 L308,197" stroke-width="2.2"/>
    <path d="M308,197 L296,190 L284,187" stroke-width="3.4"/>
    <path d="M284,187 L272,181 L258,174" stroke-width="4.6"/>
  </g>

  <!-- Snickarpenna: en enda sak som pekas ut, den öppna ringen runt sättningssprickan -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360,226 Q324,242 288,232 Q248,220 248,194 Q250,168 296,170 Q344,174 364,200"/>
  </g>

  <!-- Marken -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52,294 Q300,298 548,294"/>
  </g>
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M60,304 l9,9 M86,304 l9,9 M112,304 l9,9 M138,304 l9,9 M164,304 l9,9 M190,304 l9,9 M216,304 l9,9 M242,304 l9,9 M268,304 l9,9"/>
    <path d="M294,304 l9,9 M320,304 l9,9 M346,304 l9,9 M372,304 l9,9 M398,304 l9,9 M424,304 l9,9 M450,304 l9,9 M476,304 l9,9 M502,304 l9,9 M528,304 l9,9"/>
  </g>

  <!-- Handskrivna anteckningar (Caveat). Ligger på rent papper ovanför huset -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="48" y="44" fill="#625a50">två sprickor i samma grundmur</text>
    <text x="70" y="86" fill="#625a50">hårfin och lodrät,</text>
    <text x="70" y="110" fill="#625a50">den får vara</text>
    <text x="330" y="86" fill="#625a50">snett upp från hörnet,</text>
    <text x="330" y="110" fill="#ad3519">mät den i ett halvår</text>
  </g>
</svg>
