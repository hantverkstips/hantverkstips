<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Skiss av samma krypgrund byggd som varmgrund. Isoleringen ligger på marken ovanpå plastfolien och innanför grundmurens båda sidor, medan golvbjälklaget bara har ett tunt lager. Ventilen i grundmuren till höger är igensatt och inringad för hand. Anteckningen säger att grunden får vara högst tre grader kallare än rummet ovanför.">
  <!-- Anteckningsboken. Blyerts 2 px för hus, bjälklag och grundmur, blyerts-2 för isolerskraffering,
       markplast och anteckningar, snickarpenna för den tätade ventilen (enda pennsaken), tumstock
       bakom nyckeltalet 3 grader. Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Tumstock bakom nyckeltalet -->
  <rect x="166" y="162" width="84" height="25" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 208 174)"/>

  <!-- Blyerts: golv, tunt bjälklag, väggar, grundmur, mark, isolerskivor -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74,112 Q290,110 508,112"/>
    <path d="M74,140 Q290,142 508,140"/>
    <path d="M86,112 Q85,84 86,54"/>
    <path d="M496,112 Q497,84 496,54"/>
    <path d="M76,140 Q75,200 76,263"/>
    <path d="M96,140 Q97,200 96,263"/>
    <path d="M74,262 Q86,264 98,262"/>
    <path d="M486,140 Q485,200 486,263"/>
    <path d="M506,140 Q507,200 506,263"/>
    <path d="M484,262 Q496,264 508,262"/>
    <path d="M482,184 Q496,185 510,184"/>
    <path d="M482,208 Q496,209 510,208"/>
    <path d="M96,258 Q290,260 486,258"/>
    <path d="M0,232 Q38,233 78,232"/>
    <path d="M504,232 Q552,233 600,232"/>
    <path d="M150,114 Q149,126 150,138 M230,114 Q229,126 230,138 M310,114 Q309,126 310,138 M390,114 Q389,126 390,138"/>
    <path d="M118,224 Q290,226 464,224"/>
    <path d="M116,140 Q117,198 116,254"/>
    <path d="M466,140 Q465,198 466,254"/>
    <path d="M98,254 Q290,256 484,254"/>
  </g>

  <!-- Blyerts-2: plastfolien under isoleringen på marken -->
  <g fill="none" stroke="#625a50" stroke-width="3.5" stroke-linecap="round">
    <path d="M100,250 Q290,252 482,250"/>
  </g>

  <!-- Blyerts-2: isolerskraffering på marken, i grundmurarna och i det tunna bjälklaget -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M124,228 l8,8 M146,228 l8,8 M168,228 l8,8 M190,228 l8,8 M212,228 l8,8 M234,228 l8,8 M256,228 l8,8 M278,228 l8,8 M300,228 l8,8 M322,228 l8,8 M344,228 l8,8 M366,228 l8,8 M388,228 l8,8 M410,228 l8,8 M432,228 l8,8 M450,228 l8,8"/>
    <path d="M134,240 l8,8 M156,240 l8,8 M178,240 l8,8 M200,240 l8,8 M222,240 l8,8 M244,240 l8,8 M266,240 l8,8 M288,240 l8,8 M310,240 l8,8 M332,240 l8,8 M354,240 l8,8 M376,240 l8,8 M398,240 l8,8 M420,240 l8,8 M442,240 l8,8"/>
    <path d="M100,146 l8,8 M100,168 l8,8 M100,190 l8,8 M100,212 l8,8 M100,234 l8,8"/>
    <path d="M470,146 l8,8 M470,168 l8,8 M470,190 l8,8 M470,212 l8,8 M470,234 l8,8"/>
    <path d="M106,118 l8,8 M158,118 l8,8 M186,118 l8,8 M238,118 l8,8 M266,118 l8,8 M318,118 l8,8 M346,118 l8,8 M398,118 l8,8 M426,118 l8,8 M454,118 l8,8"/>
  </g>

  <!-- Blyerts-2: markskraffering under grunden och utanför -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M104,266 l10,10 M126,266 l10,10 M148,266 l10,10 M170,266 l10,10 M192,266 l10,10 M214,266 l10,10 M236,266 l10,10 M258,266 l10,10 M280,266 l10,10 M302,266 l10,10 M324,266 l10,10 M346,266 l10,10 M368,266 l10,10 M390,266 l10,10 M412,266 l10,10 M434,266 l10,10 M456,266 l10,10"/>
    <path d="M114,288 l10,10 M136,288 l10,10 M158,288 l10,10 M180,288 l10,10 M202,288 l10,10 M224,288 l10,10 M246,288 l10,10 M268,288 l10,10 M290,288 l10,10 M312,288 l10,10 M334,288 l10,10 M356,288 l10,10 M378,288 l10,10 M400,288 l10,10 M422,288 l10,10 M444,288 l10,10"/>
    <path d="M4,238 l10,10 M26,238 l10,10 M48,238 l10,10"/>
    <path d="M14,260 l10,10 M36,260 l10,10 M58,260 l10,10"/>
    <path d="M514,238 l10,10 M536,238 l10,10 M558,238 l10,10 M580,238 l10,10"/>
    <path d="M524,260 l10,10 M546,260 l10,10 M568,260 l10,10"/>
  </g>

  <!-- Snickarpenna: den igensatta ventilen, ringad för hand -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M488,188 L504,204 M488,204 L504,188"/>
    <path d="M532,172 Q520,154 496,154 Q458,154 452,190 Q448,224 484,234 Q522,242 534,214 Q538,204 535,196"/>
  </g>

  <!-- Papperslappar bakom anteckningarna i marken -->
  <rect x="104" y="310" width="282" height="28" fill="#f5efe3"/>
  <rect x="396" y="310" width="176" height="28" fill="#f5efe3"/>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="110" y="90">50 mm i bjälklaget, mest för ljudet</text>
    <text x="120" y="180">högst 3 grader kallare</text>
    <text x="120" y="210">än rummet ovanför</text>
    <text x="110" y="332" fill="#625a50">cellplast ovanpå markplasten</text>
    <text x="402" y="332" fill="#ad3519">ventilen igensatt</text>
  </g>
</svg>
