    <path d="M186,268 l8,8 M194,268 l-8,8 M210,268 l8,8 M218,268 l-8,8"/>
    <path d="M456,136 l8,8 M464,136 l-8,8 M480,136 l8,8 M488,136 l-8,8 M504,136 l8,8 M512,136 l-8,8"/>
    <path d="M456,158 l8,8 M464,158 l-8,8 M480,158 l8,8 M488,158 l-8,8 M504,158 l8,8 M512,158 l-8,8"/>
    <path d="M456,180 l8,8 M464,180 l-8,8 M480,180 l8,8 M488,180 l-8,8 M504,180 l8,8 M512,180 l-8,8"/>
    <path d="M456,202 l8,8 M464,202 l-8,8 M480,202 l8,8 M488,202 l-8,8 M504,202 l8,8 M512,202 l-8,8"/>
    <path d="M456,224 l8,8 M464,224 l-8,8 M480,224 l8,8 M488,224 l-8,8 M504,224 l8,8 M512,224 l-8,8"/>
    <path d="M456,246 l8,8 M464,246 l-8,8 M480,246 l8,8 M488,246 l-8,8 M504,246 l8,8 M512,246 l-8,8"/>
    <path d="M456,268 l8,8 M464,268 l-8,8 M480,268 l8,8 M488,268 l-8,8 M504,268 l8,8 M512,268 l-8,8"/>
  </g>

  <!-- Blyerts-2: måttbyglar. Varje bygel spänner över exakt det etiketten säger -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96,116 Q109,115 122,116 M96,111 v10 M122,111 v10"/>
    <path d="M124,64 Q118,86 114,108"/>
    <path d="M178,116 Q204,115 230,116 M178,111 v10 M230,111 v10"/>
    <path d="M448,116 Q487,115 526,116 M448,111 v10 M526,111 v10"/>
  </g>

  <!-- Snickarpenna: daggpunktens läge, ute i det yttre lagret till vänster och inne i muren till höger -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 6">
    <path d="M109,122 Q108,210 109,300"/>
    <path d="M420,122 Q419,210 420,300"/>
  </g>

  <!-- Handskrift (Caveat), allt vågrätt -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="44" y="54" fill="#625a50">minst</text>
    <text x="102" y="54" fill="#625a50">en tredjedel</text>
    <text x="238" y="54" fill="#625a50">ute</text>
    <text x="204" y="92" fill="#625a50" text-anchor="middle">resten inne</text>
    <text x="487" y="92" fill="#625a50" text-anchor="middle">allt inne</text>
    <text x="109" y="326" fill="#ad3519" text-anchor="middle">daggpunkt</text>
    <text x="420" y="326" fill="#ad3519" text-anchor="middle">daggpunkt</text>
    <text x="150" y="352" text-anchor="middle">varm och torr</text>
    <text x="420" y="352" text-anchor="middle">kall och fuktig</text>
  </g>
</svg>
