    <path d="M58,246 l10,10 M80,246 l10,10"/>
    <path d="M48,268 l10,10 M70,268 l10,10"/>
    <path d="M58,290 l10,10 M80,290 l10,10"/>
    <path d="M318,136 l10,10 M340,136 l10,10 M362,136 l10,10"/>
    <path d="M328,158 l10,10 M350,158 l10,10 M372,158 l10,10"/>
    <path d="M318,180 l10,10 M340,180 l10,10 M362,180 l10,10"/>
    <path d="M328,202 l10,10 M350,202 l10,10 M372,202 l10,10"/>
    <path d="M318,224 l10,10 M340,224 l10,10 M362,224 l10,10"/>
    <path d="M328,246 l10,10 M350,246 l10,10 M372,246 l10,10"/>
    <path d="M318,268 l10,10 M340,268 l10,10 M362,268 l10,10"/>
    <path d="M328,290 l10,10 M350,290 l10,10 M372,290 l10,10"/>
  </g>

  <!-- Blyerts-2: betongprickar i de två grundmurarna -->
  <g fill="#625a50" stroke="none">
    <circle cx="132" cy="124" r="1.4"/><circle cx="154" cy="120" r="1.4"/><circle cx="170" cy="130" r="1.4"/>
    <circle cx="142" cy="146" r="1.4"/><circle cx="164" cy="142" r="1.4"/><circle cx="128" cy="154" r="1.4"/>
    <circle cx="152" cy="166" r="1.4"/><circle cx="172" cy="162" r="1.4"/><circle cx="134" cy="176" r="1.4"/>
    <circle cx="162" cy="188" r="1.4"/><circle cx="140" cy="196" r="1.4"/><circle cx="172" cy="204" r="1.4"/>
    <circle cx="128" cy="212" r="1.4"/><circle cx="154" cy="220" r="1.4"/><circle cx="172" cy="228" r="1.4"/>
    <circle cx="138" cy="236" r="1.4"/><circle cx="162" cy="244" r="1.4"/><circle cx="130" cy="254" r="1.4"/>
    <circle cx="170" cy="262" r="1.4"/><circle cx="146" cy="270" r="1.4"/><circle cx="128" cy="280" r="1.4"/>
    <circle cx="164" cy="286" r="1.4"/><circle cx="140" cy="294" r="1.4"/>
    <circle cx="402" cy="124" r="1.4"/><circle cx="424" cy="120" r="1.4"/><circle cx="440" cy="130" r="1.4"/>
    <circle cx="412" cy="146" r="1.4"/><circle cx="434" cy="142" r="1.4"/><circle cx="398" cy="154" r="1.4"/>
    <circle cx="422" cy="166" r="1.4"/><circle cx="442" cy="162" r="1.4"/><circle cx="404" cy="176" r="1.4"/>
    <circle cx="432" cy="188" r="1.4"/><circle cx="410" cy="196" r="1.4"/><circle cx="442" cy="204" r="1.4"/>
    <circle cx="398" cy="212" r="1.4"/><circle cx="424" cy="220" r="1.4"/><circle cx="442" cy="228" r="1.4"/>
    <circle cx="408" cy="236" r="1.4"/><circle cx="432" cy="244" r="1.4"/><circle cx="400" cy="254" r="1.4"/>
    <circle cx="440" cy="262" r="1.4"/><circle cx="416" cy="270" r="1.4"/><circle cx="398" cy="280" r="1.4"/>
    <circle cx="434" cy="286" r="1.4"/><circle cx="410" cy="294" r="1.4"/>
  </g>

  <!-- Blyerts-2: isoleringen som kryss. Vänster: ett smalt lager ute och ett dubbelt så brett inne -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M101,136 l8,8 M109,136 l-8,8 M101,158 l8,8 M109,158 l-8,8 M101,180 l8,8 M109,180 l-8,8 M101,202 l8,8 M109,202 l-8,8 M101,224 l8,8 M109,224 l-8,8 M101,246 l8,8 M109,246 l-8,8 M101,268 l8,8 M109,268 l-8,8"/>
