<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Två snitt genom samma källarvägg med lika mycket isolering, ritade med grundmuren prickad på samma plats i båda. I det vänstra snittet ligger en tredjedel av isoleringen utanför muren och resten innanför, och den röda streckade daggpunktslinjen stannar ute i det yttre lagret. I det högra ligger all isolering innanför muren, och linjen har flyttat in i betongen. Murarna är märkta varm och torr respektive kall och fuktig.">
  <!-- Anteckningsboken. Prickar är betong, kryss är isolering, snedstreck är mark, samma
       teckenspråk som kallarvagg-inifran. Muren ligger på samma plats i båda snitten och
       isolermängden är lika stor, så det enda som flyttar sig är fördelningen och linjen.
       Vänster: 26 enheter ute och 52 inne, alltså exakt en tredjedel ute, och varje måttbygel
       spänner över precis det etiketten säger. Höger: 78 enheter, allt inne.
       Blyerts 2 px för mur, mark och golv, blyerts-2 för prickar, kryss, skraffering och
       byglar, snickarpenna bara för daggpunktslinjen och dess två etiketter, som hör ihop till
       en sak. Tumstock bakom nyckeltalet en tredjedel. Handskrift i Caveat 500, 24 px, vågrätt
       genomgående, konverteras till banor av npm run illustrationer.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Tumstock bakom nyckeltalet en tredjedel -->
  <rect x="98" y="36" width="126" height="25" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 161 48)"/>

