    <path d="M186,180 l8,8 M194,180 l-8,8 M210,180 l8,8 M218,180 l-8,8"/>
    <path d="M186,202 l8,8 M194,202 l-8,8 M210,202 l8,8 M218,202 l-8,8"/>
    <path d="M186,224 l8,8 M194,224 l-8,8 M210,224 l8,8 M218,224 l-8,8"/>
