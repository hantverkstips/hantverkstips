    <path d="M230,128 Q231,208 230,288"/>
    <path d="M178,288 Q204,289 230,288"/>
    <path d="M230,288 Q261,289 292,288"/>
    <!-- höger snitt: allt inne -->
    <path d="M314,128 Q353,129 392,128"/>
    <path d="M392,112 Q420,113 448,112"/>
    <path d="M392,112 Q391,206 392,300"/>
    <path d="M448,112 Q449,206 448,300"/>
    <path d="M386,300 Q420,301 454,300"/>
    <path d="M448,128 Q487,127 526,128"/>
    <path d="M526,128 Q527,208 526,288"/>
    <path d="M448,288 Q487,289 526,288"/>
    <path d="M526,288 Q544,289 562,288"/>
  </g>

  <!-- Blyerts-2: markskraffering utanför de två murarna -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M48,136 l10,10 M70,136 l10,10"/>
    <path d="M58,158 l10,10 M80,158 l10,10"/>
    <path d="M48,180 l10,10 M70,180 l10,10"/>
    <path d="M58,202 l10,10 M80,202 l10,10"/>
