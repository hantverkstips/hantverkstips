  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- vänster snitt: en tredjedel ute, resten inne -->
    <path d="M44,128 Q70,129 96,128"/>
    <path d="M96,128 Q109,127 122,128"/>
    <path d="M96,128 Q95,208 96,288"/>
    <path d="M96,288 Q109,289 122,288"/>
    <path d="M122,112 Q150,113 178,112"/>
