<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Samma innervägg i genomskärning tre gånger: fukt kring en läckande koppling sprider sig nedåt och syns till sist på tapet och golv.">
  <!-- Anteckningsboken, samma hand som hussvamp-syll.svg. Tre rutor, samma innervägg i genomskärning:
       tapet, skiva, hålrum med vattenrör och koppling, regel, syll på plattan, golv i rummet.
       Först: prickad fuktzon kring kopplingen och två droppar, ytan ren. Senare: zonen har gått ner i syll
       och skiva, ytan ren. Till sist: missfärgad tapet med bubblor nertill och golvet som rest sig vid väggen.
       Pennan pekar på kopplingen i första rutan, enda pennsaken. Tumstock bakom "3 av 10 hem" (Boverket).
       Inga tider, inga mått. Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

