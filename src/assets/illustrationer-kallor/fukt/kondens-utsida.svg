<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Treglasfönster i genomskärning en klar morgon, med imma på utsidan av ytterglaset och torrt glas på insidan.">
  <!-- Anteckningsboken, samma hand som kondens-fonster.svg. Blyerts 2 px för väggens kontur, karmen, bågen, de tre
       glasen, listerna och fönsterblecket, blyerts-2 för väggens skraffering, himlen, utstrålningen och ledarna,
       snickarpenna för dropparna på ytterglasets utsida och ringen runt dem (enda pennsaken), och ledaren till imman.
       Lodrätt snitt, ute till vänster, inne till höger. Inte skalenlig. Ingen tumstock, inga temperaturer.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2 1,25: väggens skraffering -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M304,4 l10,10 M326,4 l10,10 M348,4 l10,10 M370,4 l10,10 M392,4 l10,10 M414,4 l10,10 M436,4 l10,10 M458,4 l10,10"/>
    <path d="M315,17 l10,10 M337,17 l10,10 M359,17 l10,10 M381,17 l10,10 M403,17 l10,10 M425,17 l10,10 M447,17 l10,10"/>
    <path d="M304,312 l10,10 M326,312 l10,10 M348,312 l10,10 M370,312 l10,10 M392,312 l10,10 M414,312 l10,10 M436,312 l10,10 M458,312 l10,10"/>
    <path d="M315,334 l10,10 M337,334 l10,10 M359,334 l10,10 M381,334 l10,10 M403,334 l10,10 M425,334 l10,10 M447,334 l10,10"/>
  </g>

  <!-- Blyerts: väggens kontur, karmen, bågen, tre glas, listerna, fönsterblecket -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M298,30 Q385,31 472,30 M298,300 Q385,299 472,300"/>
    <path d="M340,28 Q339,39 340,50 M440,28 Q441,39 440,50 M338,48 Q390,49 442,48"/>
    <path d="M338,282 Q390,281 442,282 M340,280 Q339,291 340,302 M440,280 Q441,291 440,302"/>
    <path d="M352,46 Q351,57 352,68 M428,46 Q429,57 428,68 M350,66 Q390,67 430,66"/>
    <path d="M350,262 Q390,261 430,262 M352,260 Q351,272 352,284 M428,260 Q429,272 428,284"/>
    <path d="M366,66 Q367,164 366,262 M370,66 Q369,164 370,262 M388,66 Q389,164 388,262 M392,66 Q391,164 392,262 M410,66 Q411,164 410,262 M414,66 Q413,164 414,262"/>
    <path d="M372,78 Q379,78.6 386,78 M394,78 Q401,78.6 408,78 M372,250 Q379,249.4 386,250 M394,250 Q401,249.4 408,250"/>
    <path d="M340,300 Q322,303.5 304,308 l-1.5,5"/>
  </g>

  <!-- Blyerts-2 1,5: himlen, tre bågar och två stjärnor, och utstrålningen från ytterglaset -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M66,82 Q84,72 102,78 M130,66 Q150,56 170,62 M180,88 Q198,79 216,84"/>
    <path d="M94,38 h12 M100,32 v12 M95.8,33.8 l8.399999999999999,8.399999999999999 M104.2,33.8 l-8.399999999999999,8.399999999999999 M190,30 h12 M196,24 v12 M191.8,25.8 l8.399999999999999,8.399999999999999 M200.2,25.8 l-8.399999999999999,8.399999999999999"/>
    <path d="M330,100 q-10.9,-13.2 -27.3,-18 t-27.3,-18 t-27.3,-18 M253.2,55.7 L248,46 L259,46.9"/>
    <path d="M330,132 q-9.5,-12.5 -24.7,-16.7 t-24.7,-16.7 t-24.7,-16.7 M261,91.8 L256,82 L267,83"/>
  </g>

  <!-- Blyerts-2 1,25: ledarna till ytterglaset och till innerglaset -->
  <path d="M320,182 L364,162 M464,165 L418,170" fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round"/>

  <!-- Snickarpenna: dropparna på ytterglasets utsida, täta nertill, och den öppna ringen -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M356,80 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M351,112 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M356.5,146 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M361,182 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M351,190 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M356,198 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M361,206 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M351,212 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M356,222 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5"/>
    <path d="M351,229 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M361,229 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M356,235 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M351,242 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M361,242 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M356,249 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5"/>
    <path d="M362,70 C346,66 339,90 340,150 C341,210 336,258 351,259 C361,259.5 364.5,250 364.5,228 C364.8,180 364.2,130 364.5,90"/>
  </g>
  <path d="M329,237 L347,232" fill="none" stroke="#ad3519" stroke-width="1.25" stroke-linecap="round"/>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="110" y="150" fill="#625a50">ute</text>
    <text x="500" y="110">inne</text>
    <text x="192" y="240" fill="#ad3519">imma på utsidan</text>
    <text x="150" y="190">kallare än luften ute</text>
    <text x="470" y="172">torrt</text>
  </g>
</svg>
