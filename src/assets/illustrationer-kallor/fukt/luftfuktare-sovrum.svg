<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Ett sovrum en vinternatt med en luftfuktare igång, kondens på fönstret och en fuktfläck nere i ytterväggens hörn.">
  <!-- Anteckningsboken, samma hand som kallras.svg. Sovrummet från sidan, yttervägg till vänster med ett tvåglasfönster.
       Luftfuktaren på golvet med ånga i blyerts-2, sängen skymtar till höger. Dropparna på glasets insida i snickarpenna
       (enda pennsaken). Fläcken i hörnet mellan yttervägg och golv i tät skraffering, blyerts-2. Inte skalenlig.
       Tumstock bakom rummets luft, enda markeringen. Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2 1,25: ytterväggens skraffering och fläcken i hörnet -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M43,24 l10,10 M43,46 l10,10 M55,33 l10,10 M55,55 l10,10 M43,206 l10,10 M43,228 l10,10 M43,250 l10,10 M43,272 l10,10 M43,294 l10,10 M43,316 l10,10 M55,215 l10,10 M55,237 l10,10 M55,259 l10,10 M55,281 l10,10 M55,303 l10,10"/>
    <path d="M70,297 Q73,295.6 75.6,294.8 T84.9,294.1 T93.2,298 T100,304.4 T106.4,311.5 T111.2,320.1 T111,330"/>
    <path d="M71,300L73,298M71,305L80,296M71,310L84,297M71,315L88,298M71,320L91,300M71,325L94,302M73,328L96,305M78,328L99,307M83,328L101,310M88,328L104,312M93,328L106,315M98,328L108,318M103,328L109,322"/>
  </g>

  <!-- Blyerts: väggen, fönstret, golvet, luftfuktaren och sängen -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40,17 Q39.5,173 40,333 M70,17 Q70.6,48 70,82 M70,198 Q70.6,265 70,333 M37,20 Q55,19.5 73,20 M37,80 Q55,80.4 73,80 M37,200 Q55,199.6 73,200 M60,82 Q60.8,140 60,198 M66,82 Q65.2,140 66,198"/>
    <path d="M37,330 Q310,331.5 583,330"/>
    <path d="M364,332 Q362,302 370,287 Q390,279 410,287 Q418,302 416,332 M372,304 Q390,303.4 408,304 M384,283 Q383.8,275 384,267 M396,283 Q396.2,275 396,267 M381,268 Q390,267.6 399,268"/>
    <path d="M470,300 Q525,299.4 582,300 M468,318 Q524,318.6 582,318 M470,297 Q469.6,309 470,321 M474,318 V330 M576,318 V330 M580,258 Q580.6,294 580,333 M546,300 Q550,289 564,289 Q576,290 575,300"/>
  </g>

  <!-- Blyerts-2 1,5: ångan från munstycket -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M384,258 q-6,-10 -1,-20 t-1,-20 t-1,-20"/>
    <path d="M390,256 q-6,-10 0,-20 t0,-20 t0,-20 t0,-20"/>
    <path d="M396,258 q-6,-10 1,-20 t1,-20 t1,-20"/>
  </g>

  <!-- Blyerts-2 1,25: ledarna till dropparna och till fläcken -->
  <path d="M108,126 L82,146 M126,280 L99,305" fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round"/>

  <!-- Tumstock bakom rummets luft -->
  <rect x="388" y="42" width="136" height="30" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 456 57)"/>

  <!-- Snickarpenna: dropparna på glasets insida, tätast nedtill -->
  <path d="M72,96 q-3.5,5 -3.5,8 a3.5,3.5 0 0 0 7,0 q0,-3 -3.5,-8z M73,120 q-3.5,5 -3.5,8 a3.5,3.5 0 0 0 7,0 q0,-3 -3.5,-8z M72,140 q-3.5,5 -3.5,8 a3.5,3.5 0 0 0 7,0 q0,-3 -3.5,-8z M73,156 q-3.5,5 -3.5,8 a3.5,3.5 0 0 0 7,0 q0,-3 -3.5,-8z M72,170 q-3.5,5 -3.5,8 a3.5,3.5 0 0 0 7,0 q0,-3 -3.5,-8z M73,184 q-3.5,5 -3.5,8 a3.5,3.5 0 0 0 7,0 q0,-3 -3.5,-8z" fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="394" y="64">45 % vid 21 °C</text>
    <text x="394" y="98">daggpunkt 8,6 °C</text>
    <text x="112" y="124" fill="#ad3519">glaset 5 °C</text>
    <text x="130" y="280" fill="#625a50">väggen 12 °C</text>
  </g>
</svg>
