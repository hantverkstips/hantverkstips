<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Tvättstuga i genomskärning med tvätt på tre linor, avfuktare på golvet och en slang med fall till golvbrunnen.">
  <!-- Anteckningsboken, samma hand som kallare.svg. Tvättstugan i genomskärning: takbjälklag och golvplatta
       skrafferade, väggarna i snitt. Torkställning med tre linor från en stång i taket till högra väggen, tvätt
       på linorna. Avfuktaren som rektangel med galler på golvet under tvätten, utblåset som pil i blyerts längs
       linorna. Slangen med fall från avfuktaren ner i golvbrunnen, ritad i snitt genom golvplattan.
       Frånluftsdonet i taket med tallriken öppen. Dörren stängd, kort pil i blyerts genom springan under.
       Snickarpennan pekar på slangen (enda pennsaken). Nyckeltalet i rutan uppe till vänster med gul markering,
       Energimyndigheten 2017: tumlare med värmepump 0,23 mot avfuktare 0,32 kWh per kilo tvätt.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

