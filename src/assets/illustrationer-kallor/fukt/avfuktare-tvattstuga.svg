292 M149,288 L159,292 L151,299"/>
    <path d="M382,262 C348,264 292,270 266,296 L264,310 M382,268 C352,270 300,276 272,298 L270,310"/>
  </g>

  <!-- Snickarpenna: pekar på slangen (enda pennsaken) -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232,234 Q262,238 294,262"/>
    <path d="M281,260 L295,263 L290,250"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24">
    <text x="86" y="82" fill="#2a2521">0,23 mot 0,32 kWh</text>
    <text x="86" y="106" fill="#2a2521">per kilo tvätt</text>
    <text x="86" y="136" fill="#625a50">tumlare mot avfuktare</text>
    <text x="160" y="222" fill="#ad3519">slang till golvbrunnen</text>
  </g>
</svg>
