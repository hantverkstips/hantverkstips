  <!-- Papperslapp i rutan så att linjeringen inte stör talet -->
  <path d="M74,56 Q174,55 274,56 Q275,101 274,146 Q174,147 74,146 Q73,101 74,56Z" fill="#f5efe3"/>
  <!-- Tumstock: nyckeltalet -->
  <rect x="80" y="63" width="170" height="49" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 165 87)"/>

