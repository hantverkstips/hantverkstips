<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Flödesskiss av två avfuktare. Till vänster sorption: fuktig luft in genom en rotor med kiselgel, torr luft ut, en värmare driver ut vattnet som våtluft genom en slang ut genom väggen. Till höger kondens: fuktig luft in över en kall slinga, vattnet droppar i en tank, torr luft ut. Termometrar under: sorption ner till minus 20, kondens fungerar väl över 15 grader.">
  <!-- Anteckningsboken. Blyerts 2 px för lådor, rotor, slinga och luftpilar, blyerts-2 för skraffering,
       snickarpenna för våtluftspilen ut genom väggen (enda pennsaken), tumstock bakom nyckeltalet 15 °C.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts: sorptionsavfuktaren -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50,60 Q157,58 264,60 Q263,155 262,252 Q157,251 50,250 Q53,155 52,58"/>
    <path d="M248,62 Q247,155 248,250"/>
    <path d="M58,110 H112 M104,103 L113,110 L104,117"/>
    <path d="M140,116 A34,34 0 1 0 140.5,116"/>
    <path d="M168,116 V74 M161,82 L168,73 L175,82"/>
    <path d="M138,220 l8,-8 l8,8 l8,-8 l8,8 l8,-8 l8,8 l8,-8 l8,8"/>
    <path d="M170,208 V190 M163,197 L170,188 L177,197"/>
    <!-- kondensavfuktaren -->
    <path d="M348,60 Q457,58 566,60 Q565,155 564,252 Q457,251 348,250 Q351,155 350,58"/>
    <path d="M356,110 H400 M392,103 L401,110 L392,117"/>
    <path d="M462,96 l10,8 l-10,8 l10,8 l-10,8 l10,8 l-10,8 l10,8 l-10,8"/>
    <path d="M462,174 C461,176 458,179 458,182 A4,4 0 0 0 466,182 C466,179 463,176 462,174"/>
    <path d="M470,188 C469,190 466,193 466,196 A4,4 0 0 0 474,196 C474,193 471,190 470,188"/>
    <path d="M436,200 V240 H492 V200"/>
    <path d="M480,110 H540 M532,103 L541,110 L532,117"/>
    <!-- termometrar -->
    <path d="M70,268 V316 M62,324 a8,8 0 1 0 16,0 a8,8 0 1 0 -16,0 M64,280 h6 M64,292 h6 M64,304 h6"/>
    <path d="M366,268 V316 M358,324 a8,8 0 1 0 16,0 a8,8 0 1 0 -16,0 M360,280 h6 M360,292 h6 M360,304 h6"/>
  </g>
  <!-- Blyerts-2: rotorn skrafferad (kiselgelen), väggen skrafferad -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M116,126 L164,174 M126,119 L171,164 M109,136 L154,181 M140,116 L174,150 M106,150 L140,184"/>
    <path d="M250,66 l10,10 M250,88 l10,10 M250,110 l10,10 M250,132 l10,10 M250,176 l10,10 M250,198 l10,10 M250,220 l10,10"/>
  </g>

  <!-- Snickarpenna: våtluften ut genom väggen -->
  <path d="M174,156 Q210,162 226,152 H282 M274,145 L283,152 L274,159" fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tumstock bakom nyckeltalet -->
  <rect x="378" y="299" width="58" height="25" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 407 312)"/>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="56" y="44">sorption</text>
    <text x="350" y="44">kondens</text>
    <text x="58" y="80" font-size="22">fuktig luft in</text>
    <text x="174" y="88" font-size="22">torr luft</text>
    <text x="180" y="144">rotor</text>
    <text x="58" y="224">värmare</text>
    <text x="268" y="180" font-size="22" fill="#ad3519">våtluften</text>
    <text x="268" y="204" font-size="22" fill="#ad3519">ut genom</text>
    <text x="268" y="228" font-size="22" fill="#ad3519">väggen</text>
    <text x="356" y="92" font-size="22">fuktig luft in</text>
    <text x="478" y="88" font-size="22">torr luft</text>
    <text x="372" y="150">kylslinga</text>
    <text x="448" y="228">tank</text>
    <text x="88" y="300">ner till -20</text>
    <text x="384" y="292">fungerar väl över</text>
    <text x="384" y="318">15 °C</text>
  </g>
</svg>
