<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Huset i genomskärning med rätt luftfuktighet inomhus för varje rum och en kall yttervägg bakom sovrummets garderob.">
  <!-- Anteckningsboken. Blyerts 2 px för huset, bjälklagen, mellanväggen och garderoben, blyerts-2 för jordens
       skraffering, snickarpenna för ytterväggen bakom garderoben med fukten i glipan (enda pennsaken).
       Tumstock bakom runt 50 %. Riktvärden, inga mätningar. Inte skalenlig. Caveat 500 blir banor.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts: huset, bjälklagen, mellanväggen, garderoben -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50,260 Q170,257 300,260 T560,259 T590,261"/>
    <path d="M86,92 Q208,61 330,30 Q451,61 574,92"/>
    <path d="M100,88 Q99,175 100,262 M560,88 Q561,175 560,262"/>
    <path d="M96,170 Q330,172 564,170"/>
    <path d="M340,172 Q341,216 340,260"/>
    <path d="M100,260 Q98,297 100,334 M560,260 Q562,297 560,334"/>
    <path d="M96,332 Q330,334 564,332"/>
    <path d="M104,102 Q126,101 148,102 M106,100 Q107,135 106,170 M146,100 Q145,135 146,170 M126,103 Q126.5,136 126,168"/>
  </g>

  <!-- Blyerts-2: jordskraffering -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M52,270 l10,10 M74,270 l10,10 M566,270 l10,10"/>
    <path d="M60,302 l10,10 M82,302 l10,10 M574,302 l10,10"/>
    <path d="M52,326 l10,10 M74,326 l10,10 M566,326 l10,10"/>
  </g>

  <!-- Tumstock bakom runt 50 % -->
  <rect x="104" y="212" width="92" height="24" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 150 224)"/>

  <!-- Snickarpenna: ytterväggens insida bakom garderoben, fukten i glipan, ledaren -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M101,100 Q102,135 101,169"/>
    <path d="M103.5,114h.5 M103,131h.5 M103.5,147h.5 M103,160h.5"/>
    <path d="M70,62 Q83,86 98,106"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="160" y="124">sovrum</text>
    <text x="160" y="152" fill="#625a50">under 45 % på vintern</text>
    <text x="108" y="200">vardagsrum</text>
    <text x="108" y="230">runt 50 %</text>
    <text x="352" y="200">badrum</text>
    <text x="352" y="230" fill="#625a50">inget riktvärde</text>
    <text x="108" y="290">källare</text>
    <text x="108" y="318" fill="#625a50">under 75 %</text>
    <text x="48" y="28" fill="#ad3519">mögel växer här</text>
    <text x="48" y="54" fill="#ad3519">över 75 %</text>
  </g>
</svg>
