<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Råsponten på en kallvind sedd underifrån med mörka mögelbrädor och ljusa ränder, och två snitt: mögel på ytan och röta i träet.">
  <!-- Anteckningsboken, samma hand som hussvamp-syll.svg. Vänster: kallvindens takfall sett snett
       underifrån, råsponten i takfallets riktning, två takstolar rena. Bräda 3, 4 och 6 mörka av prickigt
       mögel nere vid takfoten, med ljusa ränder där ströläkten låg (SP Rapport 2006:43). Höger: två snitt
       genom en bräda, ytmögel överst och kubisk brunröta med en kniv under (TräGuiden). Pennan pekar på
       rötsnittet, enda pennsaken. Tumstock bakom 2 mm, enda markeringen (SBUF 13897). Inte skalenlig.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
