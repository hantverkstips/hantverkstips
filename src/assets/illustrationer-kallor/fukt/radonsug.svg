<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Radonsug i ett hus på platta i genomskärning, med röret från suggropen under golvet till fläkten på fasaden.">
  <!-- Anteckningsboken, samma hand som radon-vagar.svg. Enplanshus på platta i genomskärning, skrafferat gruslager
       under plattan (snedstreck framåt) och mark under det (snedstreck bakåt). Suggrop mitt under plattan, röret upp
       längs innerväggen, under bjälklaget och ut genom ytterväggen till fläkten på fasaden, en bit ovanför fönstret,
       inte över taket. Markluftens pilar i blyerts i gruset mot gropen. Pennan pekar på suggropen, enda pennsaken.
       Rutan uppe till höger: radonbrunn i tomten, lodrätt rör ner i grus med fläkt ovanpå, blyerts.
       Ingen markering, inga mått. Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

