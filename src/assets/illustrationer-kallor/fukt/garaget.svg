<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Ett enkelgarage i genomskärning med en avfuktare i garaget vid ytterväggen, där slangen leder den fuktiga luften ut.">
  <!-- Anteckningsboken. Blyerts 2 px för marken, betongplattan, taket, porten med glipan, bakväggen med hålet,
       bilen med kupé, fönster och hjul, avfuktaren med gallret, slangen, hygrometern och bensindunken,
       blyerts-2 för markens skraffering, snön på bilen, dropparna, korset på dunken och ledare, snickarpenna för
       den fuktiga luften som går ut ur slangens mynning (enda pennsaken) och ledaren till slangen ut.
       Tumstock bakom 60 %. Garaget i genomskärning på längden, porten till vänster, ute till höger.
       Inte skalenlig: avfuktaren, slangen och dunken är förstorade.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2 1,25: markens skraffering, en rad per path -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M52,318 l10,10 M74,318 l10,10 M96,318 l10,10 M118,318 l10,10 M140,318 l10,10 M162,318 l10,10 M184,318 l10,10 M206,318 l10,10 M228,318 l10,10 M250,318 l10,10 M272,318 l10,10 M294,318 l10,10 M316,318 l10,10 M338,318 l10,10 M360,318 l10,10 M382,318 l10,10 M404,318 l10,10 M426,318 l10,10 M448,318 l10,10 M470,318 l10,10 M492,318 l10,10 M514,318 l10,10 M536,318 l10,10 M558,318 l10,10 M580,318 l10,10"/>
    <path d="M63,340 l10,10 M85,340 l10,10 M107,340 l10,10 M129,340 l10,10 M151,340 l10,10 M173,340 l10,10 M195,340 l10,10 M217,340 l10,10 M239,340 l10,10 M261,340 l10,10 M283,340 l10,10 M305,340 l10,10 M327,340 l10,10 M349,340 l10,10 M371,340 l10,10 M393,340 l10,10 M415,340 l10,10 M437,340 l10,10 M459,340 l10,10 M481,340 l10,10 M503,340 l10,10 M525,340 l10,10 M547,340 l10,10 M569,340 l10,10"/>
  </g>

  <!-- Blyerts: marken, plattan, taket, porten, bakväggen med hålet, bilen, avfuktaren, slangen, hygrometern, dunken -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44,310 Q319,311.5 594,310"/>
    <path d="M77,298 Q295,296.8 513,298 M80,296 Q79.6,303 80,312 M510,296 Q510.4,303 510,312"/>
    <path d="M63,110 Q295,108.8 527,110 M63,120 Q295,121.2 527,120 M66,108 Q65.6,115 66,122 M524,108 Q524.4,115 524,122"/>
    <path d="M80,118 Q79.4,204 80,290 M86,118 Q86.6,204 86,290 M78,290 L88,290"/>
    <path d="M494,120 Q493.5,142 494,164 M510,120 Q510.5,142 510,164 M494,178 Q493.5,238 494,298 M510,178 Q510.5,238 510,298 M492,164 L512,164 M492,178 L512,178"/>
    <path d="M159,284 L140,284 Q130,284 130,274 L130,234 Q130,222 142,222 L190,222 L196,186 Q198,180 206,180 L304,180 Q312,180 314,186 L320,222 L372,222 Q384,222 384,234 L384,274 Q384,284 374,284 L355,284 M197,284 Q257,285 317,284"/>
    <path d="M204,216 L208,190 L250,190 L250,216 Z M260,216 L260,190 L300,190 L306,216 Z"/>
    <circle cx="178" cy="278" r="20"/>
    <circle cx="336" cy="278" r="20"/>
    <path d="M178,272 a6,6 0 1 0 0.1,0 M336,272 a6,6 0 1 0 0.1,0"/>
    <path d="M434,196 Q462,195.2 490,196 M436,194 Q435.4,222 436,252 M488,194 Q488.6,222 488,252 M434,250 Q462,250.8 490,250 M488,204 L494,204 M488,242 L494,242 M450,214 L474,214 M450,223 L474,223 M450,232 L474,232"/>
    <path d="M458,196 L458,172 Q458,166 464,166 Q506,168.6 548,172 M466,196 L466,178 Q466,174 471,174 Q509,176.6 548,180 M548,171 L548,181"/>
    <circle cx="470" cy="146" r="11"/>
    <path d="M470,146 L477,139"/>
    <path d="M538,272 Q557,271.4 576,272 M540,270 Q539.4,290 540,310 M574,270 Q574.6,290 574,310 M552,272 L552,262 L566,262 L566,272 M543,272 L539,263 L544,261 L548,270"/>
  </g>

  <!-- Blyerts-2 1,5: snön på kupétaket och huven, dropparna mot plattan, korset på dunken -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M212,180 q3,-7 9,-3 q5,-7 11,-1 q4,-5 8,1 M262,180 q3,-8 10,-3 q5,-6 10,0 q4,-5 9,2 M140,222 q3,-7 9,-3 q5,-6 10,0 q3,-4 7,2 M340,222 q3,-7 9,-2 q5,-6 10,1"/>
    <path d="M150,288 q-3,5 0,7 q3,-2 0,-7 M214,288 q-3,5 0,7 q3,-2 0,-7 M246,289 q-3,5 0,7 q3,-2 0,-7 M278,288 q-3,5 0,7 q3,-2 0,-7 M302,289 q-3,5 0,7 q3,-2 0,-7 M370,288 q-3,5 0,7 q3,-2 0,-7"/>
    <path d="M547,280 L567,302 M567,280 L547,302"/>
  </g>

  <!-- Tumstock -->
  <rect x="338" y="130" width="102" height="30" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 389 145)"/>

  <!-- Blyerts-2: ledare -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M102,172 L85,291"/>
    <path d="M264,164 L272,175"/>
    <path d="M432,258 L444,252"/>
    <path d="M444,146 L458,146"/>
  </g>

  <!-- Snickarpenna: den fuktiga luften ut ur slangens mynning, med luften som två vågor; ledaren till slangen ut -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M552,176 Q569,180 586,186"/>
    <path d="M578,177.5 L586,186 L574.8,189.1"/>
    <path d="M560,163 q4,-5 8,0 t8,0 M558,199 q4,-5 8,0 t8,0"/>
  </g>
  <path d="M540,102 L544,166" fill="none" stroke="#ad3519" stroke-width="1.25" stroke-linecap="round"/>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#625a50">
    <text x="96" y="164">porten</text>
    <text x="238" y="160">snö</text>
    <text x="392" y="276">avfuktare</text>
    <text x="344" y="152" fill="#2a2521">under 60 %</text>
    <text x="470" y="94" fill="#ad3519">slangen ut</text>
    <text x="536" y="254">bensin</text>
  </g>
</svg>
