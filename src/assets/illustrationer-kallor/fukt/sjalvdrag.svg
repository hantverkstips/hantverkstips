<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Självdrag i ett äldre hus i genomskärning, med luften in vid fönstret och ut genom kanalerna i taket.">
  <!-- Anteckningsboken, samma hand som kallras.svg och hus-rf-per-rum.svg. Tvåplanshus i genomskärning: kök på
       bottenvåningen till höger, badrum en trappa upp till höger, kallvind under taket. Två kanaler, från köket och
       från badrummet, rakt upp genom vinden och ut som två pipor. Tilluftsventilen sitter ovanför fönstret i vänster
       vägg, på motsatt sida mot kanalerna. Luftens väg i snickarpenna (enda pennsaken): in vid ventilen, genom
       bottenvåningen till kökskanalen, och en gren upp genom trappan till badrumskanalen. Uppe till vänster samma hus
       förenklat en sommardag med sol, korta streckade pilar i blyerts-2: draget är nästan borta. Ingen markering,
       inga mått. Inte skalenlig. Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2 1,25: markens skraffering -->
  <path d="M46,318 l10,10 M57,340 l10,10 M68,318 l10,10 M79,340 l10,10 M90,318 l10,10 M101,340 l10,10 M112,318 l10,10 M123,340 l10,10 M134,318 l10,10 M145,340 l10,10 M156,318 l10,10 M167,340 l10,10 M178,318 l10,10 M189,340 l10,10 M200,318 l10,10 M211,340 l10,10 M222,318 l10,10 M233,340 l10,10 M244,318 l10,10 M255,340 l10,10 M266,318 l10,10 M277,340 l10,10 M288,318 l10,10 M299,340 l10,10 M310,318 l10,10 M321,340 l10,10 M332,318 l10,10 M343,340 l10,10 M354,318 l10,10 M365,340 l10,10 M376,318 l10,10 M387,340 l10,10 M398,318 l10,10 M409,340 l10,10 M420,318 l10,10 M431,340 l10,10 M442,318 l10,10 M453,340 l10,10 M464,318 l10,10 M475,340 l10,10 M486,318 l10,10 M497,340 l10,10 M508,318 l10,10 M519,340 l10,10 M530,318 l10,10 M541,340 l10,10 M552,318 l10,10 M563,340 l10,10 M574,318 l10,10 M585,340 l10,10" fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round"/>

  <!-- Blyerts: marken, väggarna, bjälklagen, taket, kanalerna, piporna, trappan, spisen och badkaret -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- mark -->
    <path d="M44,312 Q320,313.5 596,312"/>
    <!-- vänster vägg: in- och utsida, bruten vid fönstren och ventilen -->
    <path d="M212,146 Q211.6,158 212,170 M212,204 Q211.6,218 212,232 M212,244 Q212.3,253 212,262 M212,300 Q212.3,307 212,314 M220,146 Q220.4,158 220,170 M220,204 Q220.4,218 220,232 M220,244 Q219.7,253 220,262 M220,300 Q219.7,307 220,314"/>
    <!-- fönstren: karm överst, glas, bröstning med bleck ut -->
    <path d="M212,170 H220 M216,170 V204 M207,204 H220 M212,262 H220 M216,262 V300 M207,300 H220"/>
    <!-- ventilen: galler i väggen -->
    <path d="M212,232 H220 M212,244 H220"/>
    <!-- höger vägg -->
    <path d="M512,146 Q512.8,229 512,314 M520,146 Q520.8,229 520,314"/>
    <!-- bjälklaget mellan våningarna, med trapphålet, och vindsbjälklaget -->
    <path d="M218,226 Q254,226.8 290,226 M350,226 Q432,225.2 514,226 M209,142 Q366,143.5 523,142"/>
    <!-- mellanväggar med dörröppning -->
    <path d="M372,227 Q372.4,238 372,248 M372,298 Q371.8,305 372,312 M398,143 Q398.3,151 398,160 M398,212 Q397.8,219 398,226"/>
    <!-- trappan -->
    <path d="M352,312 v-10.75 h-7 v-10.75 h-7 v-10.75 h-7 v-10.75 h-7 v-10.75 h-7 v-10.75 h-7 v-10.75 h-7 v-10.75 h-7"/>
    <!-- taket, brutet vid piporna -->
    <path d="M193,152 Q278,100 366,51 Q395,68 424,84.9 M442,95.4 Q449,99.5 456,103.5 M474,114.1 Q506,133 539,152"/>
    <!-- badrumskanalen och dess pipa -->
    <path d="M424,172 Q423.6,125 424,70 M442,172 Q442.4,125 442,70 M421,69 Q433,68.4 445,69 M422,172 H444"/>
    <!-- kökskanalen och dess pipa -->
    <path d="M456,254 Q455.5,179 456,90 M474,254 Q474.5,179 474,90 M453,89 Q465,88.4 477,89 M454,254 H476"/>
    <!-- spisen under kökskanalen -->
    <path d="M447,312 V284 Q465,283.4 483,284 M447,291 H483 M455,298 h4 M469,298 h4"/>
    <!-- badkaret -->
    <path d="M406,204 Q426,203.4 446,204 M408,204 Q409,222 418,224 H434 Q443,222 444,204"/>
  </g>

  <!-- Gallrets spjälor i ventilen -->
  <path d="M212,236 H220 M212,240 H220" fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round"/>

  <!-- Sommardagen: samma hus förenklat, med sol och korta streckade pilar -->
  <path d="M50,12 Q125,11.4 202,12 M200,10 Q200.6,70 200,130 M202,128 Q125,128.6 48,128 M50,130 Q49.4,70 50,10" fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round"/>
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54,112 Q125,112.8 196,112"/>
    <path d="M86,84 Q85.6,98 86,112 M150,84 Q150.4,98 150,112 M78,86 Q98,72 118,58 Q128,65 138,71 M144,75 Q151,79.5 158,86"/>
    <path d="M126,64 V52 M132,67.5 V52 M124,52 H134 M138,71 V60 M144,75 V60 M136,60 H146"/>
    <path d="M176,36 m-9,0 a9,9 0 1,0 18,0 a9,9 0 1,0 -18,0 M176,23 v-5 M176,49 v5 M163,36 h-5 M189,36 h5 M167,27 l-3.5,-3.5 M185,27 l3.5,-3.5 M167,45 l-3.5,3.5 M185,45 l3.5,3.5"/>
  </g>
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M60,118 l7,7 M82,118 l7,7 M104,118 l7,7 M126,118 l7,7 M148,118 l7,7 M170,118 l7,7"/>
  </g>
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M66,98 H80 M129,48 V40 M141,56 V48" stroke-dasharray="3 3"/>
    <path d="M77,95 L82,98 L77,101 M126,42 L129,37 L132,42 M138,50 L141,45 L144,50"/>
  </g>

  <!-- Snickarpenna: luftens väg, in vid ventilen, genom bottenvåningen och upp genom kanalerna -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120,238 Q171,237.6 224,238 C256,239 284,252 300,260 S344,272 380,272 S438,272 452,270 Q465,268 465,256 Q466.5,170 465,60"/>
    <path d="M300,260 C312,248 318,236 320,222 S330,194 352,192 S396,190 410,192 Q433,194 433,176 Q434.5,113 433,51"/>
    <path d="M188,231 L202,238 L188,245 M458,74 L465,60 L472,74 M426,65 L433,51 L440,65"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="126" y="226">uteluft in</text>
    <text x="300" y="36">ut genom kanalen</text>
    <text x="236" y="72">vinter</text>
    <text x="58" y="38" fill="#625a50">sommar</text>
  </g>
</svg>
