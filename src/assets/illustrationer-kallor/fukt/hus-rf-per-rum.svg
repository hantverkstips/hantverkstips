<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Hus i genomskärning med sovrum, vardagsrum, badrum och källare. Vid varje rum finns två tomma rutor för relativ fuktighet, vinter till vänster och sommar till höger. Värdena fylls i när mätningen finns.">
  <!-- MALL: fylls i när mätningen finns. Rutorna är platshållare för våra egna mätvärden per rum (vinter och sommar),
       talen kommer från tabellen i artikeln. Inga påhittade siffror. Ingen sak i penna förrän det finns något att peka på.
       Anteckningsboken. Blyerts 2 px för huset, blyerts-2 för skraffering och platshållare. Handskrift i Caveat 500.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts: huset -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50,260 Q170,257 300,260 T560,259 T590,261"/>
    <path d="M86,92 Q208,61 330,30 Q451,61 574,92"/>
    <path d="M100,88 Q99,175 100,262 M560,88 Q561,175 560,262"/>
    <path d="M96,170 Q330,172 564,170"/>
    <path d="M340,172 Q341,216 340,260"/>
    <path d="M100,260 Q98,297 100,334 M560,260 Q562,297 560,334"/>
    <path d="M96,332 Q330,334 564,332"/>
    <path d="M300,110 H332 V135 H300 Z M316,110 V135"/>
  </g>
  <!-- Blyerts-2: jordskraffering -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M52,270 l10,10 M74,270 l10,10 M566,270 l10,10"/>
    <path d="M60,302 l10,10 M82,302 l10,10 M574,302 l10,10"/>
    <path d="M52,326 l10,10 M74,326 l10,10 M566,326 l10,10"/>
  </g>

  <!-- Platshållarrutor, fylls i när mätningen finns -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-dasharray="5 4" stroke-linecap="round">
    <rect x="336" y="124" width="104" height="28"/>
    <rect x="448" y="124" width="104" height="28"/>
    <rect x="104" y="208" width="104" height="28"/>
    <rect x="216" y="208" width="104" height="28"/>
    <rect x="344" y="208" width="104" height="28"/>
    <rect x="452" y="208" width="104" height="28"/>
    <rect x="336" y="296" width="104" height="28"/>
    <rect x="448" y="296" width="104" height="28"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="20" fill="#2a2521">
    <text x="108" y="118">sovrum</text>
    <text x="108" y="196">vardagsrum</text>
    <text x="348" y="196">badrum</text>
    <text x="108" y="288">källare</text>
    <g fill="#625a50">
      <text x="342" y="145">vinter</text><text x="422" y="145">%</text>
      <text x="454" y="145">sommar</text><text x="534" y="145">%</text>
      <text x="110" y="229">vinter</text><text x="190" y="229">%</text>
      <text x="222" y="229">sommar</text><text x="302" y="229">%</text>
      <text x="350" y="229">vinter</text><text x="430" y="229">%</text>
      <text x="458" y="229">sommar</text><text x="538" y="229">%</text>
      <text x="342" y="317">vinter</text><text x="422" y="317">%</text>
      <text x="454" y="317">sommar</text><text x="534" y="317">%</text>
      <text x="48" y="28">fylls i när mätningen finns</text>
    </g>
  </g>
</svg>
