<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Skiss av en uteluftsventilerad krypgrund på 80 kvadratmeter i genomskärning en julidag. Varm uteluft med 12,1 gram vatten per kubikmeter kommer in genom en ventil i grundmuren, kyls ner till grundens tio grader där bara 9,4 gram ryms, och skillnaden fälls ut som kondens på blindbottens undersida. Marken i grunden är bar.">
  <!-- Anteckningsboken. Blyerts 2 px för hus och grundmur, blyerts-2 för skraffering och mått,
       snickarpenna för sommarluften genom ventilen (enda pennsaken), tumstock bakom nyckeltalet 9,4 g/m³.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts: bjälklag, väggar, grundmur, mark -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74,130 Q290,132 508,130"/>
    <path d="M74,150 Q290,152 508,150"/>
    <path d="M86,130 Q85,98 86,64"/>
    <path d="M496,130 Q497,98 496,64"/>
    <path d="M76,150 Q75,206 76,263"/>
    <path d="M96,150 Q97,206 96,263"/>
    <path d="M74,262 Q86,264 98,262"/>
    <path d="M486,150 Q485,163 486,176"/>
    <path d="M486,198 Q485,230 486,263"/>
    <path d="M506,150 Q507,163 506,176"/>
    <path d="M506,198 Q507,230 506,263"/>
    <path d="M484,262 Q496,264 508,262"/>
    <path d="M482,176 Q496,177 510,176"/>
    <path d="M482,198 Q496,199 510,198"/>
    <path d="M96,258 Q290,260 486,258"/>
    <path d="M0,232 Q38,233 78,232"/>
    <path d="M504,232 Q552,233 600,232"/>
    <!-- kondensdroppar under blindbotten -->
    <path d="M130,152 C129,154 126,157 126,160 A4,4 0 0 0 134,160 C134,157 131,154 130,152"/>
    <path d="M170,152 C169,154 166,157 166,160 A4,4 0 0 0 174,160 C174,157 171,154 170,152"/>
    <path d="M210,152 C209,154 206,157 206,160 A4,4 0 0 0 214,160 C214,157 211,154 210,152"/>
  </g>

  <!-- Blyerts-2: skraffering i mark, ute och i grunden -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M104,266 l10,10 M126,266 l10,10 M148,266 l10,10 M170,266 l10,10 M192,266 l10,10 M214,266 l10,10 M236,266 l10,10 M258,266 l10,10 M280,266 l10,10 M302,266 l10,10 M324,266 l10,10 M346,266 l10,10 M368,266 l10,10 M390,266 l10,10 M412,266 l10,10 M434,266 l10,10 M456,266 l10,10"/>
    <path d="M114,288 l10,10 M136,288 l10,10 M158,288 l10,10 M180,288 l10,10 M202,288 l10,10 M224,288 l10,10 M246,288 l10,10 M268,288 l10,10 M290,288 l10,10 M312,288 l10,10 M334,288 l10,10 M356,288 l10,10 M378,288 l10,10 M400,288 l10,10 M422,288 l10,10 M444,288 l10,10"/>
    <path d="M4,238 l10,10 M26,238 l10,10 M48,238 l10,10"/>
    <path d="M14,260 l10,10 M36,260 l10,10 M58,260 l10,10"/>
    <path d="M4,282 l10,10 M26,282 l10,10 M48,282 l10,10"/>
    <path d="M514,238 l10,10 M536,238 l10,10 M558,238 l10,10 M580,238 l10,10"/>
    <path d="M524,260 l10,10 M546,260 l10,10 M568,260 l10,10"/>
    <path d="M514,282 l10,10 M536,282 l10,10 M558,282 l10,10 M580,282 l10,10"/>
  </g>

  <!-- Måttbygel i blyerts-2 -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M96,322 Q290,325 486,322 M96,317 v10 M486,317 v10"/>
  </g>

  <!-- Tumstock bakom nyckeltalet -->
  <rect x="124" y="224" width="96" height="24" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 172 236)"/>

  <!-- Snickarpenna: sommarluften in genom ventilen och ner mot marken -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M578,182 Q542,181 508,184 Q486,192 470,231"/>
    <path d="M462,221 L470,233 L479,222"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="128" y="188">kondens på blindbotten</text>
    <text x="128" y="216">grunden 10 grader</text>
    <text x="128" y="242">9,4 g/m³ ryms här</text>
    <text x="322" y="208" fill="#ad3519">sommarluft 20°</text>
    <text x="322" y="234" fill="#ad3519">12,1 g/m³ in</text>
    <text x="232" y="350" fill="#625a50">80 kvm golvyta</text>
  </g>
</svg>
