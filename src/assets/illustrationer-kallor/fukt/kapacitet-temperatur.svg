<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Stapeldiagram över liter per dygn enligt tillverkarna. Wood's DSC50FM 13,5 liter vid 30 grader mot 8,0 vid 20. SW59FM 41 mot 25. Corroventa CTR, sorption, 17 liter vid 20 grader, 13 vid 10 och 11 vid 5.">
  <!-- Diagram i Anteckningsbokens hand. Staplar i blyerts 2 px utan fyllning, sorptionsmaskinen i penna,
       etiketter i Atkinson Hyperlegible. Värden ur tillverkarnas datablad via briefens temperaturtabell.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="url(#linjerat)"/>
  <path d="M40,0 V400" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Axlar i blyerts-2 -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M78,54 Q77,178 78,304"/>
    <path d="M74,300 H562"/>
    <path d="M72,300 h6 M72,246.7 h6 M72,193.3 h6 M72,140 h6 M72,86.7 h6"/>
  </g>
  <g font-family="'Atkinson Hyperlegible', system-ui, sans-serif" font-size="22" fill="#625a50" text-anchor="end">
    <text x="66" y="307">0</text>
    <text x="66" y="254">10</text>
    <text x="66" y="200">20</text>
    <text x="66" y="147">30</text>
    <text x="66" y="94">40</text>
  </g>
  <text x="84" y="38" font-family="'Atkinson Hyperlegible', system-ui, sans-serif" font-size="22" fill="#625a50">liter per dygn, tillverkaren uppger</text>

  <!-- Kondensmaskinerna i blyerts -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100,303 Q99,265.5 100.5,228 H136 Q137,265.5 136,303"/>
    <path d="M144,303 Q143.5,280 144,257.3 H180 Q180.5,280 180,303"/>
    <path d="M258,303 Q257,192 258.5,81.3 H294 Q295,192 294,303"/>
    <path d="M302,303 Q301,235 302.5,166.7 H338 Q339,235 338,303"/>
  </g>
  <!-- Sorptionsmaskinen i snickarpenna -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M416,303 Q415,256 416.5,209.3 H452 Q453,256 452,303"/>
    <path d="M460,303 Q459.5,266 460,230.7 H496 Q496.5,266 496,303"/>
    <path d="M504,303 Q503.5,272 504,241.3 H540 Q540.5,272 540,303"/>
  </g>

  <!-- Värden ovanför staplarna -->
  <g font-family="'Atkinson Hyperlegible', system-ui, sans-serif" font-size="22" fill="#2a2521" text-anchor="middle">
    <text x="118" y="220">13,5</text>
    <text x="162" y="249">8,0</text>
    <text x="276" y="73">41</text>
    <text x="320" y="159">25</text>
    <text x="434" y="201">17</text>
    <text x="478" y="223">13</text>
    <text x="522" y="233">11</text>
  </g>
  <!-- Temperatur under varje stapel, maskin och typ under gruppen -->
  <g font-family="'Atkinson Hyperlegible', system-ui, sans-serif" font-size="22" fill="#625a50" text-anchor="middle">
    <text x="118" y="326">30°</text>
    <text x="162" y="326">20°</text>
    <text x="276" y="326">30°</text>
    <text x="320" y="326">20°</text>
    <text x="434" y="326">20°</text>
    <text x="478" y="326">10°</text>
    <text x="522" y="326">5°</text>
    <text x="140" y="354" fill="#2a2521">DSC50FM</text>
    <text x="298" y="354" fill="#2a2521">SW59FM</text>
    <text x="478" y="354" fill="#2a2521">Corroventa CTR</text>
    <text x="219" y="380">kondens</text>
    <text x="478" y="380">sorption</text>
  </g>
</svg>
