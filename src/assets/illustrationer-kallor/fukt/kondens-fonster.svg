<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Ett tvåglasfönster i genomskärning, där kondens på fönstret bildas först längst ner på insidan, vid listen mellan glasen.">
  <!-- Anteckningsboken. Blyerts 2 px för väggens kontur, karmen, bågen, de två glasen, listen, fönsterbänken och
       fönsterblecket, blyerts-2 för väggens skraffering och ledaren till listen, snickarpenna för imman på
       innerglasets rumssida, dropparna och randen längst ner (enda pennsaken), och ledaren till imma.
       Tumstock bakom daggpunkten. Lodrätt snitt genom fönstret, ute till vänster, inne till höger.
       Inte skalenlig: glasen, listen och bågen är förstorade.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2 1,25: väggens skraffering, ovanför y 0 till 30 och under y 300 till 360 -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M204,4 l10,10 M226,4 l10,10 M248,4 l10,10 M270,4 l10,10 M292,4 l10,10 M314,4 l10,10 M336,4 l10,10 M358,4 l10,10"/>
    <path d="M215,17 l10,10 M237,17 l10,10 M259,17 l10,10 M281,17 l10,10 M303,17 l10,10 M325,17 l10,10 M347,17 l10,10 M369,17 l8,8"/>
    <path d="M204,312 l10,10 M226,312 l10,10 M248,312 l10,10 M270,312 l10,10 M292,312 l10,10 M314,312 l10,10 M336,312 l10,10 M358,312 l10,10"/>
    <path d="M215,334 l10,10 M237,334 l10,10 M259,334 l10,10 M281,334 l10,10 M303,334 l10,10 M325,334 l10,10 M347,334 l10,10 M369,334 l8,8"/>
  </g>

  <!-- Blyerts: väggens kontur, karmen, bågen, glasen, listen, fönsterbänken, fönsterblecket -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M198,30 Q290,31 382,30 M198,300 Q290,299 382,300"/>
    <path d="M250,28 Q249,39 250,50 M340,28 Q341,39 340,50 M248,48 Q295,49 342,48"/>
    <path d="M248,282 Q295,281 342,282 M250,280 Q249,291 250,302 M340,280 Q341,291 340,302"/>
    <path d="M262,46 Q261,57 262,68 M330,46 Q331,57 330,68 M260,66 Q296,67 332,66"/>
    <path d="M260,262 Q296,261 332,262 M262,260 Q261,272 262,284 M330,260 Q331,272 330,284"/>
    <path d="M280,66 Q281,164 280,262 M284,66 Q283,164 284,262 M306,66 Q307,164 306,262 M310,66 Q309,164 310,262"/>
    <path d="M282,78 Q295,78.6 308,78 M282,250 Q295,249.4 308,250"/>
    <path d="M338,282 Q372,281 406,282 M340,292 Q372,293 406,292 M404,280 Q404.5,287 404,294"/>
    <path d="M250,300 Q232,303.5 214,308 l-1.5,5"/>
  </g>

  <!-- Tumstock -->
  <rect x="387" y="128" width="138" height="30" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 456 143)"/>

  <!-- Blyerts-2: ledaren till den nedre listen, rakt över ytterglaset -->
  <path d="M168,241 L295,256" fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round"/>

  <!-- Snickarpenna: imman på innerglasets rumssida, glesa droppar uppifrån och täta nertill, och randen mot bågen -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M319.5,190 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M314,198 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M319.5,208 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M314,219 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M319.5,226 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5"/>
    <path d="M314,234 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M319.5,239 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M314,244 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M319.5,248 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5 M314,251.5 c-1,1.5 -2,2.5 -2,3.5 a2,2 0 0 0 4,0 c0,-0.8 -0.6,-1.6 -1.3,-2.5"/>
    <path d="M312,259.5 q2.5,-2 5,0 t5,0 t4,0"/>
  </g>
  <path d="M354,228 L322,236" fill="none" stroke="#ad3519" stroke-width="1.25" stroke-linecap="round"/>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#625a50">
    <text x="110" y="160">ute</text>
    <text x="392" y="100" fill="#2a2521">inne 21°</text><text x="477" y="100" fill="#2a2521">och 45 %</text>
    <text x="392" y="150" fill="#2a2521">daggpunkt 8,6°</text>
    <text x="356" y="232" fill="#ad3519">imma</text>
    <text x="120" y="246">listen</text>
  </g>
</svg>
