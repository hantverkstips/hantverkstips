<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="En fuktslukare i genomskärning, med saltet i den övre korgen och saltlösning som samlas i botten.">
  <!-- Anteckningsboken, samma hand som hygrometer-koksalt.svg. Blyerts 2 px för bordet, burken, locket med
       springorna och korgen, blyerts-2 för luften in, saltkornen, lösningen och ledarna, snickarpenna för
       dropparna (enda pennsaken). Sett från sidan. Inte skalenlig. Spec: docs/briefer/spec-skiss-fuktslukare-2026-10.md.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Överstrykning med tumstocksgul bakom nyckeltalet -->
  <rect x="394" y="229" width="163" height="28" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 475 243)"/>

  <!-- Blyerts: bordet, burken, locket med springorna, korgen med gallret -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80,322 Q300,325 520,322"/>
    <path d="M221,90 Q219,200 220,305 Q220,320 235,320 Q300,321.5 365,320 Q380,320 380,305 Q381,200 379,90"/>
    <path d="M216,72 Q300,70.5 384,72 Q389,72 388,77 Q389,84 388,91 Q300,93 212,91 Q211,84 212,77 Q211,72 216,72"/>
    <path d="M264,76 V87 M288,76 V87 M312,76 V87 M336,76 V87"/>
    <path d="M226,96 Q300,94.5 374,96 M228,95 Q227,123 228,150 Q300,151.5 372,150 Q373,123 372,95"/>
    <path d="M252,98 Q251,124 252,149 M276,98 Q277,124 276,149 M300,98 Q299,124 300,149 M324,98 Q325,124 324,149 M348,98 Q347,124 348,149"/>
  </g>

  <!-- Blyerts-2 1,5: luften in genom springorna -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M276,22 q-5,6 0,12 t0,12 t0,12 t0,8 M270,60 l6,7 l6,-7"/>
    <path d="M324,22 q-5,6 0,12 t0,12 t0,12 t0,8 M318,60 l6,7 l6,-7"/>
  </g>

  <!-- Blyerts-2 1,25: saltkornen, lösningen, ledarna -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M236,110 q4,-4 8,0 q1,5 -4,6 q-5,-1 -4,-6z M238,132 q3,-5 8,-1 q1,6 -4,6 q-5,0 -4,-5z M244,121 q4,-3 6,1 q0,4 -4,4 q-3,-1 -2,-5z"/>
    <path d="M258,106 q5,-3 8,1 q0,5 -5,5 q-4,-1 -3,-6z M262,126 q4,-4 8,0 q0,6 -5,6 q-4,-1 -3,-6z M257,140 q4,-3 7,1 q0,4 -4,4 q-4,-1 -3,-5z M266,116 q3,-3 6,0 q0,4 -3,4 q-4,0 -3,-4z"/>
    <path d="M282,110 q4,-4 8,0 q1,5 -4,6 q-5,-1 -4,-6z M285,134 q4,-4 8,0 q0,5 -4,5 q-5,0 -4,-5z M290,121 q3,-3 6,1 q0,4 -4,3 q-3,0 -2,-4z"/>
    <path d="M306,104 q4,-3 8,1 q0,5 -5,5 q-4,-1 -3,-6z M309,124 q4,-4 8,0 q0,6 -5,6 q-4,-1 -3,-6z M305,140 q4,-3 7,1 q0,4 -4,4 q-4,-1 -3,-5z M314,114 q3,-3 6,0 q0,4 -3,4 q-4,0 -3,-4z"/>
    <path d="M330,110 q4,-4 8,0 q1,5 -4,6 q-5,-1 -4,-6z M332,133 q3,-5 8,-1 q1,6 -4,6 q-5,0 -4,-5z M338,121 q4,-3 6,1 q0,4 -4,4 q-3,-1 -2,-5z"/>
    <path d="M354,106 q5,-3 8,1 q0,5 -5,5 q-4,-1 -3,-6z M356,126 q4,-4 8,0 q0,6 -5,6 q-4,-1 -3,-6z M354,140 q4,-3 7,1 q0,4 -4,4 q-4,-1 -3,-5z"/>
    <path d="M223,262 q6.5,-3 13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0 t13,0"/>
    <path d="M246,280 q5,-2.5 10,0 t10,0 M312,284 q5,-2.5 10,0 t10,0 M270,300 q5,-2.5 10,0 t10,0 M334,304 q5,-2.5 10,0 t10,0"/>
    <path d="M182,118 Q208,119 228,124"/>
    <path d="M172,280 Q200,281 228,284"/>
  </g>

  <!-- Snickarpenna: dropparna från korgen ner i lösningen -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300,158 q-6,9 -6,13 a6,6 0 0 0 12,0 q0,-4 -6,-13z"/>
    <path d="M301,184 q-6,9 -6,13 a6,6 0 0 0 12,0 q0,-4 -6,-13z"/>
    <path d="M299,210 q-6,9 -6,13 a6,6 0 0 0 12,0 q0,-4 -6,-13z"/>
    <path d="M300,234 q-5,7 -5,10 a5,5 0 0 0 10,0 q0,-3 -5,-10z"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="50" y="112">kalciumklorid 450 g</text>
    <text x="80" y="286">saltlösning</text>
    <text x="400" y="250">ca 1 liter vid 60 %</text>
  </g>
</svg>
