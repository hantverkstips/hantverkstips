<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Skiss av ett hus i genomskärning med krypgrund och källare, där sex platser där mögel brukar sitta är inringade.">
  <!-- Anteckningsboken, samma hand som kallare.svg. Hus i genomskärning: krypgrund till vänster och källare till höger
       under bottenvåningen, rummet med fönstret, badrummet med kakel och dusch, rummet med tapet och golvmatta,
       kallvinden med isolering på bjälklaget och råspont under yttertaket. Sex öppna ringar i snickarpenna, en per
       plats i tabellen "Var möglet brukar sitta" (enda pennsaken). Mögel som prickar och fläckar i blyerts-2.
       Tumstock bakom nyckeltalet, enda markeringen. Inte skalenlig.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
