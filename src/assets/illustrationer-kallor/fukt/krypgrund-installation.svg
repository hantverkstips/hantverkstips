<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Skiss av en krypgrund i genomskärning med avfuktaren installerad. Maskinen står upphöjd på block mitt i grunden, torrluftsslangen går ut åt höger i grunden, våtluftsslangen går åt vänster med fall genom grundmuren och ut i det fria, marken är täckt med byggplast med överlapp i skarven, ventilen i högra grundmuren är tätad och markerad med ett kryss, och manöverpanelen sitter uppe i bostaden med kabel ner till maskinen.">
  <!-- Anteckningsboken. Blyerts 2 px för hus, grundmur, maskin, plast och torrluftsslang, blyerts-2 för
       skraffering, kryss, kabel och mått, snickarpenna för våtluftsslangen ut genom grundmuren
       (enda pennsaken), tumstock bakom nyckeltalet 50 cm. Handskrift i Caveat 500, konverteras till
       banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts: bjälklag, väggar, grundmur, mark, plast, maskin, torrluftsslang, panel -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74,130 Q290,132 508,130"/>
    <path d="M74,150 Q290,152 508,150"/>
    <path d="M86,130 Q85,98 86,64"/>
    <path d="M496,130 Q497,98 496,64"/>
    <path d="M76,150 Q75,184 76,212"/>
    <path d="M76,240 Q75,252 76,263"/>
    <path d="M96,150 Q97,186 96,216"/>
    <path d="M96,244 Q97,254 96,263"/>
    <path d="M74,262 Q86,264 98,262"/>
    <path d="M486,150 Q485,197 486,263"/>
    <path d="M506,150 Q507,197 506,263"/>
    <path d="M484,262 Q496,264 508,262"/>
    <path d="M482,176 Q496,177 510,176"/>
    <path d="M482,198 Q496,199 510,198"/>
    <path d="M96,258 Q290,260 486,258"/>
    <path d="M0,250 Q38,251 78,250"/>
    <path d="M504,250 Q552,251 600,250"/>
    <!-- byggplast på marken, med överlapp i skarven och avbrott vid blocket -->
    <path d="M110,254 Q158,256 204,254 Q214,254 219,250"/>
    <path d="M211,250 Q252,253 294,252"/>
    <path d="M370,252 Q422,254 474,252"/>
    <!-- avfuktaren, upphöjd på block -->
    <path d="M300,196 H364 V248 M301,248 V195"/>
    <path d="M306,208 H358 M306,218 H358"/>
    <path d="M298,250 H366 V258 M299,258 V249"/>
    <!-- torrluftsslang ut i grunden -->
    <path d="M364,200 Q390,194 416,200 Q434,204 448,200"/>
    <path d="M448,200 l10,-7 M448,200 l10,7"/>
    <!-- manöverpanel uppe i bostaden -->
    <path d="M180,100 H224 V124 H180 Z"/>
    <path d="M186,111 H218"/>
  </g>

  <!-- Blyerts-2: skraffering i mark -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M104,266 l10,10 M126,266 l10,10 M148,266 l10,10 M170,266 l10,10 M192,266 l10,10 M214,266 l10,10 M236,266 l10,10 M258,266 l10,10 M280,266 l10,10 M302,266 l10,10 M324,266 l10,10 M346,266 l10,10 M368,266 l10,10 M390,266 l10,10 M412,266 l10,10 M434,266 l10,10 M456,266 l10,10"/>
    <path d="M114,288 l10,10 M136,288 l10,10 M158,288 l10,10 M180,288 l10,10 M202,288 l10,10 M224,288 l10,10 M246,288 l10,10 M268,288 l10,10 M290,288 l10,10 M312,288 l10,10 M334,288 l10,10 M356,288 l10,10 M378,288 l10,10 M400,288 l10,10 M422,288 l10,10 M444,288 l10,10"/>
    <path d="M4,256 l10,10 M26,256 l10,10 M48,256 l10,10"/>
    <path d="M14,278 l10,10 M36,278 l10,10 M58,278 l10,10"/>
    <path d="M514,256 l10,10 M536,256 l10,10 M558,256 l10,10 M580,256 l10,10"/>
    <path d="M524,278 l10,10 M546,278 l10,10 M568,278 l10,10"/>
  </g>

  <!-- Blyerts-2: kryss över den tätade ventilen -->
  <g fill="none" stroke="#625a50" stroke-width="1.75" stroke-linecap="round">
    <path d="M480,172 L512,203 M512,172 L480,203"/>
  </g>

  <!-- Blyerts-2: kabeln från maskinen upp till panelen -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round" stroke-dasharray="5 4">
    <path d="M202,124 Q201,142 202,158 Q258,160 314,164 Q325,178 320,194"/>
  </g>

  <!-- Måttbygel framför filtret, i blyerts-2 -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M366,240 Q396,242 426,240 M366,235 v10 M426,235 v10"/>
  </g>

  <!-- Papperslappar bakom anteckningarna -->
  <g fill="#f5efe3">
    <rect x="132" y="270" width="178" height="28" transform="rotate(-1 221 284)"/>
    <rect x="340" y="158" width="144" height="28" transform="rotate(-1 412 172)"/>
  </g>

  <!-- Tumstock bakom nyckeltalet -->
  <rect x="370" y="212" width="60" height="24" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 400 224)"/>

  <!-- Snickarpenna: våtluftsslangen med fall ut genom grundmuren -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300,206 Q214,213 132,220 Q104,223 70,228"/>
    <path d="M82,219 L68,229 L82,235"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="232" y="118">panel i huset</text>
    <text x="130" y="178" fill="#ad3519">våtluft ut,</text>
    <text x="130" y="202" fill="#ad3519">med fall</text>
    <text x="344" y="178">ventil tätad</text>
    <text x="376" y="230" fill="#625a50">50 cm</text>
    <text x="140" y="292">plast på marken</text>
  </g>
</svg>
