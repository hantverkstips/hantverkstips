<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Duschhörnet i ett badrum i genomskärning, med svarta prickar på fogarna framför kaklet och tätskiktet bakom.">
  <!-- Anteckningsboken. Duschhörnet i genomskärning: väggen till vänster i fyra band, väggskivan, tätskiktet,
       fästmassan och kaklet, framför den skrafferade väggen. Golvet med klinkern, fästmassan, tätskiktet och betongen,
       golvbrunnen som en skål under golvet med klämringen ovanpå, frånluftsventilen i taket och dörren till höger med
       springan under. Blyerts 2 px för plattorna, tätskiktet, brunnen, ventilen, dörren och tilluftens pil, blyerts-2
       för skraffering, väggskivan, fästmassans prickar, fogarnas streck och ledaren. De svarta prickarna på fogarna och
       i silikonfogen är det enda som är fyllt. Snickarpennan bara för bygeln från tätskiktet ut till ytan (enda
       pennsaken). Tumstock bakom nyckeltalet. Inte skalenlig: skikten är förstorade. Handskrift i Caveat 500,
       konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
