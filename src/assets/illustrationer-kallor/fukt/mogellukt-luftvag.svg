<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Skiss av ett enplanshus i genomskärning där lukten från en mögelfläck i krypgrunden går upp genom hålen för rören.">
  <!-- Anteckningsboken, samma hand som kallare.svg. Enplanshus i genomskärning med gaveln bortskuren: krypgrund,
       ett rum med tvättställ och eluttag, kallvind med isolering och ventil i den bortre gaveln. Mögelfläcken
       skrafferad på blindbottens undersida, och lukten som pilar i blyerts upp genom hålen för avloppsröret
       och elröret. På vinden en fläck under råsponten och en pil i blyerts ut genom gavelventilen. Snickarpennan
       bara för pilen till avloppsrörets hål med etiketten (enda pennsaken). Inga mått, ingen markering.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

