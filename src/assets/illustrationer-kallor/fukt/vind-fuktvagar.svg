  </g>

  <!-- Tumstock bakom uteluftens tal -->
  <rect x="51" y="67" width="157" height="28" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 130 81)"/>

  <!-- Snickarpenna: inneluften upp genom luckans springor och runt elröret -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258,332 Q250,312 256,292 T252,254 T238,222 T218,190 T204,164 M205,178 L204,164 L215,172"/>
    <path d="M290,332 Q298,312 292,292 T296,254 T318,224 T350,196 T390,167 M376,170 L390,167 L383,180"/>
    <path d="M188,300 Q192,282 188,264 T190,232 T186,204 T184,188 M178,198 L184,186 L190,198"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="57" y="88">ute 0 °C och 95 %</text>
    <text x="222" y="150">daggpunkt −0,7 °C</text>
    <text x="392" y="220" fill="#625a50">400 mm</text>
  </g>
</svg>
