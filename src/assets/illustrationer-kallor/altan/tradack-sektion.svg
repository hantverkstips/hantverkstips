<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Snitt genom ett lågt trädäck på mark, med husväggen till vänster. Hela däcket lutar bort från huset, och en pil i penna följer golvytan utåt. Underst fast underlag, ovanpå det ett lager makadam på 200 mm ritat som små stenar, en streckad markduk över makadamen, tre markreglar av 45 × 95 mm som ligger direkt på duken med grundisoleringspapp på översidan, och trallen på 28 mm överst. Makadambäddens översida lutar lika mycket som golvet, och avståndet mellan två reglar är c 600 mm.">
  <!-- Anteckningsboken. Blyerts 2 px för trall, markreglar, husvägg och botten på urgrävningen,
       blyerts-2 för makadamstenarna, markduken, pappen, skrafferingen, ledarna och måttbygeln,
       snickarpenna för fallpilen som ligger längs golvytan (enda pennsaken),
       tumstock bakom nyckeltalet c 600.
       Skala cirka 0,35 px per mm åt båda håll: trall 28 mm = 10 px, regel 95 mm = 34 px,
       makadam 200 mm = 74 px, c 600 mm = 210 px.
       Fallet är ritat 22 px på 480 px, alltså mer än verkligt fall, för att synas. Trall,
       reglarnas underkant, markduken och makadambäddens botten lutar alla lika mycket,
       eftersom fallet läggs i bädden och inte i trallen.
       Etiketterna ligger under däcket så att pilen får ha golvytan för sig själv.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2: makadamen som små stenar, raderna följer bäddens lutning -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linejoin="round">
    <path d="M90,208 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M132,207 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M174,214 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M216,213 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M258,219 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M300,216 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M342,221 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M384,218 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M426,226 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M468,226 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M510,224 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M552,230 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M588,233 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z"/>
    <path d="M110,223 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M152,228 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M194,225 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M236,233 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M278,233 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M320,232 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M362,238 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M404,241 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M446,241 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M488,239 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M530,246 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M572,245 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z"/>
    <path d="M90,237 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M132,243 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M174,246 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M216,246 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M258,245 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M300,252 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M342,251 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M384,257 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M426,254 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M468,259 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M510,255 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M552,263 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M588,263 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z"/>
    <path d="M110,259 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M152,258 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M194,264 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M236,261 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M278,266 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M320,263 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M362,271 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M404,271 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M446,270 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z M488,275 q1,-4 5,-3 q4,1 3,4 q-1,3 -5,2 q-4,-1 -3,-3 z M530,278 q2,-4 6,-2 q3,2 1,5 q-2,3 -6,1 q-3,-1 -1,-4 z M572,278 q0,-4 5,-4 q5,0 4,4 q-1,3 -5,3 q-4,0 -4,-3 z"/>
  </g>

