<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Ett hus i sidovy med en altan på plintar intill fasaden. Tre mått är utsatta: 1,8 meter från marken upp till altangolvets ovansida, 3,6 meter från husets fasad till altanens ytterkant, och 4,5 meter från ytterkanten till en streckad tomtgräns. Altanen har ett glest räcke, med anteckningen att räcket inte räknas in i höjden. En anteckning i rött säger att en högre altan kräver bygglov.">
  <!-- Anteckningsboken. Blyerts 2 px för hus, altan, plintar och mark, blyerts-2 för måttbyglar,
       skraffering, tomtgräns och anteckningar, snickarpenna för anteckningen om lovplikt (enda pennsaken),
       tumstock bakom nyckeltalet 1,8 m. Skala: 1 m = 40 px. Marklinje y=300, altangolv y=228 (1,8 m),
       fasad x=170, altanens ytterkant x=314 (3,6 m), tomtgräns x=494 (4,5 m).
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2: markskraffering under marklinjen -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M70,303 l-8,10 M92,303 l-8,10 M114,303 l-8,10 M136,303 l-8,10 M158,303 l-8,10 M180,303 l-8,10 M202,303 l-8,10 M224,303 l-8,10 M246,303 l-8,10 M268,303 l-8,10 M290,303 l-8,10 M312,303 l-8,10 M334,303 l-8,10 M356,303 l-8,10 M378,303 l-8,10 M400,303 l-8,10 M422,303 l-8,10 M444,303 l-8,10 M466,303 l-8,10 M488,303 l-8,10 M520,303 l-8,10 M542,303 l-8,10 M564,303 l-8,10"/>
  </g>

  <!-- Blyerts: marklinje, hus med fönster, altangolv, plintar, glest räcke -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56,300 Q320,298 582,300"/>
    <path d="M62,118 Q62,210 62,300"/>
    <path d="M170,300 Q171,210 170,118"/>
    <path d="M52,118 Q114,116 176,118"/>
    <path d="M60,118 L116,62 L172,118"/>
    <path d="M86,180 h28 v40 h-28 z"/>
    <path d="M170,228 Q242,226 316,228"/>
    <path d="M170,238 Q242,236 316,238"/>
    <path d="M184,238 V300 M212,238 V300 M240,238 V300 M268,238 V300 M296,238 V300"/>
    <path d="M198,228 V192 M312,228 V192"/>
    <path d="M196,194 Q255,192 314,194"/>
    <path d="M214,228 V200 M230,228 V200 M246,228 V200 M262,228 V200 M278,228 V200 M294,228 V200"/>
  </g>

  <!-- Blyerts-2: tomtgräns -->
  <path d="M494,136 Q493,218 494,300" fill="none" stroke="#625a50" stroke-width="1.5" stroke-dasharray="8 6" stroke-linecap="round"/>

  <!-- Blyerts-2: måttbyglar (höjd till höger om altanen, avstånd ovanför) -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M338,228 V300 M333,228 h10 M333,300 h10"/>
    <path d="M170,138 H314 M170,133 v10 M314,133 v10"/>
    <path d="M314,138 H494 M494,133 v10"/>
  </g>
  <path d="M170,138 V118 M314,228 V138" fill="none" stroke="#625a50" stroke-width="1.25" stroke-dasharray="7 5"/>

  <!-- Tumstock bakom nyckeltalet -->
  <rect x="348" y="248" width="66" height="24" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 381 260)"/>

  <!-- Snickarpenna: pil uppåt förbi bygelns topp, och anteckningen att högre kräver lov -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350,232 Q351,218 350,204"/>
    <path d="M350,204 l-6,8 M350,204 l6,8"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="46" y="40" fill="#625a50">högst 1,8 m, inget bygglov</text>
    <text x="176" y="128" fill="#625a50">3,6 m från huset</text>
    <text x="350" y="128" fill="#625a50">4,5 m till gräns</text>
    <text x="204" y="160" font-size="22" fill="#625a50">glest räcke</text>
    <text x="204" y="182" font-size="22" fill="#625a50">räknas inte</text>
    <text x="362" y="212" fill="#ad3519">högre?</text>
    <text x="362" y="236" fill="#ad3519">då bygglov</text>
    <text x="352" y="266">1,8 m</text>
    <text x="500" y="290" fill="#625a50">tomtgräns</text>
  </g>
</svg>
