<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Två trallbrädor sedda uppifrån, med två reglar under som streckade linjer. Varje bräda har två skruv per regel, satta trettio millimeter från vardera kanten. En skruv är inringad i rött eftersom den sitter närmare kanten, och sprickan löper ut åt båda håll från den.">
  <!-- Anteckningsboken. Blyerts 2 px för brädor och skruvhuvuden, blyerts-2 för reglar under,
       måttbyglar och anteckningar, snickarpenna för sprickan vid den skruv som sitter för nära
       kanten (enda pennsaken), tumstock bakom nyckeltalet 30 mm. Skala: 1 mm = 1 px.
       Bräda 1 y=70 till 190, springa 7 px, bräda 2 y=197 till 317. Reglar x=150 till 195
       och x=330 till 375. Skruvarna sitter 30 px, alltså 30 mm, från brädans kant.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2: de två reglarna under brädorna, streckade eftersom de ligger under -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-dasharray="9 6" stroke-linecap="round">
    <path d="M150,62 V337 M195,62 V337"/>
    <path d="M330,62 V337 M375,62 V337"/>
  </g>

  <!-- Blyerts: de två trallbrädorna uppifrån, springan emellan -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60,70 Q265,68 470,70"/>
    <path d="M60,190 Q265,188 470,190"/>
    <path d="M62,70 Q60,130 62,190"/>
    <path d="M468,70 Q470,130 468,190"/>
    <path d="M60,197 Q265,195 470,197"/>
    <path d="M60,317 Q265,315 470,317"/>
    <path d="M62,197 Q60,257 62,317"/>
    <path d="M468,197 Q470,257 468,317"/>
  </g>

  <!-- Blyerts: skruvhuvuden, två per bräda och regel, med torxspåret antytt -->
  <g fill="none" stroke="#2a2521" stroke-width="2">
    <circle cx="172" cy="100" r="7"/>
    <circle cx="172" cy="160" r="7"/>
    <circle cx="352" cy="100" r="7"/>
    <circle cx="172" cy="227" r="7"/>
    <circle cx="172" cy="287" r="7"/>
    <circle cx="352" cy="227" r="7"/>
    <circle cx="352" cy="287" r="7"/>
    <circle cx="352" cy="174" r="7"/>
  </g>
  <g fill="none" stroke="#2a2521" stroke-width="1.25" stroke-linecap="round">
    <path d="M168,97 l8,6 M168,103 l8,-6 M172,95 v10"/>
    <path d="M168,157 l8,6 M168,163 l8,-6 M172,155 v10"/>
    <path d="M348,97 l8,6 M348,103 l8,-6 M352,95 v10"/>
    <path d="M168,224 l8,6 M168,230 l8,-6 M172,222 v10"/>
    <path d="M168,284 l8,6 M168,290 l8,-6 M172,282 v10"/>
    <path d="M348,224 l8,6 M348,230 l8,-6 M352,222 v10"/>
    <path d="M348,284 l8,6 M348,290 l8,-6 M352,282 v10"/>
    <path d="M348,171 l8,6 M348,177 l8,-6 M352,169 v10"/>
  </g>

  <!-- Blyerts-2: måttbyglar för kantavståndet, en vid varje kant på den övre brädan -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M134,70 V100 M129,70 h10 M129,100 h10"/>
    <path d="M134,160 V190 M129,160 h10 M129,190 h10"/>
  </g>
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-dasharray="6 5">
    <path d="M140,100 H163"/>
    <path d="M140,160 H163"/>
  </g>

  <!-- Tumstock bakom nyckeltalet -->
  <rect x="48" y="24" width="72" height="28" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 84 38)"/>

  <!-- Snickarpenna: skruven som sitter för nära kanten, och sprickan den gav -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M349,160 A16,14 0 1 1 339,166"/>
    <path d="M340,178 L330,180 L312,172 L296,177"/>
    <path d="M364,178 L374,180 L392,172 L410,178"/>
    <path d="M492,202 Q456,196 420,184"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="54" y="44">30 mm</text>
    <text x="128" y="44" fill="#625a50">från kanten</text>
    <text x="300" y="44" fill="#625a50">två skruv per regel</text>
    <text x="498" y="214" fill="#ad3519">för nära</text>
    <text x="498" y="238" fill="#ad3519">kanten</text>
    <text x="200" y="350" font-size="22" fill="#625a50">reglarna ligger under</text>
  </g>
</svg>
