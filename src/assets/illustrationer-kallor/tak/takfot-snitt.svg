    <path d="M380,206.8 Q464.7,226.7 550,243.9 L550,254.9 L545,253.8 L545,248.8 Q462.2,232.1 380,212.8 Z M383,213.5 L383,220.5 M270,162.1 Q352.1,187.3 435,210 L435,220 L430,218.5 L430,214.5 Q349.6,192.6 270,168.1 Z M273,169 L273,176 M160,118.1 Q242.1,143.3 325,166 L325,177 L320,175.5 L320,170.5 Q239.6,148.6 160,124.1 Z M163,125 L163,132 M50,74.1 Q132.1,99.3 215,122 L215,133 L210,131.5 L210,126.5 Q129.6,104.6 50,80.1 Z M53,81 L53,88 M44,60.3 Q74.4,69.6 105,77.9 L105,88.9 L100,87.5 L100,82.5 Q71.9,74.9 44,66.3"/>
    <path d="M499,248.6 L501.5,240.3 L504,250.6 L506.5,241.4 L509,251.4 L511.5,242.5"/>
    <path d="M470,268.5 Q502.8,282.2 536,294.9 L536,294.9 Q536.5,299.5 536,304 L545,312"/>
    <path d="M520,296 Q519.5,310 520,324 M518,322 Q527,321.5 536,322 M534,324 Q534.5,312.8 534,301.6"/>
    <path d="M540,311 L540,318 A20,20 0 0 0 580,318 l3,-3 M534,313 L538,316 A23,23 0 0 0 584,318 l1,-5"/>
    <path d="M184,362 Q182.7,280 184,198 M220,362 Q221.3,280 220,198 M42,200 Q132,198.6 222,200 M42,214 Q132,215.4 222,214"/>
    <path d="M110,156 Q161.3,175.6 212,196.8 M110,159 Q160.7,180.2 212,199.8 M110,155 L110,160 M212,195.8 L212,200.8"/>
