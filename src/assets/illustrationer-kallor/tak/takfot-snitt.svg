  </g>

  <!-- Blyerts-2 1,5: måttbygeln för spalten, vinkelrätt mot taket -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160,176 L168.3,155.3 M156,180 l8,-8 M164.3,159.3 l8,-8"/>
  </g>

  <!-- Tumstock -->
  <rect x="95" y="38" width="89.3" height="30" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 139.6 53)"/>

  <!-- Blyerts-2: ledare -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M130,68 L167.3,153.3"/>
    <path d="M440,125 L506,245"/>
    <path d="M541.2,159 L536,290"/>
    <path d="M519.3,333 L527,318"/>
    <path d="M340,332.5 L334,326"/>
  </g>

  <!-- Snickarpenna: luftens väg, in genom glipan, upp längs väggen, genom spalten och ut på vinden; ledaren till luftspalt -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M226,350 Q227,281 226,222 Q226,197 210,184 Q160,165 110,144 Q97,138.3 86,133.4"/>
    <path d="M92.2,141.3 L86,133.4 L95.9,132"/>
  </g>
  <path d="M260,77 L190,170" fill="none" stroke="#ad3519" stroke-width="1.25" stroke-linecap="round"/>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#625a50">
    <text x="100" y="60" fill="#2a2521">ca 50 mm</text>
    <text x="250" y="70" fill="#ad3519">luftspalt</text>
    <text x="432" y="118">fågelband</text>
    <text x="462" y="150">takfotsplåt</text>
    <text x="300" y="348.5">panel</text>
    <text x="430" y="351">takfotsbräda</text>
  </g>
</svg>
