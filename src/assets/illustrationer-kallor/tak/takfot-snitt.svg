       takfotsbrädan, rännan med krok, väggen med hammarband, bjälklaget, vindavledaren, panelen -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42,104.8 Q289.1,200.4 534,301.6 M42,93.8 Q286.9,195 534,290.6 M532,288.8 Q532.5,295.3 532,301.8"/>
