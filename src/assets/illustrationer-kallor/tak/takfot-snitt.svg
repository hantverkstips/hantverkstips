<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Takfoten i genomskärning, där uteluften kommer in vid väggen och går upp genom en öppen spalt till vinden.">
  <!-- Anteckningsboken. Blyerts 2 px för råsponten med papp, ströläkten, läkten, pannorna, fågelbandet, takfotsplåten,
       takfotsbrädan, rännan med krok, väggen, bjälklaget, vindavledaren och panelen, blyerts-2 för
       isoleringens skraffering, måttbygeln och ledare, snickarpenna för luftens väg från glipan vid väggen upp genom
       spalten till vinden (enda pennsaken). Tumstock bakom ca 50 mm. Snitt genom ett fack mellan två takstolar,
       sett från gaveln. Inte skalenlig: skikten är förstorade. Råspontens undersida är R(x) = 88 + 0,4x.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2 1,25: isoleringens skraffering -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M48,164 l10,10 M70,164 l10,10 M92,164 l10,10 M114,164 l10,10"/>
    <path d="M59,186 l10,10 M81,186 l10,10 M103,186 l10,10 M125,186 l10,10 M147,186 l10,10 M169,186 l10,10"/>
  </g>

