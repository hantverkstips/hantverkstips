    <path d="M409,266h4M409,274h4M409,282h4M409,290h4M427,266h4M427,274h4M427,282h4M427,290h4"/>
    <path d="M418,214l4,-3M418,222l4,-3M418,230l4,-3"/>
    <path d="M320,16V296" stroke-dasharray="6 5"/>
  </g>

