<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Snitt genom foten på en toalettstol som är limmad med silikon och en som är skruvad, med tätskiktet i golvet under dem.">
  <!-- Anteckningsboken. Blyerts 2 px för foten, strängarna, klinkern, skruven, pluggen och massan, blyerts-2 för
       skraffering, fästmassa, fogar, brytlinjer, delning, byglar och ledare, snickarpenna för tätskiktet (enda pennsaken).
       Tumstock bakom 60 mm. Inte skalenlig. Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Papperslappar och tumstock bakom etiketterna i betongen -->
  <rect x="440" y="268" width="130" height="52" fill="#f5efe3"/>
  <rect x="258" y="304" width="124" height="52" fill="#f5efe3"/>
  <rect x="262" y="306" width="116" height="48" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 320 330)"/>

