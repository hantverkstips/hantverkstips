    <path d="M409,187Q420,178 431,187M418,187V292L420,298L422,292V187"/>
  </g>

  <!-- Blyerts: tätningsmassans täta prickar i hålet -->
  <path d="M415,238h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1m-10,3.5h1m8,0h1" fill="none" stroke="#2a2521" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Blyerts-2 1,5: måttbyglarna, 60 mm från klinkerns yta, med hjälplinjer -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M296,206H312M296,296H312M304,206Q305,251 304,296M300,210l8,-8M300,300l8,-8"/>
    <path d="M336,206H352M336,296H352M344,206Q343,251 344,296M340,210l8,-8M340,300l8,-8"/>
  </g>

  <!-- Blyerts-2: ledare -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M108,70L128,199"/>
    <path d="M52,160L56,241"/>
    <path d="M92,195L96,213"/>
    <path d="M441,280L426,255"/>
    <path d="M441,306L428,290"/>
    <path d="M306,306L304,299M336,306L343,299"/>
  </g>

  <!-- Snickarpenna: tätskiktet, helt under den limmade foten och tätat mot massan runt hålet under den skruvade -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round">
    <path d="M44,242Q228,243 413,242M427,242Q510,241 594,242M44,250Q228,249 413,250M427,250Q510,251 594,250"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#625a50">
    <text x="60" y="38" fill="#2a2521">limmad</text>
    <text x="344" y="38" fill="#2a2521">skruvad</text>
    <text x="60" y="64">silikonsträng</text>
    <text x="48" y="130" fill="#ad3519">helt</text>
    <text x="48" y="154" fill="#ad3519">tätskikt</text>
    <text x="60" y="190">klinker</text>
    <text x="444" y="290">tätningsmassa</text>
    <text x="444" y="314">plugg och skruv</text>
    <text x="320" y="326" text-anchor="middle" fill="#2a2521">golvet ska</text>
    <text x="320" y="350" text-anchor="middle" fill="#2a2521">tillåta 60 mm</text>
  </g>
</svg>
