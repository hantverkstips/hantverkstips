<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Innerhörn i en dusch med våtrumstapet, där skarven nära hörnet är svetsad och skarvarna utanför duschen ligger omlott.">
  <!-- Anteckningsboken. Duschhörnet snett uppifrån som en öppen låda, djupvektor (-140, 56). Blyerts 2 px för
       innerhörnet, väggarnas och golvets kanter, tapetens nederkant (den vågräta omlotten) och omlottskarvens
       synliga kant, blyerts-2 för golvmattans dolda uppvik, duschplatsens streckade gräns, omlottens täckta kant,
       måttbygeln och ledare, snickarpenna för den svetsade skarven och dess etikett (enda pennsaken).
       Tumstock bakom minst 100 mm. Inte skalenlig: 100 mm är ritat som 50 enheter. GVK Säkra Våtrum 2026 § 8.2.4.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Papperslapp bakom etiketten på golvet, tumstock bakom minst 100 mm -->
  <rect x="246" y="320" width="191" height="30" fill="#f5efe3"/>
  <rect x="258" y="108" width="124" height="23" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 320 119)"/>

  <!-- Blyerts: innerhörnet, golvlinjerna, vänsterväggens ytterkant, tapetens nederkant obruten runt hörnet,
       omlottskarvens synliga kant -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200,302Q199,157 200,12M197,300Q400,301 602,300M202,299Q131,328 57,357M60,358Q59,213 60,68"/>
    <path d="M60,342Q131,313 200,286Q400,287 602,286"/>
    <path d="M520,286Q521,149 520,12"/>
  </g>

  <!-- Blyerts-2 1,5 streckad: golvmattans uppvik dolt bakom tapeten, duschplatsen upp till 2,0 m -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="7 5">
    <path d="M60,330Q131,301 200,274Q400,275 602,274"/>
    <path d="M400,300Q401,180 400,60Q300,61 200,60Q131,87 60,116"/>
  </g>

  <!-- Blyerts-2 1,25 streckad: omlottskarvens täckta kant -->
  <path d="M512,286Q513,149 512,12" fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round" stroke-dasharray="6 5"/>

  <!-- Blyerts-2 1,5: måttbygeln från hörnet till den svetsade skarven -->
  <path d="M200,110Q225,109 250,110M197,113l6,-6M247,113l6,-6" fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Blyerts-2: ledare -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M256,125L226,113"/>
    <path d="M484,176L511,186"/>
    <path d="M330,320L330,281"/>
  </g>

  <!-- Snickarpenna: den svetsade skarven med tvärstreck som en svetstråd -->
  <path d="M250,286Q252,149 250,12M248,278h4M248,262h4M248,246h4M248,230h4M248,214h4M248,198h4M248,182h4M248,166h4M248,150h4M248,134h4M248,118h4M248,102h4M248,86h4M248,70h4M248,54h4M248,38h4M248,22h4" fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="262" y="126">minst 100 mm</text>
    <text x="262" y="180" fill="#ad3519">svetsad skarv</text>
    <text x="270" y="250" fill="#625a50">duschplats</text>
    <text x="414" y="80" fill="#625a50">våtzon 1</text>
    <text x="430" y="180">omlott</text>
    <text x="250" y="340">omlott mot golvmattan</text>
  </g>
</svg>
