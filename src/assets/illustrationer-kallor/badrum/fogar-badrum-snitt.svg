<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Snitt genom hörnet mellan vägg och golv i ett badrum, där kniven skär ur silikonfogen och stannar före tätskiktet.">
  <!-- Anteckningsboken. Blyerts 2 px för stommens insida, tätskiktet, plattorna och silikonfogen, blyerts-2 för
       skraffering, fästmassans prickar, cementfogarnas streck, silikonens bågar och ledare, snickarpenna för
       kniven som stannar i silikonfogen (enda pennsaken). Inte skalenlig: skikten är förstorade och plattorna kortade.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
