<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Två snitt som visar hur du monterar en duschvägg med skruv i träregel eller betong, med tätningsmassa i hålet.">
  <!-- Anteckningsboken. Två väggar i ett duschhörn i snitt uppifrån, rummet i mitten. Blyerts 2 px för skikten,
       profilerna, skruvarna, pluggen och hålen, blyerts-2 för regelns ådring, betongens skraffering, fästmassans
       prickar, fogarnas och gängornas streck, pluggens räfflor och ledare, blyerts 1,5 för tätningsmassans täta prickar,
       snickarpenna för ringarna runt massan vid tätskiktet, etiketten och dess ledare (enda pennsaken).
       Inte skalenlig: skikten är förstorade. Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
