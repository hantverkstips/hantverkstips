<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Två centraler sitter bredvid varandra, sedda rakt framifrån och lika stora. Till vänster sitter ett proppskåp med åtta propphuvar i två rader och ingen jordfelsbrytare. Till höger sitter en elcentral med en jordfelsbrytare och tolv automatsäkringar i två rader. En röd ring markerar jordfelsbrytaren i den nya centralen.">
  <!-- Anteckningsboken. Blyerts 2 px för båda centralerna, propphuvarna med skyddsglaset,
       jordfelsbrytaren och automatsäkringarna. Snickarpenna 2,5 px för ringen runt
       jordfelsbrytaren i den nya centralen, som är den enda saken som pekar. Inget nyckeltal
       och ingen tumstock: bildens jobb är att läsaren känner igen sin central.
       Ingen skala. Inga märken, inga kablar, ingen pil mellan centralerna.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

