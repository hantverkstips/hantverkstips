    <path d="M532,196 l8,8 M532,218 l8,8 M532,240 l8,8 M532,262 l8,8"/>
  </g>

  <!-- Snickarpenna: den öppna ringen kring den igentäppta spalten vid takfoten -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M400,236 Q396,214 368,212 Q336,210 332,246 Q329,282 364,286 Q388,288 398,274"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="146" y="68">rätt</text>
    <text x="424" y="68">fel</text>
    <text x="240" y="178" fill="#625a50">50 mm</text>
    <text x="44" y="344" fill="#625a50">vindavledare</text>
    <text x="330" y="344" fill="#ad3519">spalten igenbyggd</text>
  </g>
</svg>
