    <path d="M106,300 Q199,302 292,300"/>
    <path d="M96,249 Q164,209 232,169"/>
    <path d="M112,252 Q172,216 232,180 Q262,179 292,180"/>
    <path d="M112,252 Q111,266 112,280"/>
    <path d="M112,280 Q202,282 292,280"/>
  </g>
  <g fill="none" stroke="#625a50" stroke-width="3.5" stroke-linecap="round">
    <path d="M102,286 Q197,284 292,286"/>
  </g>
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M115,302 l8,8 M115,312 l8,8 M127,302 l8,8 M127,312 l8,8"/>
    <path d="M126,258 l8,8 M126,270 l8,8"/>
    <path d="M152,238 l8,8 M152,258 l8,8 M152,270 l8,8"/>
    <path d="M178,224 l8,8 M178,246 l8,8 M178,266 l8,8"/>
    <path d="M204,210 l8,8 M204,232 l8,8 M204,254 l8,8 M204,268 l8,8"/>
    <path d="M230,196 l8,8 M230,218 l8,8 M230,240 l8,8 M230,262 l8,8"/>
    <path d="M256,196 l8,8 M256,218 l8,8 M256,240 l8,8 M256,262 l8,8"/>
    <path d="M278,196 l8,8 M278,218 l8,8 M278,240 l8,8 M278,262 l8,8"/>
  </g>
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34,286 Q50,282 62,272 Q78,252 96,240 Q136,218 176,194"/>
    <path d="M168,187 L177,194 L170,202"/>
    <path d="M200,174 Q204,179 206,185"/>
    <path d="M194,178 L206,170"/>
    <path d="M200,189 L212,181"/>
    <path d="M238,172 Q225,177 213,181"/>
  </g>

  <!-- Höger panel, fel. Samma takfot, ingen vindavledare, ullen utdragen mot takfoten -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M324,258 Q442,189 560,120"/>
    <path d="M324,258 Q320,265 323,272"/>
