<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Två skisser av samma takfot, den vänstra märkt rätt och den högra märkt fel. I båda syns yttertaket snett uppåt, takfotens undersida, den skrafferade ytterväggen och vindsbjälklaget med ångspärr och isolering. I den vänstra håller en vindavledare isoleringen nere, så att en luftspalt går från takfoten upp över ullen. En pil visar uteluften på väg in, och en måttbygel tvärs spalten är märkt 50 mm. I den högra saknas vindavledaren, isoleringen ligger an mot taket ända ut i takfoten, spalten är borta, och en ring i penna märker stället.">
  <!-- Anteckningsboken. Blyerts 2 px för yttertak, takfotsbräda, takfotens undersida, yttervägg,
       innertak, isoleringens kanter och vindavledaren, blyerts-2 för ångspärr, isolerskraffering,
       uteluftspilen (en förutsättning, inte problemet) och pekaren, snickarpenna för den öppna
       ringen kring den igentäppta spalten, som är det enda som pekar.
       Ett mått: luftspalten vid takfoten. Måttbygeln ligger vinkelrätt mot taket och spänner
       12,5 enheter, alltså 50 mm i samma skala som huvudbilden (4 mm per enhet), och i den skalan
       är isoleringens fulla tjocklek 100 enheter, alltså 400 mm. Vindavledarens andra mått,
       150 mm över färdig isoleringsnivå, ryms inte i utsnittet och står i texten i stället.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Tumstock bakom nyckeltalet, bara bakom talet -->
  <rect x="236" y="159" width="60" height="23" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 266 170)"/>

  <!-- Skiljelinje mellan de två panelerna -->
  <path d="M306,52 V336" stroke="#625a50" stroke-width="1" stroke-opacity="0.3" fill="none"/>

  <!-- Vänster panel, rätt -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56,258 Q174,189 292,120"/>
    <path d="M56,258 Q52,265 55,272"/>
    <path d="M55,272 Q84,277 112,280"/>
