  </g>
  <g fill="none" stroke="#625a50" stroke-width="3.5" stroke-linecap="round">
    <path d="M370,286 Q465,284 560,286"/>
  </g>
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M383,302 l8,8 M383,312 l8,8 M395,302 l8,8 M395,312 l8,8"/>
    <path d="M364,258 l8,8 M364,270 l8,8"/>
    <path d="M390,232 l8,8 M390,254 l8,8 M390,270 l8,8"/>
    <path d="M416,214 l8,8 M416,236 l8,8 M416,258 l8,8 M416,270 l8,8"/>
    <path d="M442,200 l8,8 M442,222 l8,8 M442,244 l8,8 M442,266 l8,8"/>
    <path d="M472,196 l8,8 M472,218 l8,8 M472,240 l8,8 M472,262 l8,8"/>
