<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Snittet går genom en regelvägg från sjuttiotalet, i facket mellan två reglar, med inne till vänster och ute till höger. Skikten är från vänster 13 mm gips, 120 mm mineralull, vindskydd, luftspalt och panel. En röd pil visar värmen på väg ut genom alla skikt. Under väggen står skiktens motstånd, 0,130 + 0,054 + 3,243 + 0,130 = 3,557, och U = 1 / 3,557 = 0,281. En bygel över luftspalten och panelen är märkt ”räknas inte”.">
  <!-- Anteckningsboken. Blyerts 2 px för gipsens och panelens linjer, blyerts-2 1,25 px för
       skrafferingen i ullen, blyerts-2 3,5 px för vindskyddet, blyerts-2 1,5 px för brytlinjerna,
       bygeln över det som inte räknas och ledlinjerna till talen. Snickarpenna 2,5 px för värmen
       på väg ut, som är den enda saken som pekar. Tumstock bakom nyckeltalet 0,281.
       Skikten är inte skalenliga: ordningen stämmer och ullen är det tjockaste skiktet, men
       gipsen, luftspalten och panelen är ritade tjockare än de är för att synas.
       Talen är sidans räkneexempel steg 1 till 5 och ändras bara om exemplet ändras.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Tumstock bakom nyckeltalet, bara bakom talet -->
  <rect x="333.5" y="316.5" width="54" height="23.5" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 360.5 328.2)"/>

  <!-- Papperslapp bakom etiketten inne i ullen, så att skrafferingen inte stör -->
  <rect x="196" y="196" width="108" height="26" fill="#f5efe3"/>

  <!-- Blyerts: gipsens och panelens linjer -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150,80q1.3,80 0,160M166,80q-1.3,80 0,160M376,80q1.3,80 0,160M396,80q-1.3,80 0,160"/>
  </g>

  <!-- Blyerts-2: skraffering i mineralullen, med glapp där värmepilen går -->
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
    <path d="M172,86 l10,10M194,86 l10,10M216,86 l10,10M238,86 l10,10M260,86 l10,10M282,86 l10,10M304,86 l10,10M183,108 l10,10M205,108 l10,10M227,108 l10,10M249,108 l10,10M271,108 l10,10M293,108 l10,10M315,108 l10,10M172,164 l10,10M194,164 l10,10M216,164 l10,10M238,164 l10,10M260,164 l10,10M282,164 l10,10M304,164 l10,10M183,184 l10,10M205,184 l10,10M227,184 l10,10M249,184 l10,10M271,184 l10,10M293,184 l10,10M315,184 l10,10M172,208 l10,10M315,208 l10,10M183,229 l10,10M205,229 l10,10M227,229 l10,10M249,229 l10,10M271,229 l10,10M293,229 l10,10M315,229 l10,10"/>
  </g>

  <!-- Blyerts-2: vindskyddet -->
  <g fill="none" stroke="#625a50" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M333,80q1,80 0,160"/>
  </g>

  <!-- Blyerts-2: brytlinjerna, bygeln över det som inte räknas och ledlinjerna till talen -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M144,80 L176,73 L208,87 L241,74 L273,87 L305,73 L338,86 L370,73 L402,80M144,240 L176,247 L208,233 L241,246 L273,233 L305,247 L338,234 L370,247 L402,240M330,60q34,1.4 68,0M330,59q0.6,4.5 0,9M398,59q-0.6,4.5 0,9M150,54q4.6,14.8 8,30M160,272q-0.4-14-2-28M248,272q-0.6-14 0-28M356,272q0.6-14 0-28"/>
  </g>

  <!-- Snickarpenna: värmen på väg ut genom alla skikt -->
  <g fill="none" stroke="#ad3519" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64,150 Q302,144 540,150M528.5,142 L540,150 L528.5,158"/>
  </g>

  <!-- Handskrift (Caveat) -->
  <g font-family="'Caveat', 'Segoe Print', cursive" font-weight="500" font-size="24" fill="#2a2521">
    <text x="314" y="44" fill="#625a50">räknas inte</text>
    <text x="108" y="56">gips</text>
    <text x="72" y="120">inne</text>
    <text x="470" y="120">ute</text>
    <text x="200" y="216">120 mm ull</text>
    <text x="64" y="290" fill="#625a50">0,130</text>
    <text x="118" y="290" fill="#625a50">+</text>
    <text x="138" y="290" fill="#625a50">0,054</text>
    <text x="200" y="290" fill="#625a50">+</text>
    <text x="224" y="290" fill="#625a50">3,243</text>
    <text x="298" y="290" fill="#625a50">+</text>
    <text x="334" y="290" fill="#625a50">0,130</text>
    <text x="392" y="290" fill="#625a50">= 3,557</text>
    <text x="200" y="334">U = 1 / 3,557 = 0,281</text>
  </g>
</svg>
