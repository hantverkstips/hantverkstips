<svg viewBox="0 0 356 64" width="356" height="64" role="img" aria-label="Hantverkstips">
  <!-- Riktning 1, Anteckningsboken. Variant avsedd att inlineas i layoutens sidhuvud.
       Skillnad mot ordmarke.svg: inget xmlns (behövs inte inline i HTML), typsnitt och
       färger sätts via style-attribut så att texten ärver self-hostade Zilla Slab genom
       variabeln font-serif och färgerna följer tokens. Reserv i var() är tokenvärdet.
       Storlek styrs av CSS på elementet (height, width: auto); width/height här är
       bara proportion. Konverteras till banor med fonttools när det finns tillgängligt,
       då kan text-elementet bytas mot en path och ordmärket bli oberoende av typsnittet. -->
  <g transform="translate(6 8) scale(1.5)">
    <g style="stroke: var(--color-blyerts, #2a2521); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;">
      <rect x="3" y="2" width="7" height="28" rx="3.5" style="fill: var(--color-tumstock, #e8b830);"/>
      <rect x="22" y="2" width="7" height="28" rx="3.5" style="fill: var(--color-tumstock, #e8b830);"/>
      <path d="M5,7 h1.5 M5,11 h2.5 M5,21 h2.5 M5,25 h1.5 M24,7 h1.5 M24,11 h2.5 M24,21 h2.5 M24,25 h1.5" style="stroke-width: 1;"/>
      <rect x="6.5" y="12.5" width="19" height="7" rx="3.5" style="fill: var(--color-tumstock, #e8b830);" transform="rotate(-7 16 16)"/>
    </g>
    <g style="fill: var(--color-blyerts, #2a2521);" transform="rotate(-7 16 16)">
      <circle cx="10" cy="16" r="1.4"/>
      <circle cx="22" cy="16" r="1.4"/>
    </g>
  </g>
  <text x="66" y="42" style="font-family: var(--font-serif, 'Zilla Slab', Georgia, serif); font-weight: 600; font-size: 38px; letter-spacing: -0.5px; fill: var(--color-blyerts, #2a2521);">Hantverkstips</text>
  <path d="M68,52 Q150,48.5 230,51 T348,50" style="fill: none; stroke: var(--color-penna, #ad3519); stroke-width: 3; stroke-linecap: round;"/>
</svg>
