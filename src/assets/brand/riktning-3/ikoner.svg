<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Riktning 3, Magasinet. 16 ikoner, 24 x 24, fyllda former, raka hörn.
       De sju pelarikonerna står på en gul sockel (2 x 20 x 3, token gul #f5c400).
       Gränssnittsikoner är enfärgade. fill = currentColor, sätts till token svart #111111 via CSS.
       Sök och check använder linje 3 med raka ändar så de har samma tyngd som de fyllda. -->

  <symbol id="ikon-fukt" viewBox="0 0 24 24" fill="currentColor">
    <path d="M12,1 C12,1 5.5,9 5.5,13.5 A6.5,6.5 0 0 0 18.5,13.5 C18.5,9 12,1 12,1 Z"/>
    <rect x="2" y="20" width="20" height="3" fill="#f5c400"/>
  </symbol>

  <symbol id="ikon-altan" viewBox="0 0 24 24" fill="currentColor">
    <path d="M2,8 H22 V11 H2 Z M2,13 H22 V16 H2 Z M5,16 H8 V20 H5 Z M16,16 H19 V20 H16 Z M5,1 H8 V8 H5 Z M16,1 H19 V8 H16 Z M8,2.5 H16 V4.5 H8 Z"/>
    <rect x="2" y="20" width="20" height="3" fill="#f5c400"/>
  </symbol>

  <symbol id="ikon-tak" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd">
    <path d="M12,1 L23,11 H19 V19 H5 V11 H1 Z M10,12 H14 V19 H10 Z"/>
    <path d="M15,3 H18 V7.5 L15,4.8 Z"/>
