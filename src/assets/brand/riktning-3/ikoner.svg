    <path d="M7,3 L17,6.3 L7,9.6 L17,12.9 L7,16.2 L17,19.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter"/>
    <rect x="2" y="20" width="20" height="3" fill="#f5c400"/>
  </symbol>

  <symbol id="ikon-verktyg" viewBox="0 0 24 24" fill="currentColor">
