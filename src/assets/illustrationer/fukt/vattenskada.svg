<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Vattenskada under diskbänken i genomskärning, med vattnet under golvet och en avfuktare som torkar.">
  <!-- Anteckningsboken, samma hand som fuktskada.svg. Kök i genomskärning: vägg, överskåp, bänkskiva med ho och
       blandare, skåpet under diskbänken med vattenlås och vattenledning med en koppling som droppar. Flytande golv
       (parkett på underlagsmatta) på skrafferad betong; vattnet ligger som ett vågigt band mellan mattan och betongen
       från skåpet och in under golvet. Fläkt på golvet med en blyertspil längs golvytan, avfuktare (låda med galler).
       Pennan pekar på läckan, enda pennsaken. Rutan uppe till höger: ledningen in genom väggen, ventil, vattenmätare,
       ventil, blyerts. Ingen markering, inga tal, inga människor. Handskrift i Caveat 500, konverteras till banor.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
