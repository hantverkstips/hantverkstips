<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Ett tvåglasfönster i genomskärning, där kondens på fönstret bildas först längst ner på insidan, vid listen mellan glasen.">
  <!-- Anteckningsboken. Blyerts 2 px för väggens kontur, karmen, bågen, de två glasen, listen, fönsterbänken och
       fönsterblecket, blyerts-2 för väggens skraffering och ledaren till listen, snickarpenna för imman på
       innerglasets rumssida, dropparna och randen längst ner (enda pennsaken), och ledaren till imma.
       Tumstock bakom daggpunkten. Lodrätt snitt genom fönstret, ute till vänster, inne till höger.
       Inte skalenlig: glasen, listen och bågen är förstorade.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2 1,25: väggens skraffering, ovanför y 0 till 30 och under y 300 till 360 -->
