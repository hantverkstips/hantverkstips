  <!-- Blyerts: marken, väggarna, bjälklagen, taket, kanalerna, piporna, trappan, spisen och badkaret -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- mark -->
    <path d="M44,312 Q320,313.5 596,312"/>
    <!-- vänster vägg: in- och utsida, bruten vid fönstren och ventilen -->
    <path d="M212,146 Q211.6,158 212,170 M212,204 Q211.6,218 212,232 M212,244 Q212.3,253 212,262 M212,300 Q212.3,307 212,314 M220,146 Q220.4,158 220,170 M220,204 Q220.4,218 220,232 M220,244 Q219.7,253 220,262 M220,300 Q219.7,307 220,314"/>
    <!-- fönstren: karm överst, glas, bröstning med bleck ut -->
    <path d="M212,170 H220 M216,170 V204 M207,204 H220 M212,262 H220 M216,262 V300 M207,300 H220"/>
    <!-- ventilen: galler i väggen -->
