<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Självdrag i ett äldre hus i genomskärning, med luften in vid fönstret och ut genom kanalerna i taket.">
  <!-- Anteckningsboken, samma hand som kallras.svg och hus-rf-per-rum.svg. Tvåplanshus i genomskärning: kök på
       bottenvåningen till höger, badrum en trappa upp till höger, kallvind under taket. Två kanaler, från köket och
       från badrummet, rakt upp genom vinden och ut som två pipor. Tilluftsventilen sitter ovanför fönstret i vänster
       vägg, på motsatt sida mot kanalerna. Luftens väg i snickarpenna (enda pennsaken): in vid ventilen, genom
       bottenvåningen till kökskanalen, och en gren upp genom trappan till badrumskanalen. Uppe till vänster samma hus
       förenklat en sommardag med sol, korta streckade pilar i blyerts-2: draget är nästan borta. Ingen markering,
       inga mått. Inte skalenlig. Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2 1,25: markens skraffering -->
