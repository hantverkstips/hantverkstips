  <!-- Blyerts: marken, väggarna, bjälklagen, taket, kanalerna, piporna, trappan, spisen och badkaret -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- mark -->
    <path d="M44,312 Q320,313.5 596,312"/>
    <!-- vänster vägg: in- och utsida, bruten vid fönstren och ventilen -->
    <path d="M212,146 Q211.6,158 212,170 M212,204 Q211.6,221 212,238 M212,252 Q212.3,257 212,262 M212,300 Q212.3,307 212,314 M220,146 Q220.4,158 220,170 M220,204 Q220.4,221 220,238 M220,252 Q219.7,257 220,262 M220,300 Q219.7,307 220,314"/>
