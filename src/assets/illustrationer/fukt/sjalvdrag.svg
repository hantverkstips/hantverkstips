    <!-- taket, brutet vid piporna -->
    <path d="M193,152 Q278,100 366,51 Q395,68 424,84.9 M442,95.4 Q449,99.5 456,103.5 M474,114.1 Q506,133 539,152"/>
    <!-- badrumskanalen och dess pipa -->
