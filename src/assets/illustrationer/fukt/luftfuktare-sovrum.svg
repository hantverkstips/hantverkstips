<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Ett sovrum en vinternatt med en luftfuktare igång, kondens på fönstret och en fuktfläck nere i ytterväggens hörn.">
  <!-- Anteckningsboken, samma hand som kallras.svg. Sovrummet från sidan, yttervägg till vänster med ett tvåglasfönster.
       Luftfuktaren på golvet med ånga i blyerts-2, sängen skymtar till höger. Dropparna på glasets insida i snickarpenna
       (enda pennsaken). Fläcken i hörnet mellan yttervägg och golv i tät skraffering, blyerts-2. Inte skalenlig.
       Tumstock bakom rummets luft, enda markeringen. Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

