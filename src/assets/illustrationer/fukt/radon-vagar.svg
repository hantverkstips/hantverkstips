<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Radonets tre vägar in i en villa, från marken, från en vägg av blåbetong och från brunnen, och mätdosor i fyra rum.">
  <!-- Anteckningsboken, samma hand som kallras.svg. Tvåplanshus med pulpettak i genomskärning, platta på mark.
       Markluften i snickarpenna upp genom en spricka i plattan (enda pennsaken). Blåbetongväggen och brunnen med
       röret in i huset i blyerts-2. Fyra mätdosor, två rum per plan, byglar till väggen och fönstret vid en av dem.
       Tumstock bakom referensnivån, enda markeringen. Inte skalenlig. Caveat 500 blir banor.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
