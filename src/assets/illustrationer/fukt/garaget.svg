<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Ett enkelgarage i genomskärning med en avfuktare i garaget vid ytterväggen, där slangen leder den fuktiga luften ut.">
  <!-- Anteckningsboken. Blyerts 2 px för marken, betongplattan, taket, porten med glipan, bakväggen med hålet,
       bilen med kupé, fönster och hjul, avfuktaren med gallret, slangen, hygrometern och bensindunken,
       blyerts-2 för markens skraffering, snön på bilen, dropparna, korset på dunken och ledare, snickarpenna för
       den fuktiga luften som går ut ur slangens mynning (enda pennsaken) och ledaren till slangen ut.
       Tumstock bakom 60 %. Garaget i genomskärning på längden, porten till vänster, ute till höger.
       Inte skalenlig: avfuktaren, slangen och dunken är förstorade.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
