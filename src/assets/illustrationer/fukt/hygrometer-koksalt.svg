<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="En hygrometer i en sluten glasburk bredvid en skål med blött koksalt, och displayen visar 75,3 procent.">
  <!-- Anteckningsboken, samma hand som tejptest.svg. Blyerts 2 px för bordet, burken med locket, skålen och
       hygrometern, blyerts-2 för glasets reflex, gängan, saltet, vattenlinjen och ledaren, snickarpenna för den
       öppna ringen runt displayen (enda pennsaken). Sett från sidan. Inte skalenlig. Hygrometern är generisk.
       Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

