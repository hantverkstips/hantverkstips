<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Torpargrund i genomskärning med stenfot, syll, trossbotten med spån, jordbotten och en glugg där uteluften kommer in.">
  <!-- Anteckningsboken, samma hand som krypgrund-sommarkondens.svg och sjalvdrag.svg. Torpet i genomskärning:
       timmerväggens nederdel som antydan, syllstocken liggande på en stenfot av runda stenar utan bruk, med en
       kattglugg under en flat överliggare. Golvbjälkarna i genomskärning på en bärlina som vilar på en stenstod och
       går in i murstockens fundament. Trossbotten mellan bjälkarna: bräda, lerkaka skrafferad, spån som korta streck.
       Jord under huset, skrafferad. Sommarluften in genom gluggen i blyerts, en givare på sladd instucken genom
       gluggen, en svag värmepil i blyerts-2 från murstocken. Snickarpennan pekar på syllen (enda pennsaken).
       Ingen markering, inga mått. Inte skalenlig. Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

