<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Snitt genom en betongplatta på cellplast med borrhålet för fuktmätning ner till 0,4 gånger tjockleken.">
  <!-- Anteckningsboken, skiss för /kunskap/fuktmatning-betong/. Betongplatta på cellplast i snitt, ritad stor:
       plattan 110 hög (H), cellplasten under med korta vågiga streck, brott till höger. Borrhålet med mätrör, lock
       och givare ner till exakt 0,4 × H (44). Måttbygel blyerts-2 från ytan till hålets botten, gul markering bakom
       nyckeltalet 0,4 × H; en andra bygel till vänster för hela tjockleken H. Torkpilar i blyerts bara uppåt, inga
       pilar mot cellplasten. Snickarpennan pekar på givaren, enda pennsaken.
       Rutan uppe till höger: ett bjälklag (72 högt) som torkar åt båda hållen, pilar upp och ner, med mätrör och givare i hålet ner till
       0,2 × H (14,4); bygeln utanför högra kanten med etiketten ovanför. Blyerts, ingen markering.
       Handskrift i Caveat 500, 24 px, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
