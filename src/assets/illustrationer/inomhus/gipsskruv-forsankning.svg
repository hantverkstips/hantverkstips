<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Tre försänkningar av gipsskruv i genomskärning. Till vänster för grunt, huvudet står över ytan. I mitten rätt, huvudet 0,5 till 1 mm under ytan med kartongen hel. Till höger för djupt, huvudet har gått genom kartongen, inringat med anteckningen den här håller inte.">
