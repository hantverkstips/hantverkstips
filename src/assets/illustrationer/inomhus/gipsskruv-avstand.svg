<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-label="Gipsskiva 1 200 gånger 2 400 mm framifrån med reglar c 600 streckade bakom. Skruvpunkter c 200 längs kanterna och c 300 i fältet, minst 10 mm från kanten. En skruv för nära kanten är inringad med anteckningen den här spräcker kanten.">
  <!-- Anteckningsboken. Blyerts 2 px för skivan och skruvpunkterna, blyerts-2 för reglar och måttbyglar,
       snickarpenna för ringen runt skruven för nära kanten (enda pennsaken). Inte skalenlig, kantavståndet är
       överdrivet så att det syns. Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="380" fill="url(#linjerat)"/>
  <path d="M40,0 V380" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2: reglar c 600 bakom skivan -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="8 6">
    <path d="M190,8 V356 M300,8 V356 M410,8 V356"/>
  </g>

  <!-- Blyerts: skivan -->
  <path d="M188,20 Q300,18 412,20 Q411,185 410,352 Q300,351 188,350 Q191,185 190,18" fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
