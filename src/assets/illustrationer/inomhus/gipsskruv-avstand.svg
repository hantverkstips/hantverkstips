    <circle cx="231.5" cy="336.5" r="3.5"/><circle cx="259" cy="336.5" r="3.5"/><circle cx="286.5" cy="336.5" r="3.5"/><circle cx="314" cy="336.5" r="3.5"/><circle cx="341.5" cy="336.5" r="3.5"/><circle cx="369" cy="336.5" r="3.5"/>
