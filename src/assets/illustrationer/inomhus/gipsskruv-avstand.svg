    <!-- skruven för nära kanten -->
    <circle cx="195" cy="152" r="3.5"/>
  </g>

  <!-- Måttbyglar i blyerts-2 -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M176,34 V61.5 M171,34 h10 M171,61.5 h10"/>
    <path d="M314,130 V171 M309,130 h10 M309,171 h10"/>
    <path d="M396,208 H410 M396,203 v10 M410,203 v10"/>
  </g>

