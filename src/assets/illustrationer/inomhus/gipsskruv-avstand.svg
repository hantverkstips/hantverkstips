    <circle cx="204" cy="34" r="3.5"/><circle cx="204" cy="61.5" r="3.5"/><circle cx="204" cy="89" r="3.5"/><circle cx="204" cy="116.5" r="3.5"/><circle cx="204" cy="144" r="3.5"/><circle cx="204" cy="171.5" r="3.5"/><circle cx="204" cy="199" r="3.5"/><circle cx="204" cy="226.5" r="3.5"/><circle cx="204" cy="254" r="3.5"/><circle cx="204" cy="281.5" r="3.5"/><circle cx="204" cy="309" r="3.5"/><circle cx="204" cy="336.5" r="3.5"/>
