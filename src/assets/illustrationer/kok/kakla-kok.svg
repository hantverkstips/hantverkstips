<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="En köksvägg framifrån med två steg för att kakla kök, först hela plattor på en list och sedan silikon mot bänkskivan.">
  <!-- Anteckningsboken. Blyerts 2 px för överskåpen, bänkskivan, plattorna, den kapade raden, eluttaget och
       silikonsträngen, blyerts-2 för underskåpen, delningslinjen, bågarna i silikonet och ledare, snickarpenna för
       listen med kilarna (enda pennsaken). Vänster halva under arbetet, höger halva klar. Inte skalenlig: plattorna
       är 44 med 3 i fog, glipan förstorad till 10. Handskrift i Caveat 500, konverteras till banor vid bygget.
