<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="En rak rätskiva ligger över ett ojämnt undergolv och vilar på två höga punkter. Mitt emellan dem finns en svacka under rätskivan. En lodrät måttbygel i svackan är märkt högst 3 millimeter, med talet i gul markering. Undergolvet är skrafferat och löper ut ur bildens underkant. En röd pil pekar på svackan, med anteckningen att den spacklas först.">
  <!-- Anteckningsboken. Blyertsskiss på linjerat papper. Undergolvet skrafferat i
       blyerts-2 och utan underkant. Rätskivan i blyerts, svackan måttsatt i blyerts-2
       och utpekad av snickarpennan.
       Skala: bilden har ett enda mått, den lodräta bygeln, som spänner 24 enheter
       och är märkt 3 mm. Rätskivans längd är avsiktligt inte måttsatt, eftersom en
       rätskiva på 2 m och en svacka på 3 mm inte ryms i samma skala. Längden står
       i stället i bildtexten.
       Handskrift i Caveat 500, konverteras till banor med npm run illustrationer.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50,
       penna #ad3519, tumstock #e8b830 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <!-- Blyerts-2, tunn: skraffering i undergolvet, som löper ut ur underkanten -->
