<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Hus med sadeltak där snörasskyddet går längs hela takfoten, förbi entrédörren åt båda hållen.">
  <!-- Anteckningsboken. Blyerts 2 px för huset, taket, dörren, fönstret, marken och konsolerna, blyerts-2 för
       skraffering, snöns överkant, måttbygeln och ledare, snickarpenna för snörasskyddet i hela takfotens längd
       (enda pennsaken). Tumstock bakom måttet högst c 1 200 mm. Inte skalenlig: huset ritas utan mått.
       Parallellprojektion, djupvektor (100, -60). Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830 -->
