<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Ett tak i genomskärning med ett takläckage vid en huv, där vattnet rinner nedåt längs taket innan det syns i innertaket.">
  <!-- Anteckningsboken. Blyerts 2 px för pannorna, bärläkten, ströläkten, råsponten med papp, takstolen, huven med
       kragen och bjälklaget, blyerts-2 för isoleringens skraffering och ledare, snickarpenna för vattnets väg från
       kragen längs takstolens undersida till fläcken i innertaket (enda pennsaken). Inget mått, ingen tumstock.
       Snitt längs en takstol, sett från gaveln. Inte skalenlig: skikten är förstorade. Råspontens undersida är
       U(x) = 56 + 0,34(x - 44). Handskrift i Caveat 500, konverteras till banor vid bygget.
       Tokens: papper #f5efe3, linje #c9bca3, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519 -->
  <defs>
    <pattern id="linjerat" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#f5efe3"/>
      <path d="M0,23.5 H48" stroke="#c9bca3" stroke-width="0.75" fill="none"/>
    </pattern>
  </defs>
  <rect width="600" height="360" fill="url(#linjerat)"/>
  <path d="M40,0 V360" stroke="#ad3519" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

