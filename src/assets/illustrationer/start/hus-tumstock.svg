<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" role="img" aria-label="Ett hus vars kontur är en tumstock vikt i sex segment, med leder och måttsiffror. Inuti huset en takstol, ett elskåp med blixt, en skruv i väggen och en droppe i källaren, och en altan utanför den högra väggen.">
  <!-- Varumärkesillustration, riktning 1. Samma hand som symbolen och ordmärket: tumstocken vikt
       till en form, gula segment med leder, streck och siffror i blyerts, ett rött pennstreck som
       signatur. Detta är inte en skiss på linjerat papper. Bakgrunden är transparent så att
       sidans papper syns igenom. Siffrorna är banor, inga textelement, ingen konvertering behövs:
       npm run illustrationer rör inte filen och den har ingen källa under illustrationer-kallor.
       På startsidan ligger den som img med tom alt eftersom H1 bär meningen.
       Motivet är ritat i sin egen skala och läggs ut i viewBox med en skalning i yttre g:et, så
       att hus, mark och altan fyller drygt 90 procent av bredden och knappt 90 procent av höjden
       (2026-09-16: bilden ska väga lika mycket som H1 bredvid den).
       Tokens: tumstock #e8b830, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519. -->

  <defs>
    <!-- Siffror på tumstocken. Höjd 12, bredd 6,5, blyerts. -->
    <g id="d0" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.25,.6 Q6.2,.6 6.2,6 Q6.2,11.4 3.25,11.4 Q.3,11.4 .3,6 Q.3,.6 3.25,.6 Z"/>
    </g>
    <g id="d2" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M.6,3.3 Q.8,.6 3.3,.6 Q6.1,.6 6.1,3.6 Q6.1,6.2 .6,11.4 L6.3,11.3"/>
    </g>
    <g id="d4" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.8,11.4 V.8 L.3,8 H6.4"/>
    </g>
    <g id="d6" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.7,1.2 Q3,.2 1.5,3.9 Q.3,6.6 .7,9.1 Q1.3,11.6 3.5,11.5 Q6.1,11.4 6.1,8.7 Q6.1,6 3.5,6 Q1.5,6 .9,7.6"/>
    </g>
    <g id="d8" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.25,5.9 Q.6,5.5 .6,3.1 Q.6,.6 3.25,.6 Q5.9,.6 5.9,3.1 Q5.9,5.5 3.25,5.9 Q6.4,6.3 6.4,8.8 Q6.4,11.4 3.25,11.4 Q.1,11.4 .1,8.8 Q.1,6.3 3.25,5.9 Z"/>
    </g>
  </defs>

  <g transform="translate(-72.6 -44.6) scale(1.17)">

    <!-- Marken utanför huset. Källaren ligger under mark. -->
    <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round">
      <path d="M80,255.5 Q110,254 142,256.5"/>
      <path d="M458,256.5 Q505,254.5 552,256"/>
    </g>
    <g fill="none" stroke="#625a50" stroke-width="1.4" stroke-linecap="round">
      <path d="M84,263 l10,10 M106,263 l10,10 M128,263 l10,10"/>
      <path d="M94,289 l10,10 M116,289 l10,10"/>
      <path d="M84,315 l10,10 M106,315 l10,10 M128,315 l10,10"/>
      <path d="M470,263 l10,10 M492,263 l10,10 M514,263 l10,10 M536,263 l10,10"/>
      <path d="M480,289 l10,10 M502,289 l10,10 M524,289 l10,10"/>
      <path d="M470,315 l10,10 M492,315 l10,10 M514,315 l10,10 M536,315 l10,10"/>
    </g>

    <!-- Huset: en tumstock vikt i sex segment. Ändarna möts i det vänstra nedre hörnet utan att låsa. -->
    <g>
      <!-- 1. vänster vägg -->
      <g transform="translate(150 342) rotate(-90)">
        <rect x="0" y="-12" width="182" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
        <path d="M14,12 V5.5 M30,12 V8.5 M46,12 V8.5 M62,12 V5.5 M78,12 V8.5 M94,12 V8.5 M110,12 V5.5 M126,12 V8.5 M142,12 V8.5 M158,12 V5.5 M174,12 V8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
        <use href="#d2" x="100" y="-9"/><use href="#d0" x="109" y="-9"/>
      </g>
      <!-- 2. vänster takfall -->
      <g transform="translate(140 178.7) rotate(-33.7)">
        <rect x="0" y="-12" width="204" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
        <path d="M14,12 V5.5 M30,12 V8.5 M46,12 V8.5 M62,12 V5.5 M78,12 V8.5 M94,12 V8.5 M110,12 V5.5 M126,12 V8.5 M142,12 V8.5 M158,12 V5.5 M174,12 V8.5 M190,12 V8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
        <use href="#d4" x="120" y="-9"/><use href="#d0" x="129" y="-9"/>
      </g>
      <!-- 3. höger takfall -->
      <g transform="translate(290 65.3) rotate(33.7)">
        <rect x="0" y="-12" width="204" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
        <path d="M14,12 V5.5 M30,12 V8.5 M46,12 V8.5 M62,12 V5.5 M78,12 V8.5 M94,12 V8.5 M110,12 V5.5 M126,12 V8.5 M142,12 V8.5 M158,12 V5.5 M174,12 V8.5 M190,12 V8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
        <use href="#d6" x="70" y="-9"/><use href="#d0" x="79" y="-9"/>
      </g>
      <!-- 4. höger vägg. Två streck utelämnade där skruven sitter. -->
      <g transform="translate(450 160) rotate(90)">
        <rect x="0" y="-12" width="182" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
        <path d="M14,12 V5.5 M30,12 V8.5 M78,12 V8.5 M94,12 V8.5 M110,12 V5.5 M126,12 V8.5 M142,12 V8.5 M158,12 V5.5 M174,12 V8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
        <use href="#d8" x="100" y="-9"/><use href="#d0" x="109" y="-9"/>
      </g>
      <!-- 5. höger halva av bottenplattan -->
      <g transform="translate(462 330) rotate(180)">
        <rect x="0" y="-12" width="174" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
        <path d="M14,12 V5.5 M30,12 V8.5 M46,12 V8.5 M62,12 V5.5 M78,12 V8.5 M94,12 V8.5 M110,12 V5.5 M126,12 V8.5 M142,12 V8.5 M158,12 V5.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <!-- 6. vänster halva av bottenplattan. Änden lägger sig över den andra änden. -->
      <g transform="translate(312 330) rotate(180)">
        <rect x="0" y="-12" width="174" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
        <path d="M14,12 V5.5 M30,12 V8.5 M46,12 V8.5 M62,12 V5.5 M78,12 V8.5 M94,12 V8.5 M110,12 V5.5 M126,12 V8.5 M142,12 V8.5 M158,12 V5.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <!-- Lederna: nit i blyerts med beslagsring i blyerts-2 -->
      <g fill="none" stroke="#625a50" stroke-width="1.2">
        <circle cx="150" cy="172" r="7"/><circle cx="300" cy="72" r="7"/><circle cx="450" cy="172" r="7"/>
        <circle cx="450" cy="330" r="7"/><circle cx="300" cy="330" r="7"/>
      </g>
      <g fill="#2a2521">
        <circle cx="150" cy="172" r="3.6"/><circle cx="300" cy="72" r="3.6"/><circle cx="450" cy="172" r="3.6"/>
        <circle cx="450" cy="330" r="3.6"/><circle cx="300" cy="330" r="3.6"/>
      </g>
    </g>

    <!-- Blyertsdetaljer inuti huset -->
    <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <!-- takstol: hanbjälke, kungsstolpe och två snedsträvor -->
      <path d="M176,176 Q300,177.5 424,176" stroke-width="1.75"/>
      <path d="M300,175 Q301,133 300,91" stroke-width="1.75"/>
      <path d="M238,175 Q267,143 296,110 M362,175 Q333,143 304,110" stroke-width="1.75"/>
      <!-- bjälklag mellan källare och bottenvåning -->
      <path d="M162,256 Q300,257.5 438,256"/>
      <!-- elskåpet -->
      <path d="M264,186 H304 Q305.5,214 304,242 H264 Q262.5,214 264,186 Z"/>
    </g>
    <!-- blixten i elskåpet -->
    <g transform="translate(261.2 191.2) scale(1.9)" fill="none" stroke="#2a2521" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13.5,2 L6,13 H11.5 L10,22 L18,10 H12.5 L14,2.5"/>
    </g>
    <!-- skruven på väg in i den högra väggen: huvud, skaft med gänga och spets inne i regeln -->
    <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M395,203 H404 Q405,214 404,225 H395 Q393.5,214 395,203 Z"/>
      <path d="M404,209 Q421,208 440,209 L451,214 L440,219 Q421,220 404,219"/>
      <path d="M409,219 L413,209 M416,219 L420,209 M423,219 L427,209 M430,219 L434,209 M437,219 L441,209" stroke-width="1.4"/>
    </g>
    <!-- droppen i källaren -->
    <g transform="translate(176.8 256.4) scale(2.2)" fill="none" stroke="#2a2521" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12,3 C11.5,4 6,10.5 6,14.5 A6,6 0 0 0 18,14.5 C18,10.5 12.5,4 12,3"/>
      <path d="M9,15 Q9.3,17.4 11.4,18.2"/>
    </g>
    <path d="M176,311 Q203,305.5 230,310" fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round"/>

    <!-- Altanen utanför den högra väggen: trallplan, ben och räcke -->
    <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M464,233 Q510,231.5 556,233"/>
      <path d="M468,239.5 Q510,238 552,239.5" stroke-width="1.5"/>
      <path d="M478,239 Q479,248 478,257.5 M544,239 Q545,248 544,257.5"/>
      <path d="M496,232 Q497,219 496,207 M516,232 Q517,219 516,207 M536,232 Q537,219 536,207 M554,232 Q555,219 554,207" stroke-width="1.6"/>
      <path d="M494,208 Q524,206.5 557,208"/>
    </g>

    <!-- Snickarpennans signatur under huset -->
    <path d="M130,374 Q246,368 360,372 T484,369" fill="none" stroke="#ad3519" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
