  <!-- Blyerts-2: två värmestreck som stiger ur rummet och slutar under isoleringen -->
  <g fill="none" stroke="#625a50" stroke-width="1.5" stroke-linecap="round">
    <path d="M214,350 q-6,-7 0,-14 q6,-7 0,-14 q-6,-7 0,-14"/>
    <path d="M262,346 q-6,-7 0,-14 q6,-7 0,-14 q-6,-7 0,-12"/>
  </g>

  <!-- Blyerts-2: måttbyglarna till vänster, 300 mm över den nya ullen och 200 mm över den gamla -->
