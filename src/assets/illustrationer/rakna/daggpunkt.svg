  </g>

  <!-- Blyerts: ytterväggen i snitt, innertaket och golvet -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150,44 Q148,180 150,300"/>
    <path d="M196,44 Q198,180 196,300"/>
    <path d="M150,46 Q173,44 196,46"/>
    <path d="M196,72 Q384,74 572,72"/>
    <path d="M48,300 Q310,302 572,300"/>
  </g>

  <!-- Blyerts: termometern mot väggens insida -->
  <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M206,86 Q218,84 230,86 Q232,142 230,198 Q218,200 206,198 Q204,142 206,86"/>
    <path d="M212,198 Q212,206 208,210 M224,198 Q224,206 228,210"/>
    <circle cx="218" cy="216" r="13"/>
    <path d="M218,212 Q217,190 218,168"/>
  </g>
  <g fill="none" stroke="#625a50" stroke-width="1.25" stroke-linecap="round">
    <path d="M221,102 h7 M221,118 h7 M221,134 h7 M221,150 h7 M221,166 h7 M221,182 h7"/>
    <path d="M198,106 h8 M198,182 h8"/>
  </g>

  <!-- Tumstock bakom nyckeltalet -->
  <rect x="296" y="194" width="84" height="26" fill="#e8b830" fill-opacity="0.65" transform="rotate(-1.5 338 207)"/>

  <!-- Snickarpenna: kondensen på den kalla ytan och pilen som pekar dit -->
