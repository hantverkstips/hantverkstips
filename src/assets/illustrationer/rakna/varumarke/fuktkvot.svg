<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="En vedkubbe som ligger ned med det gula ändträet och årsringarna vända mot läsaren, och en droppe ovanför.">
  <!-- Varumärkesillustration för /rakna/fuktkvot/, samma hand som symbolen, startsidans hero
       (hus-tumstock.svg) och daggpunkt.svg: konturer i blyerts 2 px med runda ändar, ingen
       linjering, transparent bakgrund, ett rött pennstreck som signatur.
       Motivet är "fukten i träet": en vedkubbe som ligger ned med ändträet vänt mot läsaren och en
       droppe ovanför. Ändträet är den största formen och den enda fyllda, i tumstock, med fyra
       årsringar, märgen och en torkspricka, så att det läses som trä vid 343 px. Barken är en
       ring utan fyllning runt ändträet. Kubbens kropp går snett bakåt uppåt till höger, så att
       bildens höjd fylls utan tom yta. Droppen är heroens droppe, i kontur.
       Ingen text-nod och inga läsbara tal. npm run illustrationer rör inte filen och den har ingen
       källa under illustrationer-kallor.
       Skala 600 × 360. Motivet är ritat i sin egen skala (bbox x 31–676, y 17–396, kvot 1,70) och
       läggs ut med transform="translate(-0.2 4.5) scale(0.848)" i yttre g:et. Uppmätt på den
       renderade bilden blir det 548 px brett (91,3 procent) och 322 px högt (89,4 procent), med
       26–27 px marginal i sidled och 19–20 px i höjdled.
       Tunnaste linje är 1,4 i motivets skala.
       Tokens: blyerts #2a2521, blyerts-2 #625a50, penna #ad3519, tumstock #e8b830. -->

  <g transform="translate(-0.2 4.5) scale(0.848)">

    <!-- Kubbens kropp: barkens konturer bakåt och den bortre änden -->
    <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M120.5,135.5 Q330,84 540,37.7"/>
      <path d="M179.5,364.5 Q388,309 594,247.3"/>
      <path d="M540,37.7 A108,108 0 0 1 594,247.3"/>
    </g>
    <!-- Barkens fåror längs kroppen -->
    <g fill="none" stroke="#625a50" stroke-width="1.4" stroke-linecap="round">
      <path d="M262,140 Q340,121 420,103"/>
      <path d="M300,200 Q400,175 500,150"/>
      <path d="M280,262 Q360,242 440,222"/>
      <path d="M470,74 Q520,62 566,52"/>
      <path d="M440,270 Q500,254 560,238"/>
    </g>

    <!-- Ändträet: barkringen, den gula ytan, årsringarna, märgen och torksprickan -->
    <circle cx="150" cy="250" r="118" fill="none" stroke="#2a2521" stroke-width="2"/>
    <path d="M150,145 C208,144 256,190 255,251 C254,309 207,356 149,355 C90,354 45,308 46,249 C47,191 94,146 150,145 Z" fill="#e8b830" stroke="#2a2521" stroke-width="2" stroke-linejoin="round"/>
    <g fill="none" stroke="#2a2521" stroke-width="1.6" stroke-linecap="round">
      <path d="M154,172 C197,173 228,208 227,252 C226,294 192,327 150,326 C108,325 75,291 76,249 C77,207 112,171 154,172 Z"/>
      <path d="M156,198 C185,199 204,222 203,252 C202,281 179,302 151,301 C123,300 101,277 102,250 C103,222 126,197 156,198 Z"/>
      <path d="M155,224 C170,225 180,237 179,252 C178,267 166,277 152,276 C138,275 127,264 128,250 C129,235 141,223 155,224 Z"/>
    </g>
    <circle cx="153" cy="251" r="5" fill="#2a2521"/>
    <path d="M156,247 L178,220 L188,212 L214,178" fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Droppen ovanför, heroens form -->
    <g transform="translate(96 18)" fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M36,0 C33,6 0,45 0,69 A36,36 0 0 0 72,69 C72,45 39,6 36,0"/>
      <path d="M18,72 Q19.8,86.4 32.4,91.2"/>
    </g>

    <!-- Snickarpennans signatur under motivet -->
    <path d="M180,392 Q260,397 340,390 Q420,387 500,392" fill="none" stroke="#ad3519" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
