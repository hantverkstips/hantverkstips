<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Ett rum sett rakt uppifrån som en enkel planritning, med väggar i dubbla linjer och en dörr i den nedre väggen som slår in i rummet. Utmed rummets vänstra och nedre sida ligger en tumstock vikt i tre segment med synliga leder, som mått på rummets båda sidor.">
  <!-- Varumärkesillustration för /rakna/kvadratmeter/, riktning 1. Samma hand som symbolen,
       startsidans hero (hus-tumstock.svg) och dräneringsbilden: konturer i blyerts 2 px med runda
       ändar, tumstocken som den enda fyllda färgen, ingen linjering, ingen skraffering, transparent
       bakgrund, ett rött pennstreck som signatur.
       Motivet är rummet, och det är bildens största form: en planritning uppifrån, väggarna i
       dubbla linjer så att det läses som en ritning och inte som en tom ruta, och en dörr som slår
       in med karm och slagning. Den öppna golvytan i mitten är själva poängen, det är den som ska
       räknas, så där ligger ingenting.
       Här är tumstocken rätt som form och inte bara accent (beslut 2026-09-19): den ligger vikt i
       tre segment med två leder, ett segment utmed rummets vänstra sida och två utmed den nedre,
       alltså exakt de två måtten sidan frågar efter. Ett enda långt segment utmed den nedre sidan
       lästes som en linjal och inte som en tumstock, därför är det delat. Lederna ritas som symbolen,
       med nit i blyerts och beslagsring i blyerts-2, och strecken på alla segment vänder in mot rummet.
       Ingen text-nod och inga läsbara tal: npm run illustrationer rör inte filen och den har ingen
       källa under illustrationer-kallor. Skala 600 × 360 som räknarnas skisser.
       Motivet är ritat i sin egen skala (rummet 550 × 282 utvändigt, vägg 18 px, dörröppning 100 px)
       och läggs ut med transform="translate(24.41 12.63) scale(0.935)" i yttre g:et. Uppmätt på den
       renderade bilden blir det 546 px brett (91,0 procent) och 321 px högt (89,2 procent), med
       27,0 px marginal i sidled och 19,5 px i höjdled.
       Tunnaste linje 1,2 i motivets skala.
       Tokens: tumstock #e8b830, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519. -->

  <g transform="translate(24.41 12.63) scale(0.935)">

    <!-- Rummets ytterlinjer, med hål i den nedre väggen där dörren sitter -->
    <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M34,10 Q309,7 584,10"/>
      <path d="M584,10 Q587,151 584,292"/>
      <path d="M584,292 Q492,295 400,292"/>
      <path d="M300,292 Q167,295 34,292"/>
      <path d="M34,292 Q31,151 34,10"/>
    </g>

    <!-- Rummets innerlinjer, samma hål -->
    <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M52,28 Q309,25 566,28"/>
      <path d="M566,28 Q569,151 566,274"/>
      <path d="M566,274 Q483,277 400,274"/>
      <path d="M300,274 Q176,277 52,274"/>
      <path d="M52,274 Q49,151 52,28"/>
    </g>

    <!-- Dörren: karmens sidor, dörrbladet öppet in i rummet och slagningen -->
    <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M300,274 Q298,283 300,292"/>
      <path d="M400,274 Q402,283 400,292"/>
      <path d="M300,272 Q298,222 300,172 Q305,170 310,172 Q312,222 310,272 Z"/>
      <path d="M300,172 A100,100 0 0 1 400,272"/>
    </g>

    <!-- Tumstocken vikt i tre segment utmed rummets två sidor, med lederna som i symbolen -->
    <g transform="translate(16 312)">
      <rect x="0" y="-12" width="284" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
      <path d="M24,-12 V-5.5 M48,-12 V-8.5 M72,-12 V-8.5 M96,-12 V-8.5 M120,-12 V-5.5 M144,-12 V-8.5 M168,-12 V-8.5 M192,-12 V-8.5 M216,-12 V-5.5 M240,-12 V-8.5 M264,-12 V-8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g transform="translate(300 312)">
      <rect x="0" y="-12" width="284" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
      <path d="M24,-12 V-5.5 M48,-12 V-8.5 M72,-12 V-8.5 M96,-12 V-8.5 M120,-12 V-5.5 M144,-12 V-8.5 M168,-12 V-8.5 M192,-12 V-8.5 M216,-12 V-5.5 M240,-12 V-8.5 M264,-12 V-8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g transform="translate(16 312) rotate(-90)">
      <rect x="0" y="-12" width="302" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
      <path d="M24,12 V5.5 M48,12 V8.5 M72,12 V8.5 M96,12 V8.5 M120,12 V5.5 M144,12 V8.5 M168,12 V8.5 M192,12 V8.5 M216,12 V5.5 M240,12 V8.5 M264,12 V8.5 M288,12 V8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g fill="none" stroke="#625a50" stroke-width="1.2">
      <circle cx="16" cy="312" r="9"/>
      <circle cx="300" cy="312" r="9"/>
    </g>
    <g fill="#2a2521">
      <circle cx="16" cy="312" r="4.5"/>
      <circle cx="300" cy="312" r="4.5"/>
    </g>

    <!-- Snickarpennans signatur under motivet -->
    <path d="M180,346 Q255,351 330,344 Q405,341 480,346" fill="none" stroke="#ad3519" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
