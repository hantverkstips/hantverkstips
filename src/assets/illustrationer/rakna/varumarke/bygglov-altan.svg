    <!-- Snickarpennans signatur under motivet -->
    <path d="M195,356 Q270,360.7 345,353.5 Q420,350.5 495,355.5" fill="none" stroke="#ad3519" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
