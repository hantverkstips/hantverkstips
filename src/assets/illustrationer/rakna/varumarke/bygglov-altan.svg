<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Ett hus med sadeltak står till vänster, och utanför husets högra vägg ligger en altan högt över marken på två plintar, med ett stort öppet utrymme under sig. Mitt i det utrymmet står en tumstock på marken och når upp till altangolvet, och visar hur högt golvet ligger. Marken är skrafferad och ligger på samma nivå i hela bilden.">
  <!-- Varumärkesillustration för /rakna/bygglov-altan/, riktning 1. Samma hand som symbolen,
       startsidans hero (hus-tumstock.svg) och dräneringsbilden: konturer i blyerts 2 px med runda
       ändar, tumstocken som den enda fyllda färgen, ingen linjering, transparent bakgrund, ett
       rött pennstreck som signatur.
       Huset är samma hus som i dräneringsbilden och i altanbilden, ritat i sin lokala skala 1,2
       med origo i husets nedre vänstra hörn (10, 262): bredd 276, vägg 145,2, samma 33,7 graders
       takfall, samma fönster, dörr och skorsten. Altanen är samma altan som i altanbilden, sedd
       snett uppifrån med samma trallband. Sajten har ett hus och en altan, inte flera.
       Skillnaden mot altanbilden är det enda motivet här: golvet ligger högt över marken. Därför
       är utrymmet under altanen öppet och 78 px högt mot altanens 12 px tjocka kant, och därför
       står tumstocken mitt i det utrymmet, från markytan upp till altangolvet, precis som
       djupmåttet i dräneringsbilden. Den är det enda gula i bilden och drar ögat till avståndet,
       för det är avståndet regeln bygger på.
       Plintarna är två, som i altanbilden, och breda block: en prototyp med tre smala plintar
       gjorde tumstocken till en stolpe bland stolpar vid 343 px. Nu står den ensam i ett 122 px
       brett fack mellan plintarna, är smalare än dem, har runda ändar, tumstreck och lutar sex
       grader, så att den läses som ett mått och inte som bärverk.
       Inget räcke. En prototyp med räcke lästes som en låg vägg ovanpå altanen och gjorde högra
       hörnet grötigt, och en bild med två motiv har inget motiv.
       Markytan ligger på y=262 i hela bilden och bryts bara där plintarna står i den, så att en
       plint är nedgrävd och inte ett block på en backe. Skrafferingen följer skissernas värden
       (10 px streck, 45 grader, blyerts-2 1,4 px) men glest, 26 px mellan strecken, och strecken
       som skulle hamna inne i en plint är utelämnade.
       Ingen text-nod och inga läsbara tal: npm run illustrationer rör inte filen och den har
       ingen källa under illustrationer-kallor. Skala 600 × 360, alltså 5:3 som räknarnas skisser.
       Motivet är ritat i sin egen skala (bbox x 1,5–595, y 23,5–360,5) och läggs ut med
       transform="translate(18.03 -1.52) scale(0.9454)" i yttre g:et. Uppmätt på den renderade
       bilden blir det 561,1 px brett (93,5 procent) och 318,6 px högt (88,5 procent), med 19,5 px
       marginal i sidled och 20,7 px i höjdled. Tunnaste linje är 1,4 i motivets skala, knappt
       1 px vid 343 px bredd.
       Tokens: tumstock #e8b830, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519. -->

  <g transform="translate(18.03 -1.52) scale(0.9454)">

    <!-- Marken. Den enda skrafferingen i bilden, glesare än skissernas. -->
    <g fill="none" stroke="#625a50" stroke-width="1.4" stroke-linecap="round">
      <path d="M18,272 l10,10 M44,272 l10,10 M70,272 l10,10 M96,272 l10,10 M122,272 l10,10 M148,272 l10,10 M174,272 l10,10 M200,272 l10,10 M226,272 l10,10 M252,272 l10,10 M278,272 l10,10 M304,272 l10,10 M382,272 l10,10 M408,272 l10,10 M434,272 l10,10 M460,272 l10,10 M538,272 l10,10 M564,272 l10,10"/>
      <path d="M31,304 l10,10 M57,304 l10,10 M83,304 l10,10 M109,304 l10,10 M135,304 l10,10 M161,304 l10,10 M187,304 l10,10 M213,304 l10,10 M239,304 l10,10 M265,304 l10,10 M291,304 l10,10 M317,304 l10,10 M343,304 l10,10 M369,304 l10,10 M395,304 l10,10 M421,304 l10,10 M447,304 l10,10 M473,304 l10,10 M499,304 l10,10 M525,304 l10,10 M551,304 l10,10 M577,304 l10,10"/>
      <path d="M18,334 l10,10 M44,334 l10,10 M70,334 l10,10 M96,334 l10,10 M122,334 l10,10 M148,334 l10,10 M174,334 l10,10 M200,334 l10,10 M226,334 l10,10 M252,334 l10,10 M278,334 l10,10 M304,334 l10,10 M330,334 l10,10 M356,334 l10,10 M382,334 l10,10 M408,334 l10,10 M434,334 l10,10 M460,334 l10,10 M486,334 l10,10 M512,334 l10,10 M538,334 l10,10 M564,334 l10,10"/>
    </g>

    <!-- Huset och markytan. En och samma nivå, y=262, bruten bara vid plintarna. -->
