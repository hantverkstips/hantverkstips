      <rect x="0" y="-8" width="90" height="16" rx="8" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
      <path d="M13,8 V2 M27,8 V4.5 M41,8 V4.5 M55,8 V2 M69,8 V4.5 M83,8 V4.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
