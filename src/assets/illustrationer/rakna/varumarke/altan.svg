      <path d="M33,280 l10,10 M59,280 l10,10 M85,280 l10,10 M111,280 l10,10 M137,280 l10,10 M163,280 l10,10 M189,280 l10,10 M215,280 l10,10 M241,280 l10,10 M267,280 l10,10 M345,280 l10,10 M371,280 l10,10 M397,280 l10,10 M423,280 l10,10 M501,280 l10,10 M527,280 l10,10 M553,280 l10,10 M579,280 l10,10"/>
