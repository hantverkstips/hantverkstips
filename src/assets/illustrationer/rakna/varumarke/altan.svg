    <!-- Tumstocken, uppslagen tvärs över trallen. Enda gula ytan, bara accent. -->
    <g transform="translate(286 178) rotate(-10)">
      <rect x="0" y="-8.5" width="128" height="17" rx="8.5" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
      <path d="M16,8.5 V2 M32,8.5 V4.5 M48,8.5 V4.5 M64,8.5 V2 M80,8.5 V4.5 M96,8.5 V4.5 M112,8.5 V2" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- Snickarpennans signatur under motivet -->
    <path d="M192,372 Q267,376.7 342,369.5 Q417,366.5 492,371.5" fill="none" stroke="#ad3519" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
