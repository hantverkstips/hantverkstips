<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Ett hus med sadeltak, fönster och dörr står till vänster, och utanför husets högra vägg ligger en altan som fyller resten av bilden, sedd snett uppifrån så att trallbrädorna syns som ett band av parallella brädor. Under altankanten går en regel, och två plintar är nedgrävda i den skrafferade marken. En tumstock ligger uppslagen tvärs över trallen.">
  <!-- Varumärkesillustration för /rakna/altan/, riktning 1. Samma hand som symbolen, startsidans
       hero (hus-tumstock.svg) och dräneringsbilden: konturer i blyerts 2 px med runda ändar,
       tumstocken som den enda fyllda färgen, ingen linjering, transparent bakgrund, ett rött
       pennstreck som signatur.
       Huset är samma hus som i dräneringsbilden, i samma skala, flyttat med translate(-296 39):
       bredd 230, vägg 121, samma 33,7 graders takfall, samma fönster, dörr och skorsten. Sajten
       har ett hus och en altan, inte flera.
       Motivet är altanen, inte huset: den tar 352 av motivets 592 px i bredd och ligger i bildens
       mitt och högra del. Den är ritad snett uppifrån så att en sjuåring ser de tre delarna
       verktyget räknar på ovanpå varandra: trallbrädorna som ett band av parallella brädor,
       regeln som en liggande balk under kanten, och två plintar som går ner i marken.
       Markytan ligger på y=238 i hela bilden och bryts bara där plintarna står i den, så att en
       plint är nedgrävd och inte ett block på en backe. Plintarna går tydligt under markytan,
       dels för att det är så de sätts, dels för att marken annars blir tom yta.
       Skrafferingen följer skissernas värden (10 px streck, 45 grader, blyerts-2 1,4 px) men
       glest, 26 px mellan strecken, och strecken som skulle hamna inne i en plint är utelämnade.
       Tumstocken är bara accent: ett segment som ligger uppslaget tvärs över trallen, det enda
       gula i bilden, och det som säger att sidan räknar och inte bara visar.
       Ingen text-nod och inga läsbara tal: npm run illustrationer rör inte filen och den har
       ingen källa under illustrationer-kallor. Skala 600 × 360, alltså 5:3 som räknarnas skisser.
       Motivet är ritat i sin egen skala (bbox x 5–597, y 39–376,5) och läggs ut med
       transform="translate(15.88 -16.12) scale(0.944)" i yttre g:et. Uppmätt på den renderade
       bilden blir det 558,8 px brett (93,1 procent) och 318,6 px högt (88,5 procent), med 20,6 px
       marginal i sidled och 20,7 px i höjdled. Tunnaste linje är 1,4 i motivets skala, knappt
       1 px vid 343 px bredd.
       Tokens: tumstock #e8b830, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519. -->

  <g transform="translate(15.88 -16.12) scale(0.944)">

