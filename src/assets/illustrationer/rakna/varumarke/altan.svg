      <path d="M33,344 l10,10 M59,344 l10,10 M85,344 l10,10 M111,344 l10,10 M137,344 l10,10 M163,344 l10,10 M189,344 l10,10 M215,344 l10,10 M241,344 l10,10 M267,344 l10,10 M293,344 l10,10 M319,344 l10,10 M345,344 l10,10 M371,344 l10,10 M397,344 l10,10 M423,344 l10,10 M449,344 l10,10 M475,344 l10,10 M501,344 l10,10 M527,344 l10,10 M553,344 l10,10 M579,344 l10,10"/>
    </g>

