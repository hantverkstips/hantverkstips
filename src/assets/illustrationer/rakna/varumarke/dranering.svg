<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Genomskärning genom husets grundmur där tumstocken är vikt till konturen, från markytan ner längs schaktkanten, runt sulan och upp längs muren till bjälklaget, med dräneringsröret som en cirkel i botten av schaktet, en droppe och vatten på golvet innanför källarväggen, och marken skrafferad runt om.">
  <!-- Varumärkesillustration för /rakna/dranering/, riktning 1. Samma hand som symbolen och
       startsidans hero (hus-tumstock.svg): tumstocken vikt till en form, gula segment med leder,
       streck och siffror i blyerts, ett rött pennstreck som signatur. Detta är ingen skiss på
       linjerat papper, och den upprepar inte skissen längre ner på sidan: här är schaktet formen.
       Tumstocken är vikt i fem segment längs snittets kontur, i den ordning man går den: markytan
       med fall bort från huset, schaktkanten ner, botten runt sulan, muren upp och bjälklaget in i
       huset. Leden i varje vinkel är en fylld nit i blyerts med beslagsring i blyerts-2. I botten
       av schaktet ligger dräneringsröret i genomskärning som en ring i blyerts, innanför
       källarväggen faller en droppe mot vattnet på källargolvet, och marken är skrafferad, den
       enda skrafferingen i bilden: kilen utanför schaktet och ett band under hela snittet, som
       säger att schaktet är uppgrävt ur marken och att huset står på den. Måttstrecken och
       siffrorna 20, 40, 60 och 80 är ritade som banor och är textur, inte information. Bakgrunden
       är transparent så att sidans papper syns igenom. Ingen text-nod: npm run illustrationer rör
       inte filen och den har ingen källa under illustrationer-kallor.
       Skala 600 × 360, alltså 5:3 som räknarnas skisser, så att bilden ligger i samma rutnät och
       på samma gallerikort som dem, inte heroens 600 × 420.
       Motivet är ritat i sin egen skala (bbox x 16,8–539, y 95,9–399,6) och läggs ut med
       transform="translate(7 -81.1) scale(1.0538)" i yttre g:et. Uppmätt på den renderade bilden
       blir det 550,7 px brett (91,8 procent) och 320 px högt (88,9 procent), med 24,7 px marginal
       i sidled och 20 px i höjdled. Tunnaste linje är 1,4 i motivets skala, knappt 1 px vid 343 px
       bredd; allt som blev gröt där är struket, bland annat makadamen runt röret.
       Tokens: tumstock #e8b830, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519. -->

  <defs>
    <!-- Siffror på tumstocken. Höjd 12, bredd 6,5, blyerts. Samma banor som i hus-tumstock.svg. -->
    <g id="d0" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.25,.6 Q6.2,.6 6.2,6 Q6.2,11.4 3.25,11.4 Q.3,11.4 .3,6 Q.3,.6 3.25,.6 Z"/>
    </g>
    <g id="d2" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M.6,3.3 Q.8,.6 3.3,.6 Q6.1,.6 6.1,3.6 Q6.1,6.2 .6,11.4 L6.3,11.3"/>
    </g>
    <g id="d4" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.8,11.4 V.8 L.3,8 H6.4"/>
    </g>
    <g id="d6" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5.7,1.2 Q3,.2 1.5,3.9 Q.3,6.6 .7,9.1 Q1.3,11.6 3.5,11.5 Q6.1,11.4 6.1,8.7 Q6.1,6 3.5,6 Q1.5,6 .9,7.6"/>
    </g>
    <g id="d8" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.25,5.9 Q.6,5.5 .6,3.1 Q.6,.6 3.25,.6 Q5.9,.6 5.9,3.1 Q5.9,5.5 3.25,5.9 Q6.4,6.3 6.4,8.8 Q6.4,11.4 3.25,11.4 Q.1,11.4 .1,8.8 Q.1,6.3 3.25,5.9 Z"/>
    </g>
  </defs>

  <g transform="translate(7 -81.1) scale(1.0538)">

    <!-- Marken, den enda skrafferingen. Raderna klipps av markytan ovanför och av schaktkanten till
         höger, och de två nedersta går obrutna under hela snittet, också under huset. -->
    <g fill="none" stroke="#625a50" stroke-width="1.4" stroke-linecap="round">
      <path d="M44,162 l10,10 M70,162 l10,10 M96,162 l10,10 M122,162 l10,10 M148,162 l10,10"/>
      <path d="M31,190 l10,10 M57,190 l10,10 M83,190 l10,10 M109,190 l10,10 M135,190 l10,10 M161,190 l10,10"/>
      <path d="M18,218 l10,10 M44,218 l10,10 M70,218 l10,10 M96,218 l10,10 M122,218 l10,10 M148,218 l10,10 M174,218 l10,10"/>
      <path d="M31,246 l10,10 M57,246 l10,10 M83,246 l10,10 M109,246 l10,10 M135,246 l10,10 M161,246 l10,10 M187,246 l10,10"/>
      <path d="M18,274 l10,10 M44,274 l10,10 M70,274 l10,10 M96,274 l10,10 M122,274 l10,10 M148,274 l10,10 M174,274 l10,10"/>
      <path d="M31,302 l10,10 M57,302 l10,10 M83,302 l10,10 M109,302 l10,10 M135,302 l10,10 M161,302 l10,10 M187,302 l10,10"/>
      <path d="M18,330 l10,10 M44,330 l10,10 M70,330 l10,10 M96,330 l10,10 M122,330 l10,10 M148,330 l10,10 M174,330 l10,10 M200,330 l10,10 M226,330 l10,10 M252,330 l10,10 M278,330 l10,10 M304,330 l10,10 M330,330 l10,10 M356,330 l10,10 M382,330 l10,10 M408,330 l10,10 M434,330 l10,10 M460,330 l10,10 M486,330 l10,10 M512,330 l10,10"/>
      <path d="M31,358 l10,10 M57,358 l10,10 M83,358 l10,10 M109,358 l10,10 M135,358 l10,10 M161,358 l10,10 M187,358 l10,10 M213,358 l10,10 M239,358 l10,10 M265,358 l10,10 M291,358 l10,10 M317,358 l10,10 M343,358 l10,10 M369,358 l10,10 M395,358 l10,10 M421,358 l10,10 M447,358 l10,10 M473,358 l10,10 M499,358 l10,10 M525,358 l10,10"/>
    </g>

    <!-- Innanför källarväggen: källargolvet, vattnet på golvet och droppen ovanför. -->
    <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round">
      <path d="M400,292 Q469,293.5 538,292"/>
      <path d="M432,292.5 Q469,281 506,292"/>
    </g>
    <g transform="translate(439 194.5) scale(2.5)" fill="none" stroke="#2a2521" stroke-width=".8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12,3 C11.5,4 6,10.5 6,14.5 A6,6 0 0 0 18,14.5 C18,10.5 12.5,4 12,3"/>
      <path d="M9,15 Q9.3,17.4 11.4,18.2"/>
    </g>

    <!-- Tumstocken vikt till snittets kontur -->
    <g>
      <!-- 1. markytan med fall bort från huset -->
      <g transform="translate(20 145) rotate(-5.3051)">
        <rect x="0" y="-12" width="140.6" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
        <path d="M14,12 V5.5 M30,12 V8.5 M46,12 V8.5 M62,12 V5.5 M78,12 V8.5 M94,12 V8.5 M110,12 V5.5 M126,12 V8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
        <use href="#d2" x="56" y="-9"/><use href="#d0" x="65" y="-9"/>
      </g>
      <!-- 2. schaktkanten ner mot botten -->
      <g transform="translate(160 132) rotate(65.6063)">
        <rect x="0" y="-12" width="188.86" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
        <path d="M14,12 V5.5 M30,12 V8.5 M46,12 V8.5 M62,12 V5.5 M78,12 V8.5 M94,12 V8.5 M110,12 V5.5 M126,12 V8.5 M142,12 V8.5 M158,12 V5.5 M174,12 V8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
        <use href="#d4" x="100" y="-9"/><use href="#d0" x="109" y="-9"/>
      </g>
      <!-- 3. botten runt sulan -->
      <g transform="translate(238 304)">
        <rect x="0" y="-12" width="150" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
        <path d="M14,12 V5.5 M30,12 V8.5 M46,12 V8.5 M62,12 V5.5 M78,12 V8.5 M94,12 V8.5 M110,12 V5.5 M126,12 V8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
        <use href="#d6" x="110" y="-9"/><use href="#d0" x="119" y="-9"/>
      </g>
      <!-- 4. muren upp till sockeln -->
      <g transform="translate(388 304) rotate(-90)">
        <rect x="0" y="-12" width="195" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
        <path d="M14,12 V5.5 M30,12 V8.5 M46,12 V8.5 M62,12 V5.5 M78,12 V8.5 M94,12 V8.5 M110,12 V5.5 M126,12 V8.5 M142,12 V8.5 M158,12 V5.5 M174,12 V8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
        <use href="#d8" x="100" y="-9"/><use href="#d0" x="109" y="-9"/>
      </g>
      <!-- 5. bjälklaget in i huset -->
      <g transform="translate(388 109)">
        <rect x="0" y="-12" width="150" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
        <path d="M14,12 V5.5 M30,12 V8.5 M46,12 V8.5 M62,12 V5.5 M78,12 V8.5 M94,12 V8.5 M110,12 V5.5 M126,12 V8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <!-- Lederna: nit i blyerts med beslagsring i blyerts-2 -->
      <g fill="none" stroke="#625a50" stroke-width="1.2">
        <circle cx="160" cy="132" r="7"/><circle cx="238" cy="304" r="7"/><circle cx="388" cy="304" r="7"/><circle cx="388" cy="109" r="7"/>
      </g>
      <g fill="#2a2521">
        <circle cx="160" cy="132" r="3.6"/><circle cx="238" cy="304" r="3.6"/><circle cx="388" cy="304" r="3.6"/><circle cx="388" cy="109" r="3.6"/>
      </g>
    </g>

    <!-- Dräneringsröret i genomskärning, i botten av schaktet utanför sulan -->
    <g fill="none" stroke="#2a2521" stroke-width="2">
      <circle cx="310" cy="270" r="22"/>
      <circle cx="310" cy="270" r="13.5"/>
    </g>

    <!-- Snickarpennans signatur under motivet -->
    <path d="M102,397 Q220,391.5 328,395 T454,392.5" fill="none" stroke="#ad3519" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
