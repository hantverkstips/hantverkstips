      <path d="M19,249 l10,10 M45,249 l10,10 M71,249 l10,10 M97,249 l10,10 M123,249 l10,10 M149,249 l10,10 M331,249 l10,10 M357,249 l10,10 M383,249 l10,10 M409,249 l10,10 M435,249 l10,10 M461,249 l10,10 M487,249 l10,10 M513,249 l10,10 M539,249 l10,10 M565,249 l10,10"/>
      <path d="M32,285 l10,10 M58,285 l10,10 M84,285 l10,10 M110,285 l10,10 M136,285 l10,10 M162,285 l10,10 M318,285 l10,10 M344,285 l10,10 M370,285 l10,10 M396,285 l10,10 M422,285 l10,10 M448,285 l10,10 M474,285 l10,10 M500,285 l10,10 M526,285 l10,10 M552,285 l10,10 M578,285 l10,10"/>
      <path d="M19,318 l10,10 M45,318 l10,10 M71,318 l10,10 M97,318 l10,10 M123,318 l10,10 M149,318 l10,10 M175,318 l10,10 M201,318 l10,10 M227,318 l10,10 M253,318 l10,10 M279,318 l10,10 M305,318 l10,10 M331,318 l10,10 M357,318 l10,10 M383,318 l10,10 M409,318 l10,10 M435,318 l10,10 M461,318 l10,10 M487,318 l10,10 M513,318 l10,10 M539,318 l10,10 M565,318 l10,10"/>
    </g>

    <!-- Huset, markytan och den öppna schakten längs grunden -->
    <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5,202 Q89.9,197.5 175,199"/>
      <path d="M175,199 Q186.5,246.5 192,295"/>
      <path d="M192,295 Q247,298 302,295"/>
      <path d="M302,295 Q303.6,246.8 310,199"/>
      <path d="M310,199 Q425,201.4 540,199"/>
      <path d="M310,199 Q312.4,138.5 310,78"/>
