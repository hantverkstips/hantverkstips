<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="Ett hus med sadeltak och skorsten. Längs husets vänstra sida är marken uppgrävd i en öppen schakt längs grunden, djupare än husets underkant, med dräneringsröret i botten sett i genomskärning som en ring och en tumstock stående i schaktet som djupmått. Marken runt om är skrafferad.">
  <!-- Varumärkesillustration för /rakna/dranering/, riktning 1. Samma hand som symbolen och
       startsidans hero (hus-tumstock.svg): konturer i blyerts 2 px med runda ändar, tumstocken
       som den enda fyllda färgen, ingen linjering, transparent bakgrund, ett rött pennstreck som
       signatur. Huset är heroens hus i proportion: bredd 230, vägg 121 (0,527 av bredden), takfall
       76,7 (0,333), samma 33,7 graders lutning.
       Motivet är "gräva runt huset" och ska förstås på en sekund (regeln i DESIGN.md avsnitt 7
       ändrad 2026-09-19 efter prototypen: ett snitt som kräver att man vet vad man tittar på är
       fel bild). Därför: ett hus som en sjuåring känner igen, med sadeltak, skorsten, ett fönster
       och en dörr, stående på marken, och rakt intill grunden en öppen schakt som är urgrävd ur
       den skrafferade marken och går djupare än husets underkant. I botten ligger dräneringsröret
       i genomskärning som en ring. Tumstocken är inte längre motivets form utan en accent: ett
       segment stående i schaktet som djupmått, det enda gula i bilden, och det som drar ögat ner
       i gropen. Skrafferingen är den enda i bilden och den går under huset, så att huset står på
       marken i stället för att sväva.
       Ingen text-nod och inga läsbara tal: npm run illustrationer rör inte filen och den har ingen
       källa under illustrationer-kallor. Skala 600 × 360, alltså 5:3 som räknarnas skisser, så att
       bilden ligger i samma rutnät och på samma gallerikort som dem, inte heroens 600 × 420.
       Motivet är ritat i sin egen skala (bbox x 4–596, y 0,3–344,6) och läggs ut med
       transform="translate(21.2 19.7) scale(0.9293)" i yttre g:et. Uppmätt på den renderade
       bilden blir det 550,2 px brett (91,7 procent) och 320 px högt (88,9 procent), med 24,9 px
       marginal i sidled och 20,0 px i höjdled. Tunnaste linje är 1,4 i motivets skala, knappt
       1 px vid 343 px bredd.
       Tokens: tumstock #e8b830, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519. -->

  <g transform="translate(21.2 19.7) scale(0.9293)">

    <!-- Marken. Den enda skrafferingen i bilden. -->
    <g fill="none" stroke="#625a50" stroke-width="1.4" stroke-linecap="round">
