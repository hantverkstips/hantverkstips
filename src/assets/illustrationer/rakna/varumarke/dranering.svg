      <path d="M304,82 Q366.1,44 425,1.3 Q483.9,44 546,82"/>
      <path d="M480,38 Q482,26 480,14 Q490,16 500,14 Q498,32.7 500,51.4"/>
      <path d="M468,199 Q470,165.5 468,132 Q485,134 502,132 Q500,165.5 502,199"/>
      <path d="M348,95 Q368,97 388,95 Q386,114 388,133 Q368,131 348,133 Q350,114 348,95 Z"/>
    </g>
    <g fill="none" stroke="#2a2521" stroke-width="1.75" stroke-linecap="round">
      <path d="M368,95 Q366.4,114 368,133"/>
      <path d="M348,114 Q368,115.6 388,114"/>
    </g>

    <!-- Dräneringsröret i genomskärning, i botten av schaktet utanför sulan -->
    <g fill="none" stroke="#2a2521" stroke-width="2">
      <circle cx="224" cy="268" r="24"/>
      <circle cx="224" cy="268" r="14"/>
    </g>

    <!-- Tumstocken som djupmått, stående i schaktet mot grundmuren -->
  <g transform="translate(272 289) rotate(-94)">
    <rect x="0" y="-8" width="116" height="16" rx="8" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
    <path d="M14,8 V2 M30,8 V4.5 M46,8 V4.5 M62,8 V4.5 M78,8 V2 M94,8 V4.5 M110,8 V4.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
  </g>

    <!-- Snickarpennans signatur under motivet -->
    <path d="M175,340.5 Q250.1,345.2 325,338 Q400.1,335 475,340" fill="none" stroke="#ad3519" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
