<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" role="img" aria-label="En skrivplatta på tvären med ett papper där tre rader har var sin bockad ruta och ett streck. Klämman överst är gul, en signatur står nederst, och under plattan ligger en tumstock som sticker ut åt höger.">
  <!-- Varumärkesillustration för /rakna/kontrollplan/. Samma hand som symbolen, startsidans hero och
       de andra räknarnas bilder: konturer i blyerts 2 px med runda ändar, tumstocken och klämman som
       de enda fyllda ytorna, ingen linjering, transparent bakgrund, ett rött pennstreck som signatur.
       Motivet (specen docs/briefer/spec-kalkyl-kontrollplan-2026-09-28.md 12.2): en skrivplatta på
       tvären, liggande som utskriften, med tre rader. Varje rad har en ruta med en bock till vänster
       och ett streck till höger, så att bilden läses som en lista som bockas av. Nederst på papperet
       står signaturen, snickarpennans enda streck. Klämman överst är tumstocksgul. En tumstock i två
       segment, delvis utfälld, ligger under plattans nederkant och sticker ut till höger; det är den
       som ger bredden.
       Plattans och papperets överkant bryts där klämman går fram, i stället för att klämman täcker
       dem med en fylld yta.
       Ingen text-nod och inga läsbara tal: npm run illustrationer rör inte filen och den har ingen
       källa under illustrationer-kallor. Skala 600 × 360.
       Motivet är ritat i skala 1 och läggs ut med transform="translate(3 11)" i yttre g:et. Uppmätt
       på den renderade bilden 2026-09-28: 554 px brett (92,3 procent) och 324 px högt (90,0 procent),
       bbox-kvot 1,71, med 22 till 24 px marginal i sidled och 18 px i höjdled. Tunnaste linje är 1,2.
       Tokens: tumstock #e8b830, blyerts #2a2521, blyerts-2 #625a50, penna #ad3519. -->

  <g transform="translate(3 11)">

    <!-- Plattan, med överkanten bruten där klämman sitter -->
    <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M175,30.5 Q103,29 34,30.8 Q20.5,30.5 20,44 Q22.4,165 20.4,286 Q20.6,300.2 34,300 Q230,302.6 426,299.6 Q440.2,300 440,286 Q437.8,165 440.2,44 Q440,30.4 426,30.6 Q356,29.2 285,30.5"/>
    </g>

    <!-- Papperet på plattan, också brutet vid klämman -->
    <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M175,56.8 Q106,55.6 40,57 Q38.6,170 40.4,283.6 Q230,285.4 420,283 Q421.6,170 419.6,56.6 Q352,55.4 285,56.8"/>
    </g>

    <!-- Tre rader: ruta med bock och ett streck -->
    <g fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M64,86 Q79,84.8 94,86.4 Q95,101 93.6,116 Q79,117.2 64.4,115.8 Q63,101 64,86 Z"/>
      <path d="M64,146 Q79,144.8 94,146.4 Q95,161 93.6,176 Q79,177.2 64.4,175.8 Q63,161 64,146 Z"/>
      <path d="M64,206 Q79,204.8 94,206.4 Q95,221 93.6,236 Q79,237.2 64.4,235.8 Q63,221 64,206 Z"/>
      <path d="M118,102 Q256,99.6 394,101.8"/>
      <path d="M118,162 Q248,164.2 380,161.4"/>
      <path d="M118,222 Q232,219.8 346,222.4"/>
    </g>
    <g fill="none" stroke="#2a2521" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M69,100 Q74.5,105.5 78,111 Q86.5,95 99,80"/>
      <path d="M69,160 Q74.5,165.5 78,171 Q86.5,155 99,140"/>
      <path d="M69,220 Q74.5,225.5 78,231 Q86.5,215 99,200"/>
    </g>

    <!-- Klämman, tumstocksgul, med bygeln överst och två nitar -->
    <path d="M205,20 Q206,8 218,8 L242,8 Q254,8 255,20" fill="none" stroke="#2a2521" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M186,20 Q230,18.6 274,20 Q285,20.2 285,30 L284.6,52 Q284.4,61 275,61 Q230,62.6 185,61 Q175.6,61 175.4,52 L175,30 Q175,20.2 186,20 Z" fill="#e8b830" stroke="#2a2521" stroke-width="2" stroke-linejoin="round"/>
    <g fill="#2a2521">
      <circle cx="193" cy="44" r="3.5"/>
      <circle cx="267" cy="44" r="3.5"/>
    </g>

    <!-- Tumstocken under plattans nederkant, två segment med leden som i symbolen -->
    <g transform="translate(236 318)">
      <rect x="0" y="-12" width="176" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
      <path d="M24,-12 V-5.5 M48,-12 V-8.5 M72,-12 V-8.5 M96,-12 V-8.5 M120,-12 V-5.5 M144,-12 V-8.5 M168,-12 V-8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g transform="translate(412 318) rotate(-14)">
      <rect x="0" y="-12" width="164" height="24" rx="12" fill="#e8b830" stroke="#2a2521" stroke-width="2"/>
      <path d="M24,-12 V-5.5 M48,-12 V-8.5 M72,-12 V-8.5 M96,-12 V-8.5 M120,-12 V-5.5 M144,-12 V-8.5" fill="none" stroke="#2a2521" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <circle cx="412" cy="318" r="9" fill="none" stroke="#625a50" stroke-width="1.2"/>
    <circle cx="412" cy="318" r="4.5" fill="#2a2521"/>

    <!-- Snickarpennans signatur nederst på papperet -->
    <path d="M250,262 Q262,244 270,256 Q276,268 288,250 Q296,240 300,258 Q304,270 318,254 Q340,246 392,256" fill="none" stroke="#ad3519" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
